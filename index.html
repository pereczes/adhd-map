<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ADHD map</title>
  <link rel="stylesheet" href="shared/style.css">
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.34.3/dist/cytoscape.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/layout-base@2.0.1/layout-base.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cose-base@2.2.0/cose-base.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/cytoscape-fcose@2.2.0/cytoscape-fcose.js"></script>
</head>
<body>
  <div class="app">
    <header class="toolbar">
      <h1 data-ui="title">ADHD map</h1>
      <span class="spacer"></span>
      <input id="search" type="search" list="node-list" data-ui-placeholder="find_node" placeholder="Find a node" autocomplete="off">
      <datalist id="node-list"></datalist>
      <button id="fit" type="button" data-ui="fit">Fit</button>
      <button id="expand-all" type="button" data-ui="expand_all">Expand all</button>
      <button id="reset" type="button" data-ui="reset">Reset</button>
      <button id="options-toggle" type="button" data-ui="options">Options</button>
      <select id="language" aria-label="Language"></select>
      <a class="switch" href="sources.html" data-ui="sources" data-keep-lang>Sources</a>
    </header>
    <main class="graph">
      <div id="graph"></div>
      <div id="legend" class="legend"></div>
      <div id="options" class="options" hidden></div>
      <div id="popup" class="popup" hidden></div>
    </main>
    <aside id="panel" class="panel"></aside>
  </div>
  <script src="shared/graph-data.js"></script>
  <script src="shared/i18n.js"></script>
  <script src="shared/options.js"></script>
  <script src="shared/explorer.js"></script>
  <script src="shared/panel.js"></script>
  <script src="app.js"></script>
</body>
</html>
