nodes:
  # ---------------------------------------------------------------- hub
  adhd:
    label: ADHD
    description: >-
      Attention deficit hyperactivity disorder is a neurodevelopmental
      condition that affects attention regulation, activity level, impulse
      control and executive function. Click a cluster to explore its symptoms,
      then follow the links to triggers, coping strategies and impacts.

  # ---------------------------------------------------------------- cluster
  inattention:
    label: Inattention
    description: >-
      Difficulty directing and holding attention where it is needed, and
      sometimes the opposite problem of not being able to let go of it.
  hyperactivity:
    label: "Hyperactivity & impulsivity"
    description: >-
      An inner motor that keeps running, and actions that arrive before the
      thought that should have preceded them. In adults hyperactivity is often
      felt rather than seen.
  executive:
    label: Executive function
    description: >-
      The management layer of the brain: starting, planning, sequencing,
      prioritising, keeping track of time and holding things in mind.
  emotional:
    label: Emotional regulation
    description: >-
      Emotions that arrive fast, hit hard and take longer to settle. Not part
      of the formal diagnostic criteria, but one of the most disabling aspects
      for many adults.

  # ---------------------------------------------------------------- symptom
  distractibility:
    label: Distractibility
    description: >-
      Attention is pulled away by outside stimuli or by internal thoughts,
      even in the middle of tasks that matter.
  sustained-attention:
    label: Difficulty sustaining attention
    description: >-
      Long, low-stimulation tasks such as reading, forms or meetings are hard
      to stay with. Attention is not absent, it is unevenly available.
  hyperfocus:
    label: Hyperfocus
    description: >-
      Intense, hard-to-break absorption in an interesting task, often at the
      expense of everything else including food, sleep and other people.
  forgetfulness:
    label: Forgetfulness
    description: >-
      Appointments, promises and routine tasks slip away. Usually not from
      lack of caring but from the reminder never arriving at the right moment.
  losing-things:
    label: Losing things
    description: >-
      Keys, phone, wallet, documents. Items put down "for a second" vanish.
  careless-mistakes:
    label: Careless mistakes
    description: >-
      Details get skipped in work or paperwork despite knowing the material
      well.
  restlessness:
    label: Restlessness
    description: >-
      Sitting still feels uncomfortable. In adults this is often an inner
      tension rather than visible movement.
  fidgeting:
    label: Fidgeting
    description: >-
      Tapping, bouncing, picking, shifting. Often a self-regulation strategy
      rather than a distraction.
  impulsivity:
    label: Impulsivity
    description: >-
      Acting before thinking: blurting things out, impulse purchases, snap
      decisions and risky choices.
  interrupting:
    label: "Interrupting & talking a lot"
    description: >-
      Finishing other people's sentences, jumping into conversations,
      monologuing about a favourite topic.
  impatience:
    label: Impatience
    description: >-
      Waiting in queues, in traffic or for a slow answer feels physically hard
      to bear.
  task-initiation:
    label: Task initiation difficulty
    description: >-
      Knowing exactly what to do and being unable to start. Sometimes called
      ADHD paralysis.
  procrastination:
    label: Procrastination
    description: >-
      Delaying tasks until the pressure of a deadline supplies enough urgency
      to act.
  time-blindness:
    label: Time blindness
    description: >-
      A weak sense of how much time has passed and how long things take.
      Chronic lateness and over-committing follow.
  disorganisation:
    label: Disorganisation
    description: >-
      Piles, cluttered spaces, chaotic files, lost paperwork.
  working-memory:
    label: Working memory problems
    description: >-
      Holding several things in mind at once is hard: multi-step instructions,
      mental arithmetic, remembering why you walked into a room.
  prioritising:
    label: Difficulty prioritising
    description: >-
      Everything feels equally urgent, or the least important task gets done
      first because it is the most interesting one.
  task-switching:
    label: Difficulty switching tasks
    description: >-
      Transitions are costly. Hard to stop what you are doing, and hard to
      start the next thing.
  emotional-dysregulation:
    label: Emotional dysregulation
    description: >-
      Emotions arrive quickly and strongly and take longer to settle than the
      situation seems to warrant.
  rejection-sensitivity:
    label: Rejection sensitivity
    description: >-
      Perceived criticism or rejection triggers intense emotional pain. Not a
      formal diagnostic term, but very widely reported.
  frustration-tolerance:
    label: Low frustration tolerance
    description: >-
      Small obstacles can produce disproportionate anger, or the urge to give
      up entirely.
  boredom-intolerance:
    label: Boredom intolerance
    description: >-
      Under-stimulation feels aversive. The mind goes looking for novelty or
      intensity wherever it can find it.
  sleep-problems:
    label: Sleep problems
    description: >-
      Trouble falling asleep, a delayed body clock, and staying up late to
      reclaim time that the day did not provide.

  rumination:
    label: Rumination
    description: >-
      The same worry replaying on a loop: the task, the email, the thing you
      said. It feels like thinking but produces no decision and burns energy.
  avoidance:
    label: Avoidance
    description: >-
      Steering around the task, the message or the person that triggers the
      dread. Relief now, a bigger problem later.
  out-of-sight:
    label: "Out of sight, out of mind"
    description: >-
      What is not visible stops existing: the bill in the drawer, the
      vegetables behind the milk, the friend you did not text back.
  decision-paralysis:
    label: Decision paralysis
    description: >-
      Too many options, each one needing a decision, so none gets made. Piles
      are often stacks of postponed decisions.
  anticipatory-anxiety:
    label: Dread before the task
    description: >-
      Anxiety that arrives long before the task and often costs more than the
      task itself.

  # ---------------------------------------------------------------- trigger
  boring-tasks:
    label: Boring or repetitive tasks
    description: >-
      Low-interest tasks provide too little stimulation to hold attention.
  poor-sleep:
    label: Lack of sleep
    description: >-
      Almost every ADHD symptom gets worse after a bad night.
  noisy-environment:
    label: Noisy environment
    description: >-
      Open-plan offices, cafés, a television in the background.
  unclear-instructions:
    label: Unclear instructions
    description: >-
      Vague or verbal-only tasks leave nothing to anchor on.
  notifications:
    label: "Notifications & phone"
    description: >-
      Every buzz is an invitation to leave the task.
  stress:
    label: "Stress & overload"
    description: >-
      Too many demands at once shrink an already limited executive capacity.
  long-meetings:
    label: Long meetings
    description: >-
      An hour of passive listening with no interaction.
  open-ended-tasks:
    label: Open-ended tasks
    description: >-
      No clear start, no clear end, no definition of done.
  hunger:
    label: "Hunger & skipped meals"
    description: >-
      Forgetting to eat, then crashing.

  # ---------------------------------------------------------------- strategy
  body-doubling:
    label: Body doubling
    description: >-
      Working alongside another person, in the same room or on a video call,
      whose presence makes starting and staying on task easier.
  pomodoro:
    label: Pomodoro timer
    description: >-
      Work in short timed sprints with breaks in between. The timer supplies
      structure and, importantly, an end point.
  visual-timers:
    label: Visual timers
    description: >-
      Timers that show time as a shrinking disc or bar make the passing of
      time visible.
  external-reminders:
    label: "Alarms & external reminders"
    description: >-
      Move memory out of the head: phone alarms, calendar notifications,
      sticky notes at the point of action.
  task-breakdown:
    label: Break tasks into tiny steps
    description: >-
      Turn "write the report" into "open the document, write one heading". The
      first step should be almost trivially small.
  checklists:
    label: Written checklists
    description: >-
      Put the plan on paper so working memory does not have to hold it.
  home-for-things:
    label: A home for everything
    description: >-
      Fixed spots for keys, wallet and glasses. A bowl by the door beats a
      mental note.
  exercise:
    label: Regular exercise
    description: >-
      Aerobic activity improves attention and mood for hours afterwards and
      helps with sleep.
  sleep-routine:
    label: Consistent sleep routine
    description: >-
      A fixed wake time, a wind-down ritual, screens out of the bedroom.
  mindfulness:
    label: Mindfulness practice
    description: >-
      Short, regular practice in noticing attention drifting and emotions
      rising before they take over.
  fidget-tools:
    label: Fidget tools
    description: >-
      Giving the body something to do can free attention rather than consume
      it.
  noise-control:
    label: "Headphones & white noise"
    description: >-
      Noise-cancelling headphones or steady background sound reduce auditory
      distraction.
  time-boxing:
    label: Time-boxing the calendar
    description: >-
      Give every task a slot in the calendar with a realistic, usually longer,
      estimate.
  accountability-partner:
    label: Accountability partner
    description: >-
      Tell someone what you will do by when, and report back.
  routines:
    label: "Routines & habit stacking"
    description: >-
      Attach new habits to existing anchors (after coffee, take medication) so
      fewer decisions are needed.
  prepare-night-before:
    label: Prepare the night before
    description: >-
      Clothes, bag, lunch and keys laid out. Mornings then run on autopilot.
  externalise-memory:
    label: Externalise working memory
    description: >-
      Whiteboards, notes apps, voice memos. Capture the thought the moment it
      appears.
  dopamine-menu:
    label: Dopamine menu
    description: >-
      A pre-written list of healthy rewarding activities to reach for instead
      of endless scrolling.
  gamification:
    label: Gamify tasks
    description: >-
      Points, streaks, races against a timer. Novelty and competition create
      the urgency that boring tasks lack.
  single-tasking:
    label: Single-tasking
    description: >-
      One tab, one task, one thing on the desk. Shrink the surface area for
      distraction.
  done-not-perfect:
    label: Done beats perfect
    description: >-
      Lower the bar deliberately. Perfectionism is a common driver of
      procrastination.
  pause-before-acting:
    label: Pause before acting
    description: >-
      A built-in delay: 24 hours before a purchase, a slow breath before
      replying.
  self-compassion:
    label: Self-compassion
    description: >-
      Treat slips as data rather than as evidence of failure. Shame fuels
      avoidance.
  decision-reduction:
    label: Reduce decisions
    description: >-
      Fewer choices to make: standard meals, a small wardrobe, default
      answers.

  movement-breaks:
    label: Movement breaks
    description: >-
      A short walk, a flight of stairs or a stretch every hour. Walking
      meetings and a standing desk count too.
  write-it-down-instead:
    label: Write it down instead of saying it
    description: >-
      During a conversation, jot the thought on paper so it stops pressing to
      come out. It can be raised once the other person has finished.
  item-trackers:
    label: Bluetooth trackers
    description: >-
      Small tags on keys, wallet and bag, and a phone that can make them ring.
      Turns a twenty-minute search into a twenty-second one.
  duplicate-essentials:
    label: Duplicate essentials
    description: >-
      Spare keys with a neighbour, a charger in every bag, reading glasses in
      every room. Losing one copy stops being a crisis.
  final-review-pass:
    label: Final review pass
    description: >-
      A separate, deliberate check after the work feels finished, ideally
      after a break and against a short list of your typical slips.
  written-instructions:
    label: Ask for written instructions
    description: >-
      Ask for tasks by message or email, or write up what you heard and send
      it back for confirmation.
  repeat-back:
    label: Repeat back and summarise
    description: >-
      Before a conversation ends, say back what you understood and what you
      will do. Gaps show up while they are still cheap to fix.
  hyperfocus-exit:
    label: Hyperfocus exit ritual
    description: >-
      A hard-stop alarm set before starting, water and food within reach, and
      one written line about where to pick up next time.
  name-the-emotion:
    label: Name the emotion
    description: >-
      Putting words on the feeling, such as “this is frustration, about seven
      out of ten”, opens a small gap between the feeling and the reaction.
  cooling-off-rule:
    label: Cooling-off rule
    description: >-
      An agreed rule with yourself and the people close to you: no important
      replies or decisions while the wave is high. Revisit after twenty
      minutes or the next morning.
  ask-instead-of-assume:
    label: Ask instead of assuming
    description: >-
      When a message reads as rejection, check before reacting: “Did you
      mean...?” Most perceived slights dissolve on contact with the facts.
  distress-tolerance:
    label: Distress tolerance skills
    description: >-
      Skills from dialectical behaviour therapy for bringing the body down
      fast: cold water on the face, paced breathing, a burst of intense
      exercise.
  automatic-payments:
    label: Automatic payments
    description: >-
      Direct debits for every recurring bill, savings moved on payday, one
      card for all subscriptions. The system remembers so you do not have to.
  subscription-audit:
    label: Subscription audit
    description: >-
      A recurring reminder every few months to list every subscription and
      cancel what is no longer used.
  explain-your-adhd:
    label: Explain how your ADHD shows up
    description: >-
      Tell partners, friends and colleagues what to expect, such as late
      replies, interruptions or a lost thread, and what helps, before it
      happens.
  repair-routine:
    label: Repair routine
    description: >-
      An agreed way to acknowledge a slip, apologise and reset, so forgotten
      promises do not pile up into resentment on either side.
  shared-calendar:
    label: Shared calendar
    description: >-
      One calendar visible to your partner or household for appointments,
      school events and promises made. Nothing lives only in one head.
  buffer-time:
    label: Buffer time
    description: >-
      Plan to arrive fifteen minutes early and to finish a day before the real
      deadline. The buffer absorbs the time blindness.
  deadline-check-ins:
    label: Deadline check-ins
    description: >-
      Interim milestones agreed with whoever is waiting for the work. Each one
      is a small deadline with real urgency attached.
  recovery-time:
    label: Scheduled recovery time
    description: >-
      Deliberate unstructured time after demanding days, protected in the
      calendar like sleep. Compensating for ADHD all day has a cost that must
      be repaid.
  reduce-masking:
    label: Reduce masking
    description: >-
      Choose a few places and people where you stop performing neurotypical:
      fidget, take notes, ask for repeats, leave when you need to.
  play-to-strengths:
    label: Play to strengths
    description: >-
      Steer work towards the interest-driven, creative, crisis-mode tasks
      where ADHD brains shine, and negotiate the rest away or automate it.
  interest-pairing:
    label: Pair boring tasks with something enjoyable
    description: >-
      A favourite podcast only during chores, admin only in the good café. The
      enjoyable half supplies the stimulation the task lacks.

  behavioural-activation:
    label: Behavioural activation
    description: >-
      One small pleasant or meaningful activity scheduled every day, done
      whether or not you feel like it. Mood follows action more than action
      follows mood.
  morning-daylight:
    label: Morning daylight
    description: >-
      Ten minutes of outdoor light soon after waking anchors the body clock
      and lifts mood.
  social-contact:
    label: Social contact
    description: >-
      A short call or a walk with someone, especially on the days you least
      want to. Isolation feeds low mood.
  worry-window:
    label: Worry window
    description: >-
      Fifteen minutes a day set aside to write down every worry. Outside the
      window, the worry gets a note and an appointment instead of your
      attention.
  less-alcohol:
    label: Less alcohol
    description: >-
      Alcohol worsens sleep, impulsivity and mood for days. Cutting down is
      one of the cheapest improvements available.
  nightly-reset:
    label: Ten-minute nightly reset
    description: >-
      A timer, one lap of the apartment, things back to their homes. Not
      cleaning, just resetting. Small enough to do every night.
  one-surface:
    label: One surface per round
    description: >-
      One counter, one drawer, one corner, then stop. Never a whole-room
      marathon: the marathon never starts.
  doom-box:
    label: Doom box
    description: >-
      One box for the pile of things that need a decision. The surface is
      clear now, the decisions wait for a calmer moment.
  own-less:
    label: Own less
    description: >-
      Fewer things means fewer homes to remember and fewer decisions per tidy.
      One in, one out.
  visible-storage:
    label: Visible storage
    description: >-
      Open shelves, clear boxes, hooks instead of drawers. If closed doors
      erase things, keep them open.
  sort-by-frequency:
    label: "Sort by frequency, not category"
    description: >-
      The things used daily live within arm's reach of where they are used.
      Everything else can be farther away and less organised.
  launch-pad:
    label: Launch pad by the door
    description: >-
      One spot for keys, bag, wallet and whatever must leave the house
      tomorrow. Leaving becomes one movement.
  define-done:
    label: Define done
    description: >-
      Write one sentence describing what finished looks like before starting.
      A task with no end is a task that never starts.
  five-minute-rule:
    label: Five-minute rule
    description: >-
      Agree to do only five minutes of the dreaded thing. Stopping after five
      is allowed. Most of the time you will not.

  # ---------------------------------------------------------------- treatment
  assessment:
    label: "Diagnosis & assessment"
    description: >-
      A formal assessment by a qualified clinician is the gateway to treatment
      and to accommodations.
  medication:
    label: Medication
    description: >-
      Stimulant and non-stimulant medication, prescribed and monitored by a
      clinician. A first-line treatment for many adults.
  cbt:
    label: CBT for ADHD
    description: >-
      Cognitive behavioural therapy adapted for ADHD: skills for planning,
      procrastination and unhelpful thinking patterns.
  coaching:
    label: ADHD coaching
    description: >-
      Practical, goal-oriented support for building systems and routines that
      fit the person.
  workplace-accommodations:
    label: Workplace accommodations
    description: >-
      Flexible hours, written instructions, a quiet workspace, deadline check-
      ins.

  psychotherapy:
    label: Psychotherapy
    description: >-
      Talking therapy with a qualified therapist for the anxiety, low mood and
      self-image that often grow around ADHD.
  crisis-help:
    label: "When it gets dark: get help now"
    description: >-
      If thoughts turn to not wanting to be here, contact a doctor, a crisis
      line or emergency services today. This is a medical situation, not a
      character flaw.
  professional-organiser:
    label: Professional organiser or cleaner
    description: >-
      Paid help to set up a home that runs itself, or to keep it running. An
      accommodation, not a failure.

  # ---------------------------------------------------------------- impact
  missed-deadlines:
    label: Missed deadlines
    description: >-
      Work delivered late or not at all, despite good intentions and real
      effort.
  relationship-strain:
    label: Relationship strain
    description: >-
      Forgotten promises, interrupting and emotional outbursts wear on
      partners, friends and colleagues.
  low-self-esteem:
    label: Low self-esteem
    description: >-
      Years of "just try harder" feedback leave a sense of being lazy or
      broken.
  burnout:
    label: Burnout
    description: >-
      Masking symptoms and constantly compensating for them is exhausting.
  financial-trouble:
    label: Financial trouble
    description: >-
      Late fees, forgotten subscriptions, impulse purchases.
  underachievement:
    label: Underachievement
    description: >-
      Performance below ability at school or at work.
  anxiety-depression:
    label: "Anxiety & depression"
    description: >-
      Frequently co-occurring conditions, often fuelled by the other impacts
      on this map.
  energy-drain:
    label: Energy drain
    description: >-
      The exhaustion of hours spent worrying, masking and compensating, with
      nothing to show for it.

  # ---------------------------------------------------------------- situation
  chaotic-home:
    label: Chaotic home
    description: >-
      Piles on every surface, a kitchen that never resets itself, a sense that
      the place is winning. Several symptoms stack up here, which is why
      willpower alone does not fix it.
  dreaded-task:
    label: A task I dread
    description: >-
      The email, the form, the phone call. It sits there, gets bigger every
      day, and starts a loop that costs more energy than doing it would.
  money-admin:
    label: Money admin
    description: >-
      Bills, subscriptions, taxes, the account you have not opened in months.
      Forgetfulness, avoidance and impulsivity all meet here.

  # ---------------------------------------------------------------- mechanism
  dopamine-boost:
    label: Dopamine and noradrenaline rise
    description: >-
      Aerobic exercise raises the same messengers that ADHD medication
      targets, for a few hours afterwards.
  deeper-sleep:
    label: Deeper sleep
    description: >-
      Physical tiredness makes falling asleep easier and sleep deeper, which
      improves almost everything the next day.
  stress-hormones-drop:
    label: Stress hormones drop
    description: >-
      Exercise burns off the stress response, so the body stops signalling
      danger to the mind.
  energy-discharged:
    label: Restless energy discharged
    description: >-
      The inner motor gets an outlet, and sitting still afterwards costs less.
  mood-lift:
    label: Mood lift
    description: >-
      A reliable, if temporary, lift in mood that stacks up when it happens
      most days.

edges:
  hyperfocus-time-blindness:
    note: >-
      Hours disappear inside a hyperfocus session.
  sleep-problems-time-blindness:
    note: >-
      Bedtime keeps slipping because the evening does not feel as long as it
      is.
  body-doubling-task-initiation:
    note: >-
      Another person's presence supplies the starting cue the brain does not
      generate on its own.
  pomodoro-task-initiation:
    note: >-
      Committing to only 25 minutes lowers the cost of starting.
  pomodoro-hyperfocus:
    note: >-
      The break alarm is an external interrupt for a session that would
      otherwise run for hours.
  fidget-tools-fidgeting:
    note: >-
      Channels the movement instead of suppressing it.
  routines-task-switching:
    note: >-
      A fixed transition ritual makes the switch predictable.
  pause-before-acting-rejection-sensitivity:
    note: >-
      Waiting before replying to a perceived slight gives the first wave of
      emotion time to pass.
  write-it-down-instead-interrupting:
    note: >-
      The urge to interrupt is often fear of losing the thought. Once it is on
      paper, it can wait.
  explain-your-adhd-relationship-strain:
    note: >-
      Late replies and lost threads are easier to forgive when they were
      announced in advance.
  buffer-time-missed-deadlines:
    note: >-
      Treat the buffer as the real deadline. The true one is only a safety
      net.
  reduce-masking-burnout:
    note: >-
      Masking costs more energy than the people around you can see.
  avoidance-dreaded-task:
    note: >-
      Nothing was done, the deadline is closer, and the task looks bigger than
      before.
  five-minute-rule-avoidance:
    note: >-
      Five minutes is small enough to start, and starting is the whole
      problem.
  exercise-dopamine-boost:
    note: >-
      This is why a run before a boring task can feel like a dose of
      medication.
