nodes:
  # ---------------------------------------------------------------- hub
  adhd:
    label: ADHD
    description: >-
      Attention deficit hyperactivity disorder is a neurodevelopmental
      condition that affects attention regulation, activity level, impulse
      control and executive function. Click a cluster to explore its symptoms,
      then follow the links to triggers, coping strategies and impacts. This
      map is educational, not diagnostic. It holds diagnostic symptoms,
      commonly associated experiences, co-occurring problems and practical
      strategies. No single node establishes ADHD. Diagnosis weighs childhood
      onset, persistence, difficulty in more than one setting, and other
      possible explanations.
    facts:
      - text: >-
          Pooled across 175 studies worldwide, about 7% of children and
          adolescents meet the criteria for ADHD.
        source: thomas-2015
      - text: >-
          In a US survey run in 2001 to 2003, 4.4% of adults aged 18 to 44 met
          the criteria for current ADHD.
        source: kessler-2006
      - text: >-
          In a US survey of adolescents run in 2001 to 2004, 13% of boys and
          4.2% of girls had ADHD at some point in their life.
        source: nimh-adhd-stats
      - text: >-
          In the adult survey of the same period, current ADHD was found in
          5.4% of men and 3.2% of women. Lifetime and current figures come
          from different surveys and different measures, so they cannot be
          compared directly.
        source: nimh-adhd-stats
      - text: >-
          In 2023 an estimated 15.5 million adults in the United States, about
          6%, reported a current ADHD diagnosis. Around half were first
          diagnosed at 18 or older.
        source: cdc-adult-adhd
      - text: >-
          Twin studies put the heritability of ADHD at about 74%.
        source: faraone-2019

  # ---------------------------------------------------------------- cluster
  inattention:
    label: Inattention
    description: >-
      Difficulty directing and holding attention where it is needed, and
      sometimes the opposite problem of not being able to let go of it.
  hyperactivity:
    label: "Hyperactivity & impulsivity"
    description: >-
      An inner motor that keeps running, and actions that arrive before the
      thought that should have preceded them. In adults hyperactivity is often
      felt rather than seen.
  executive:
    label: Executive function
    description: >-
      The management layer of the brain: starting, planning, sequencing,
      prioritising, keeping track of time and holding things in mind.
  emotional:
    label: Emotional regulation
    description: >-
      Emotions that arrive fast, hit hard and take longer to settle. Not part
      of the formal diagnostic criteria, but one of the most disabling aspects
      for many adults.
  thinking-traps:
    label: Thinking traps
    description: >-
      Habitual distortions in how events get interpreted. CBT calls them
      cognitive distortions. Years of criticism make several of them common
      with ADHD.

  # ---------------------------------------------------------------- symptom
  distractibility:
    label: Distractibility
    description: >-
      Attention is pulled away by outside stimuli or by internal thoughts,
      even in the middle of tasks that matter.
  sustained-attention:
    label: Difficulty sustaining attention
    description: >-
      Long, low-stimulation tasks such as reading, forms or meetings are hard
      to stay with. Attention is not absent, it is unevenly available.
  hyperfocus:
    label: Hyperfocus
    description: >-
      Intense, hard-to-break absorption in an interesting task, often at the
      expense of everything else including food, sleep and other people.
    aliases: [tunnel vision]
  forgetfulness:
    label: Forgetfulness
    description: >-
      Appointments, promises and routine tasks slip away. Usually not from
      lack of caring but from the reminder never arriving at the right moment.
  losing-things:
    label: Losing things
    description: >-
      Keys, phone, wallet, documents. Items put down "for a second" vanish.
  careless-mistakes:
    label: Careless mistakes
    description: >-
      Details get skipped in work or paperwork despite knowing the material
      well.
    aliases: [overlooked details]
  restlessness:
    label: Restlessness
    description: >-
      Sitting still feels uncomfortable. In adults this is often an inner
      tension rather than visible movement.
  fidgeting:
    label: Fidgeting
    description: >-
      Tapping, bouncing, picking, shifting. Often a self-regulation strategy
      rather than a distraction.
  impulsivity:
    label: Impulsivity
    description: >-
      Acting before thinking: blurting things out, impulse purchases, snap
      decisions and risky choices.
  interrupting:
    label: "Interrupting & talking a lot"
    description: >-
      Finishing other people's sentences, jumping into conversations,
      monologuing about a favourite topic.
  impatience:
    label: Impatience
    description: >-
      Waiting in queues, in traffic or for a slow answer feels physically hard
      to bear.
  task-initiation:
    label: Task initiation difficulty
    description: >-
      Knowing exactly what to do and being unable to start. Sometimes called
      ADHD paralysis.
    aliases: [ADHD paralysis, executive dysfunction]
  procrastination:
    label: Procrastination
    description: >-
      Delaying tasks until the pressure of a deadline supplies enough urgency
      to act.
  time-blindness:
    label: Time blindness
    description: >-
      A weak sense of how much time has passed and how long things take.
      Chronic lateness and over-committing follow.
    aliases: [time management, always late]
  disorganisation:
    label: Disorganisation
    description: >-
      Piles, cluttered spaces, chaotic files, lost paperwork.
  working-memory:
    label: Working memory problems
    description: >-
      Holding several things in mind at once is hard: multi-step instructions,
      mental arithmetic, remembering why you walked into a room.
    aliases: [short-term memory]
  prioritising:
    label: Difficulty prioritising
    description: >-
      Everything feels equally urgent, or the least important task gets done
      first because it is the most interesting one.
  task-switching:
    label: Difficulty switching tasks
    description: >-
      Transitions are costly. Hard to stop what you are doing, and hard to
      start the next thing.
  emotional-dysregulation:
    label: Emotional dysregulation
    description: >-
      Emotions arrive quickly and strongly and take longer to settle than the
      situation seems to warrant.
    aliases: [big emotions, mood swings]
  rejection-sensitivity:
    label: Rejection sensitivity
    description: >-
      Perceived criticism, exclusion or rejection can trigger intense
      distress. It is not an ADHD diagnostic criterion and is not unique to
      ADHD, but it can interact with emotional dysregulation and with past
      experience of criticism. The stronger idea of rejection sensitive
      dysphoria has limited research support.
    aliases: [RSD, rejection sensitive dysphoria]
  frustration-tolerance:
    label: Low frustration tolerance
    description: >-
      Small obstacles can produce disproportionate anger, or the urge to give
      up entirely.
  boredom-intolerance:
    label: Boredom intolerance
    description: >-
      Under-stimulation feels aversive. The mind goes looking for novelty or
      intensity wherever it can find it.
  sleep-problems:
    label: Sleep problems
    description: >-
      Trouble falling asleep, a delayed body clock, and staying up late to
      reclaim time that the day did not provide.
  rumination:
    label: Rumination
    description: >-
      The same worry replaying on a loop: the task, the email, the thing you
      said. It feels like thinking but produces no decision and burns energy.
  avoidance:
    label: Avoidance
    description: >-
      Steering around the task, the message or the person that triggers the
      dread. Relief now, a bigger problem later.
  out-of-sight:
    label: "Out of sight, out of mind"
    description: >-
      What is not visible stops existing: the bill in the drawer, the
      vegetables behind the milk, the friend you did not text back.
  decision-paralysis:
    label: Decision paralysis
    description: >-
      Too many options, each one needing a decision, so none gets made. Piles
      are often stacks of postponed decisions.
  anticipatory-anxiety:
    label: Dread before the task
    description: >-
      Anxiety that arrives long before the task and often costs more than the
      task itself.
  catastrophising:
    label: Catastrophising
    description: >-
      Jumping to the worst possible outcome and treating it as likely: one
      late email becomes losing the job.
  all-or-nothing:
    label: All-or-nothing thinking
    description: >-
      Anything short of perfect counts as failure. A missed workout means the
      whole plan is ruined.
  mind-reading:
    label: Mind reading
    description: >-
      Assuming you know what others think of you, usually the worst, without
      checking.
  overgeneralisation:
    label: Overgeneralisation
    description: >-
      One setback becomes a rule about your whole life: “I always mess this
      up.”
  should-statements:
    label: Should statements
    description: >-
      Rigid rules about how you and others must behave. Every “should” that is
      not met produces guilt or anger.
  personalisation:
    label: Personalisation
    description: >-
      Taking responsibility for things outside your control, or reading
      neutral events as being about you.
  safety-behaviours:
    label: Safety behaviours
    description: >-
      Small things done to feel safer in feared situations: rehearsing every
      sentence, keeping the camera off, always having an exit. They bring
      relief and keep the fear alive.
  sensory-sensitivity:
    label: Sensory sensitivity
    description: >-
      Sounds, smells, textures or light may feel unusually intense or keep
      pulling attention. Sensory differences are reported more often by people
      with ADHD, but they are not part of the diagnostic criteria and can also
      occur with other conditions.
    aliases: [overstimulation]
    facts:
      - text: >-
          In one study of adults with ADHD, 43% of the women and 22% of the
          men reported sensory hypo- or hypersensitivity.
        source: bijlenga-2017
  misophonia:
    label: Misophonia
    description: >-
      Intense anger or disgust at specific sounds such as chewing, tapping or
      sniffing. It can occur with ADHD, but how the two relate is still being
      studied.
    facts:
      - text: >-
          In a sample of 575 people with misophonia, 5% reported ADHD.
        source: jager-2020
  follow-through:
    label: Difficulty following through
    description: >-
      Starting a task or the first instruction, then losing the thread before
      every step is finished. The intention was real; the thread was not held.
  losing-conversation-thread:
    label: Losing the thread in conversation
    description: >-
      Attention slips while someone is speaking, so part of what they said
      never lands. It can look like not listening when the person is trying
      hard to follow.
  mind-wandering:
    label: Excessive mind wandering
    description: >-
      A stream of short, unrelated thoughts keeps pulling attention off the
      task. Unlike rumination, the mind jumps between topics instead of
      circling one worry.
    aliases: [daydreaming]
  planning-sequencing:
    label: Difficulty planning and sequencing
    description: >-
      Knowing the goal but struggling to choose an order, see what depends on
      what, and turn it into a workable sequence of actions.

  # ---------------------------------------------------------------- trigger
  boring-tasks:
    label: Boring or repetitive tasks
    description: >-
      Low-interest tasks provide too little stimulation to hold attention.
  poor-sleep:
    label: Lack of sleep
    description: >-
      Many ADHD symptoms can get worse after a bad night.
  noisy-environment:
    label: Noisy environment
    description: >-
      Open-plan offices, cafés, a television in the background.
  unclear-instructions:
    label: Unclear instructions
    description: >-
      Vague or verbal-only tasks leave nothing to anchor on.
  notifications:
    label: "Notifications & phone"
    description: >-
      Every buzz is an invitation to leave the task.
  stress:
    label: "Stress & overload"
    description: >-
      Too many demands at once shrink an already limited executive capacity.
  long-meetings:
    label: Long meetings
    description: >-
      An hour of passive listening with no interaction.
  open-ended-tasks:
    label: Open-ended tasks
    description: >-
      No clear start, no clear end, no definition of done.
  hunger:
    label: "Hunger & skipped meals"
    description: >-
      Forgetting to eat, then crashing.
  strong-smells:
    label: Strong smells
    description: >-
      Perfume, cleaning products, a colleague's lunch, the scented candle
      someone else loves.
  crowded-places:
    label: Crowded places
    description: >-
      Supermarkets, stations, parties: many sound sources, movement and smells
      at the same time.
  harsh-light:
    label: Harsh light and flicker
    description: >-
      Fluorescent tubes, screens too bright, flickering lights, low sun
      through a windscreen.
  textures:
    label: Textures and labels
    description: >-
      Scratchy fabrics, clothing labels, seams in socks, a wet sleeve. Small,
      constant, impossible to ignore.
  competing-demands:
    label: Too many competing demands
    description: >-
      Several requests, decisions and unfinished tasks all want attention at
      once, which makes choosing and holding the next action hard.
  unexpected-interruptions:
    label: Unexpected interruptions
    description: >-
      A question, a call or an urgent request breaks the current task, and
      rebuilding where you were costs more than the interruption itself.

  # ---------------------------------------------------------------- strategy
  body-doubling:
    label: Body doubling
    description: >-
      Working alongside another person, in the same room or on a video call,
      whose presence makes starting and staying on task easier.
    aliases: [co-working]
  pomodoro:
    label: Pomodoro timer
    description: >-
      Work in short timed sprints with breaks in between. The timer supplies
      structure and, importantly, an end point.
  visual-timers:
    label: Visual timers
    description: >-
      Timers that show time as a shrinking disc or bar make the passing of
      time visible.
  external-reminders:
    label: "Alarms & external reminders"
    description: >-
      Move memory out of the head: phone alarms, calendar notifications,
      sticky notes at the point of action.
  task-breakdown:
    label: Break tasks into tiny steps
    description: >-
      Turn "write the report" into "open the document, write one heading". The
      first step should be almost trivially small.
  checklists:
    label: Written checklists
    description: >-
      Put the plan on paper so working memory does not have to hold it.
  home-for-things:
    label: A home for everything
    description: >-
      Fixed spots for keys, wallet and glasses. A bowl by the door beats a
      mental note.
  exercise:
    label: Regular exercise
    description: >-
      Aerobic activity can improve attention and mood for a few hours
      afterwards, and can help with sleep.
  sleep-routine:
    label: Consistent sleep routine
    description: >-
      A fixed wake time, a wind-down ritual, screens out of the bedroom.
  mindfulness:
    label: Mindfulness practice
    description: >-
      Short, regular practice in noticing attention drifting and emotions
      rising before they take over.
  fidget-tools:
    label: Fidget tools
    description: >-
      Giving the body something to do can free attention rather than consume
      it.
  noise-control:
    label: "Headphones & white noise"
    description: >-
      Noise-cancelling headphones or steady background sound reduce auditory
      distraction.
  time-boxing:
    label: Time-boxing the calendar
    description: >-
      Give every task a slot in the calendar with a realistic, usually longer,
      estimate.
  accountability-partner:
    label: Accountability partner
    description: >-
      Tell someone what you will do by when, and report back.
  routines:
    label: "Routines & habit stacking"
    description: >-
      Attach new habits to existing anchors (after coffee, take medication) so
      fewer decisions are needed.
  prepare-night-before:
    label: Prepare the night before
    description: >-
      Clothes, bag, lunch and keys laid out. Mornings then run on autopilot.
  externalise-memory:
    label: Externalise working memory
    description: >-
      Whiteboards, notes apps, voice memos. Capture the thought the moment it
      appears.
  dopamine-menu:
    label: Dopamine menu
    description: >-
      A pre-written list of healthy rewarding activities to reach for instead
      of endless scrolling.
  gamification:
    label: Gamify tasks
    description: >-
      Points, streaks, races against a timer. Novelty and competition create
      the urgency that boring tasks lack.
  single-tasking:
    label: Single-tasking
    description: >-
      One tab, one task, one thing on the desk. Shrink the surface area for
      distraction.
  done-not-perfect:
    label: Done beats perfect
    description: >-
      Lower the bar deliberately. Perfectionism is a common driver of
      procrastination.
  pause-before-acting:
    label: Pause before acting
    description: >-
      A built-in delay: 24 hours before a purchase, a slow breath before
      replying.
  self-compassion:
    label: Self-compassion
    description: >-
      Treat slips as data rather than as evidence of failure. Shame fuels
      avoidance.
  decision-reduction:
    label: Reduce decisions
    description: >-
      Fewer choices to make: standard meals, a small wardrobe, default
      answers.
  movement-breaks:
    label: Movement breaks
    description: >-
      A short walk, a flight of stairs or a stretch every hour. Walking
      meetings and a standing desk count too.
  write-it-down-instead:
    label: Write it down instead of saying it
    description: >-
      During a conversation, jot the thought on paper so it stops pressing to
      come out. It can be raised once the other person has finished.
  item-trackers:
    label: Bluetooth trackers
    description: >-
      Small tags on keys, wallet and bag, and a phone that can make them ring.
      Turns a twenty-minute search into a twenty-second one.
  duplicate-essentials:
    label: Duplicate essentials
    description: >-
      Spare keys with a neighbour, a charger in every bag, reading glasses in
      every room. Losing one copy stops being a crisis.
  final-review-pass:
    label: Final review pass
    description: >-
      A separate, deliberate check after the work feels finished, ideally
      after a break and against a short list of your typical slips.
  written-instructions:
    label: Ask for written instructions
    description: >-
      Ask for tasks by message or email, or write up what you heard and send
      it back for confirmation.
  repeat-back:
    label: Repeat back and summarise
    description: >-
      Before a conversation ends, say back what you understood and what you
      will do. Gaps show up while they are still cheap to fix.
  hyperfocus-exit:
    label: Hyperfocus exit ritual
    description: >-
      A hard-stop alarm set before starting, water and food within reach, and
      one written line about where to pick up next time.
  name-the-emotion:
    label: Name the emotion
    description: >-
      Putting words on the feeling, such as “this is frustration, about seven
      out of ten”, opens a small gap between the feeling and the reaction.
  cooling-off-rule:
    label: Cooling-off rule
    description: >-
      An agreed rule with yourself and the people close to you: no important
      replies or decisions while the wave is high. Revisit after twenty
      minutes or the next morning.
  ask-instead-of-assume:
    label: Ask instead of assuming
    description: >-
      When a message reads as rejection, check before reacting: “Did you
      mean...?” Most perceived slights dissolve on contact with the facts.
  distress-tolerance:
    label: Distress tolerance skills
    description: >-
      Skills from dialectical behaviour therapy for bringing the body down
      fast: cold water on the face, paced breathing, a burst of intense
      exercise.
  automatic-payments:
    label: Automatic payments
    description: >-
      Direct debits for every recurring bill, savings moved on payday, one
      card for all subscriptions. The system remembers so you do not have to.
  subscription-audit:
    label: Subscription audit
    description: >-
      A recurring reminder every few months to list every subscription and
      cancel what is no longer used.
  explain-your-adhd:
    label: Explain how your ADHD shows up
    description: >-
      Tell partners, friends and colleagues what to expect, such as late
      replies, interruptions or a lost thread, and what helps, before it
      happens.
  repair-routine:
    label: Repair routine
    description: >-
      An agreed way to acknowledge a slip, apologise and reset, so forgotten
      promises do not pile up into resentment on either side.
  shared-calendar:
    label: Shared calendar
    description: >-
      One calendar visible to your partner or household for appointments,
      school events and promises made. Nothing lives only in one head.
  buffer-time:
    label: Buffer time
    description: >-
      Plan to arrive fifteen minutes early and to finish a day before the real
      deadline. The buffer absorbs the time blindness.
  deadline-check-ins:
    label: Deadline check-ins
    description: >-
      Interim milestones agreed with whoever is waiting for the work. Each one
      is a small deadline with real urgency attached.
  recovery-time:
    label: Scheduled recovery time
    description: >-
      Deliberate unstructured time after demanding days, protected in the
      calendar like sleep. Compensating for ADHD all day has a cost that must
      be repaid.
  reduce-masking:
    label: Reduce masking
    description: >-
      Choose a few places and people where you stop performing neurotypical:
      fidget, take notes, ask for repeats, leave when you need to.
  play-to-strengths:
    label: Play to strengths
    description: >-
      Steer work towards the interest-driven, creative, crisis-mode tasks
      where ADHD brains shine, and negotiate the rest away or automate it.
  interest-pairing:
    label: Pair boring tasks with something enjoyable
    description: >-
      A favourite podcast only during chores, admin only in the good cafe. The
      enjoyable half can supply some of the stimulation the task lacks.
  behavioural-activation:
    label: Behavioural activation
    description: >-
      One small pleasant or meaningful activity scheduled every day, done
      whether or not you feel like it. Mood follows action more than action
      follows mood.
  morning-daylight:
    label: Morning daylight
    description: >-
      Ten minutes of outdoor light soon after waking anchors the body clock
      and lifts mood.
  social-contact:
    label: Social contact
    description: >-
      A short call or a walk with someone, especially on the days you least
      want to. Isolation feeds low mood.
  worry-window:
    label: Worry window
    description: >-
      Fifteen minutes a day set aside to write down every worry. Outside the
      window, the worry gets a note and an appointment instead of your
      attention.
  less-alcohol:
    label: Less alcohol
    description: >-
      Alcohol can worsen sleep, impulsivity and mood for days afterwards.
      Cutting down is one of the cheapest improvements available.
  nightly-reset:
    label: Ten-minute nightly reset
    description: >-
      A timer, one lap of the apartment, things back to their homes. Not
      cleaning, just resetting. Small enough to do every night.
  one-surface:
    label: One surface per round
    description: >-
      One counter, one drawer, one corner, then stop. Never a whole-room
      marathon: the marathon never starts.
  doom-box:
    label: Doom box
    description: >-
      One box for the pile of things that need a decision. The surface is
      clear now, the decisions wait for a calmer moment.
    aliases: [doom pile]
  own-less:
    label: Own less
    description: >-
      Fewer things means fewer homes to remember and fewer decisions per tidy.
      One in, one out.
  visible-storage:
    label: Visible storage
    description: >-
      Open shelves, clear boxes, hooks instead of drawers. If closed doors
      erase things, keep them open.
  sort-by-frequency:
    label: "Sort by frequency, not category"
    description: >-
      The things used daily live within arm's reach of where they are used.
      Everything else can be farther away and less organised.
  launch-pad:
    label: Launch pad by the door
    description: >-
      One spot for keys, bag, wallet and whatever must leave the house
      tomorrow. Leaving becomes one movement.
  define-done:
    label: Define done
    description: >-
      Write one sentence describing what finished looks like before starting.
      A task with no end is a task that never starts.
  five-minute-rule:
    label: Five-minute rule
    description: >-
      Agree to do only five minutes of the dreaded thing. Stopping after five
      is allowed. Most of the time you will not.
  thought-record:
    label: Thought record
    description: >-
      Write the situation, the automatic thought, the emotion and its
      strength, the evidence for and against, and a more balanced thought. The
      classic CBT worksheet.
  decatastrophising:
    label: Decatastrophising
    description: >-
      Three questions: what is the worst that could happen, how likely is it
      really, and how would I cope if it did?
  behavioural-experiments:
    label: Test what you fear
    description: >-
      Called a behavioural experiment in CBT. Write down exactly what you
      expect to go wrong and how certain you are, out of ten. Then do the
      thing once, without the usual precautions. Afterwards write down what
      actually happened. The gap between the prediction and the outcome is
      what changes the belief. Being told not to worry does not.
  graded-exposure:
    label: Graded exposure
    description: >-
      Rank feared situations from easy to hard and work up the ladder, staying
      in each until the anxiety falls on its own. Avoidance shrinks the world;
      exposure widens it again.
  structured-problem-solving:
    label: Structured problem solving
    description: >-
      Define the problem in one sentence, list every option without judging,
      pick one, plan the first step, review afterwards. Turns rumination into
      a decision.
  mood-diary:
    label: Mood and activity diary
    description: >-
      Note what you did and how you felt, hour by hour, for a week. The
      pattern shows which activities lift mood and which drain it.
  relaxation-breathing:
    label: Paced breathing and muscle relaxation
    description: >-
      Slow breathing with a long exhale, or tensing and releasing muscle
      groups in turn. Teaches the body the off switch.
  relapse-plan:
    label: Relapse prevention plan
    description: >-
      A written page: early warning signs, what helped last time, who to call.
      Made while well, read when not.
  psychoeducation:
    label: Learn how anxiety works
    description: >-
      Understanding the fight-or-flight response, why avoidance feeds fear,
      and why anxiety always peaks and falls takes much of its power away.
  earplugs:
    label: Everyday earplugs
    description: >-
      Filtered earplugs that take the edge off without cutting out speech,
      kept on the keyring so they are always there.
  control-the-environment:
    label: Control the environment
    description: >-
      Choose the seat, the room and the time of day. Unscented products at
      home, dimmable lights, a quiet corner at work. Fewer inputs in the first
      place.
  comfortable-clothes:
    label: Clothes that feel right
    description: >-
      Cut out labels, buy the same soft fabrics again, never compromise on
      socks. Comfort is not fussiness when the alternative is all-day
      distraction.
  quiet-after-loud:
    label: Quiet time after loud days
    description: >-
      Scheduled silence after a noisy day: no music, no calls, low light.
      Recovery is part of the plan, not a luxury.
  leave-early:
    label: Permission to leave
    description: >-
      Agree beforehand, with yourself and with companions, that leaving a loud
      place early is fine. Knowing there is an exit lowers the load from the
      start.
  planning-time-to-plan:
    label: Plan a time to plan
    description: >-
      Put the planning itself in the calendar as a short daily slot. Without
      it the day starts by reacting, and planning is the step that gets
      skipped first.
  master-list:
    label: One master list of everything
    description: >-
      A single list holding every commitment, large and small, in one place.
      It is not the list you work from; it is the list you stop carrying in
      your head.
  daily-shortlist:
    label: A short list for today
    description: >-
      Each day, copy a small number of items from the master list. A short
      list can be finished, and a finished list is the only kind that builds
      trust in the system.
  underschedule:
    label: Deliberately underschedule
    description: >-
      Plan fewer tasks than you think will fit, and leave more space between
      them than seems necessary. Estimating time is the weak point, so the
      plan should absorb the error.
  if-then-plans:
    label: If-then plans
    description: >-
      Decide in advance what you will do when a specific interruption arrives:
      if a message comes in, then it waits until this block ends. The decision
      is made once, while you are calm, rather than each time.
  smallest-step:
    label: Name the smallest first move
    description: >-
      Not the task, not even the first step, but the smallest physical action
      that puts you in position: the file open on screen, the shoes by the
      door.
  escape-behaviours:
    label: Know your escape moves
    description: >-
      Everyone has a short list of things they reliably do instead: the inbox,
      the fridge, a quick errand. Naming them turns the urge into a signal
      that you are avoiding something.
  anticipation-ratio:
    label: Rebalance what you expect
    description: >-
      Before a dreaded task, most people count only what will be unpleasant.
      Add what is true on the other side: it is time limited, it can be done
      badly, and finishing it feels better than carrying it.
  accept-discomfort:
    label: Start without waiting to feel ready
    description: >-
      The discomfort usually does not go away before you start; it goes away
      shortly after. Waiting for the mood to arrive is what turns a task into
      a week.
  behavioural-scripts:
    label: Reverse-engineer your routines
    description: >-
      Some sequences run themselves: coming home, the couch, the phone, the
      evening gone. Writing the sequence down shows where the choice point
      actually is.
  reframe-time:
    label: Put a real number on the time
    description: >-
      Ask how long the task truly takes, not how long it feels. Most items on
      a daily list need under an hour, and an unbounded task is the one that
      never starts.
  manage-energy:
    label: Spend your best hours deliberately
    description: >-
      Attention is not evenly available across the day. Match the demanding
      work to the hours you actually have it, and the mechanical work to the
      hours you do not.
  earned-rewards:
    label: Turn escapes into earned rewards
    description: >-
      The things you escape into can be moved to the other side of the task.
      The same half hour online is a very different thing before and after the
      work.
  defense-attorney:
    label: Argue the other side
    description: >-
      A harsh thought convinces because only one side was heard. Deliberately
      make the case against it, the way a defence lawyer would, before
      accepting the verdict.
  method-acting:
    label: Act as the person who does it
    description: >-
      Behave as someone who already keeps a planner or sends that email,
      before it feels natural. Repetition is what makes it natural, not the
      other way round.
  values-commitment:
    label: Connect the task to what you value
    description: >-
      A dull task that serves something you care about is easier to start than
      one defended as merely necessary. Name the thing it serves.
  problem-template:
    label: A written template for problems
    description: >-
      Define the problem in one sentence, list options without judging them,
      choose, plan the first step, and review afterwards. The template does
      the thinking the moment cannot.
  face-uncertainty:
    label: Decide before the choice decides itself
    description: >-
      Waiting out a decision is still a decision, and usually the worst one,
      because the options quietly expire. Acting under uncertainty beats
      acting too late.
  planned-distraction:
    label: Schedule the distraction
    description: >-
      Give games, feeds and screens a real slot in the day rather than letting
      them take the gaps. Scheduled downtime stops competing with everything
      else.
  coping-drift:
    label: Expect the system to slip
    description: >-
      Every system slides after a few good weeks. Treat the slide as normal
      and plan the restart in advance, rather than reading it as proof that
      you cannot keep anything up.

  # ---------------------------------------------------------------- treatment
  assessment:
    label: "Diagnosis & assessment"
    description: >-
      A formal assessment by a qualified clinician is the gateway to treatment
      and to accommodations.
    aliases: [diagnosis, testing]
    facts:
      - text: >-
          About half of US adults with a current ADHD diagnosis were first
          diagnosed at 18 or older.
        source: cdc-adult-adhd
  medication:
    label: Medication
    description: >-
      Stimulant and non-stimulant medication, prescribed and monitored by a
      clinician. A first-line treatment for many adults.
    aliases: [stimulants, methylphenidate]
    facts:
      - text: >-
          About a third of US adults with ADHD took a stimulant medication in
          the previous year. Of those, 71.5% had difficulty filling a
          prescription because the medication was unavailable.
        source: cdc-adult-adhd
  cbt:
    label: CBT for ADHD
    description: >-
      Cognitive behavioural therapy adapted for ADHD: skills for planning,
      procrastination and unhelpful thinking patterns.
    aliases: [CBT, cognitive behavioural therapy]
  coaching:
    label: ADHD coaching
    description: >-
      Practical, goal-oriented support for building systems and routines that
      fit the person.
  workplace-accommodations:
    label: Workplace accommodations
    description: >-
      Flexible hours, written instructions, a quiet workspace, deadline check-
      ins.
  psychotherapy:
    label: Psychotherapy
    description: >-
      Talking therapy with a qualified therapist for the anxiety, low mood and
      self-image that often grow around ADHD.
  crisis-help:
    label: "When it gets dark: get help now"
    description: >-
      If thoughts turn to not wanting to be here, contact a doctor, a crisis
      line or emergency services today. This is a medical situation, not a
      character flaw.
  professional-organiser:
    label: Professional organiser or cleaner
    description: >-
      Paid help to set up a home that runs itself, or to keep it running. An
      accommodation, not a failure.

  # ---------------------------------------------------------------- impact
  missed-deadlines:
    label: Missed deadlines
    description: >-
      Work delivered late or not at all, despite good intentions and real
      effort.
  relationship-strain:
    label: Relationship strain
    description: >-
      Forgotten promises, interrupting and emotional outbursts wear on
      partners, friends and colleagues.
  low-self-esteem:
    label: Low self-esteem
    description: >-
      Years of "just try harder" feedback leave a sense of being lazy or
      broken.
  burnout:
    label: Burnout
    description: >-
      Masking symptoms and constantly compensating for them is exhausting.
  financial-trouble:
    label: Financial trouble
    description: >-
      Late fees, forgotten subscriptions, impulse purchases.
  inconsistent-performance:
    label: Inconsistent performance at work or study
    description: >-
      Results that swing between excellent and late or missing, often on the
      same kind of task. The gap is between what is possible on a good day and
      what happens on an average one, not between effort and ability.
    aliases: [underachievement]
  energy-drain:
    label: Energy drain
    description: >-
      The exhaustion of hours spent worrying, masking and compensating, with
      nothing to show for it.
  sensory-overload:
    label: Sensory overload
    description: >-
      Too much input at once: irritability, shutdown, the urge to leave the
      room. It drains energy for hours afterwards.
  driving-risk:
    label: Driving and accident risk
    description: >-
      At population level, ADHD is associated with a higher accident risk.
      Distractibility, impulsivity and poor sleep matter more behind a wheel
      or around machinery. This is a group finding and says nothing about any
      individual driver.
    facts:
      - text: >-
          In a Swedish population study, periods on medication were associated
          with a 58% lower rate of serious transport accidents among men with
          ADHD. The authors estimated that 41% to 49% of those accidents could
          have been avoided with treatment.
        source: chang-2014

  # ---------------------------------------------------------------- condition
  anxiety:
    label: Anxiety
    description: >-
      Anxiety disorders occur more often alongside ADHD than in the general
      population. Worry, physical tension and avoidance can look like ADHD
      symptoms and can also be made worse by them. Anxiety needs its own
      assessment and treatment.
    facts:
      - text: >-
          About 5.8% of the world's population, roughly 470 million people,
          had an anxiety disorder in 2023.
        source: who-anxiety
      - text: >-
          Only about one person in four who needs treatment for an anxiety
          disorder receives any, 27.6%.
        source: who-anxiety
      - text: >-
          Girls and women are more likely to experience an anxiety disorder
          than boys and men.
        source: who-anxiety
      - text: >-
          Pooled across studies, adults with ADHD had about five times the
          odds of an anxiety disorder compared with adults without ADHD.
        source: hartman-2023
  depression:
    label: Depression
    description: >-
      Depression occurs more often alongside ADHD than in the general
      population. Low mood, loss of interest and exhaustion are not simply the
      result of a hard week. Depression needs its own assessment and
      treatment. If your thoughts turn to not wanting to be here, seek help
      today.
    facts:
      - text: >-
          About 5.2% of adults worldwide had a depressive disorder in 2023:
          4.1% of men and 6.2% of women.
        source: who-depression
      - text: >-
          That is roughly 322 million people.
        source: who-depression
      - text: >-
          Depression is about 1.5 times more common among women than among
          men.
        source: who-depression
      - text: >-
          Pooled across studies, adults with ADHD had about four and a half
          times the odds of major depression compared with adults without
          ADHD.
        source: hartman-2023
  substance-use:
    label: Substance use problems
    description: >-
      Substance use disorders occur more often alongside ADHD. Substances are
      sometimes used to manage restlessness, sleep, mood or distress, but they
      worsen functioning and need their own assessment and treatment.
    facts:
      - text: >-
          Pooled across studies, adults with ADHD had about four and a half
          times the odds of a substance use disorder compared with adults
          without ADHD.
        source: hartman-2023

  # ---------------------------------------------------------------- situation
  chaotic-home:
    label: Chaotic home
    description: >-
      Piles on every surface, a kitchen that never resets itself, a sense that
      the place is winning. Several symptoms stack up here, which is why
      willpower alone does not fix it.
  dreaded-task:
    label: A task I dread
    description: >-
      The email, the form, the phone call. It sits there, gets bigger every
      day, and starts a loop that costs more energy than doing it would.
  money-admin:
    label: Money admin
    description: >-
      Bills, subscriptions, taxes, the account you have not opened in months.
      Forgetfulness, avoidance and impulsivity all meet here.
  loud-evening-out:
    label: A loud restaurant or party
    description: >-
      Everyone is talking at once, the music is up, someone is chewing next to
      you. Following the conversation costs more than it gives.
  getting-out-the-door:
    label: Getting out of the door on time
    description: >-
      The last twenty minutes before leaving, when several small problems
      stack up at once: the keys, the time, the thing you meant to bring.
  meetings-and-lectures:
    label: "A meeting, class or lecture"
    description: >-
      An hour of sitting still and listening, with no way to move and little
      to do with your hands, while the thread of the discussion keeps
      slipping.
  messages-and-inbox:
    label: Messages and an overflowing inbox
    description: >-
      Unanswered messages pile up. Each one needs a decision, some of them
      feel risky to answer, and out of sight quickly becomes out of mind.
  bedtime-and-waking:
    label: Going to bed and getting up
    description: >-
      The evening stretches, the interesting thing is hard to put down, and
      the morning arrives before the night felt finished.
  health-admin:
    label: "Appointments, prescriptions and health admin"
    description: >-
      Booking, rebooking, forms, repeat prescriptions and follow-up calls. The
      admin around staying healthy needs exactly the skills that ADHD makes
      expensive.

  # ---------------------------------------------------------------- mechanism
  dopamine-boost:
    label: Dopamine and noradrenaline rise
    description: >-
      One proposed pathway. Aerobic exercise may raise the same messengers
      that ADHD medication acts on, for a few hours afterwards. It is part of
      the explanation, not the whole of it.
  deeper-sleep:
    label: Deeper sleep
    description: >-
      Physical tiredness can make falling asleep easier and sleep deeper,
      which helps almost everything the next day.
  stress-hormones-drop:
    label: Stress hormones drop
    description: >-
      Exercise can burn off the stress response, so the body stops signalling
      danger to the mind.
  energy-discharged:
    label: Restless energy discharged
    description: >-
      The inner motor gets an outlet, and sitting still afterwards may cost
      less.
  mood-lift:
    label: Mood lift
    description: >-
      A lift in mood that is often temporary, but that adds up when it happens
      on most days.

edges:
  substance-use-adhd:
    note: >-
      An association found across populations. It is a reason for assessment,
      not an expectation about any person.
  adhd-anxiety:
    note: >-
      More common alongside ADHD than in the general population. Anxiety can
      also look like inattention, which is one reason an assessment weighs
      both.
  adhd-depression:
    note: >-
      More common alongside ADHD than in the general population. Years of
      difficulty are one risk factor, but depression is its own condition and
      needs its own treatment.
  hyperfocus-time-blindness:
    note: >-
      Hours disappear inside a hyperfocus session.
  sleep-problems-time-blindness:
    note: >-
      Bedtime keeps slipping because the evening does not feel as long as it
      is.
  avoidance-dreaded-task:
    note: >-
      Nothing was done, the deadline is closer, and the task looks bigger than
      before.
  safety-behaviours-anticipatory-anxiety:
    note: >-
      The relief they bring teaches the brain that the situation really was
      dangerous.
  sensory-sensitivity-sensory-overload:
    note: >-
      Each sound or smell costs a little attention. By evening the budget is
      gone.
  mind-wandering-rumination:
    note: >-
      Both pull attention inward, but wandering jumps between topics while
      rumination circles one.
  driving-risk-distractibility:
    note: >-
      A population-level association, not a statement about any individual
      driver.
  body-doubling-task-initiation:
    note: >-
      Another person's presence supplies the starting cue the brain does not
      generate on its own.
  pomodoro-task-initiation:
    note: >-
      Committing to only 25 minutes lowers the cost of starting.
  pomodoro-hyperfocus:
    note: >-
      The break alarm is an external interrupt for a session that would
      otherwise run for hours.
  fidget-tools-fidgeting:
    note: >-
      Channels the movement instead of suppressing it.
  routines-task-switching:
    note: >-
      A fixed transition ritual makes the switch predictable.
  pause-before-acting-rejection-sensitivity:
    note: >-
      Waiting before replying to a perceived slight gives the first wave of
      emotion time to pass.
  write-it-down-instead-interrupting:
    note: >-
      The urge to interrupt is often fear of losing the thought. Once it is on
      paper, it can wait.
  explain-your-adhd-relationship-strain:
    note: >-
      Late replies and lost threads are easier to forgive when they were
      announced in advance.
  buffer-time-missed-deadlines:
    note: >-
      Treat the buffer as the real deadline. The true one is only a safety
      net.
  reduce-masking-burnout:
    note: >-
      Masking costs more energy than the people around you can see.
  five-minute-rule-avoidance:
    note: >-
      Five minutes is small enough to start, and starting is the whole
      problem.
  exercise-dopamine-boost:
    note: >-
      Some people notice a window of easier focus for an hour or two
      afterwards. Exercise is an addition to treatment, not a replacement for
      it.
  thought-record-rumination:
    note: >-
      Rumination goes round in circles; a thought record goes forward, because
      it ends in a balanced thought.
  graded-exposure-avoidance:
    note: >-
      Each step must be small enough to actually take, and repeated until it
      gets boring.
  explain-your-adhd-sensory-sensitivity:
    note: >-
      The person chewing next to you cannot hear what you hear. Saying so
      beforehand turns a fight into a seating plan.
  smallest-step-task-initiation:
    note: >-
      Small enough that refusing it would be absurd. Starting is the part that
      costs.
  escape-behaviours-procrastination:
    note: >-
      You cannot interrupt a habit you have not noticed.
  anticipation-ratio-procrastination:
    note: >-
      The prediction, not the task, is usually what is being avoided.
  behavioural-scripts-procrastination:
    note: >-
      The script runs before any decision is made, so the decision has to be
      moved earlier.
  earned-rewards-procrastination:
    note: >-
      The same activity becomes a reward rather than an escape, purely by
      moving it.
  defense-attorney-catastrophising:
    note: >-
      Ask what evidence would be needed to convict, then check whether you
      actually have it.
  method-acting-task-initiation:
    note: >-
      Acting the part comes first; feeling like the part follows, sometimes
      much later.
  face-uncertainty-decision-paralysis:
    note: >-
      A decision left unmade expires on its own, and the expired version is
      rarely the one you wanted.
  coping-drift-inconsistent-performance:
    note: >-
      Plan the return in advance and the slip costs days instead of months.
  medication-dopamine-boost:
    note: >-
      This pathway describes stimulant medication. Non-stimulant medication
      works differently.
  assessment-sensory-sensitivity:
    note: >-
      Strong, lifelong sensitivity is worth raising at assessment. It overlaps
      with autism, and that changes which accommodations help.
  anxiety-depression-overlap:
    note: >-
      The two frequently occur together, and each can make the other harder to
      recognise and to treat.
