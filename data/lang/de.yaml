  related_to: { label: verwandt mit, inverse: verwandt mit }
  worsens:    { label: verschlimmert, inverse: verschlimmert durch }
  helps_with: { label: hilft bei, inverse: unterstützt durch }
  reduces:    { label: verringert, inverse: verringert durch }
  leads_to:   { label: führt zu, inverse: folgt aus }
  involves:   { label: betrifft, inverse: zeigt sich in }
  feeds:      { label: nährt, inverse: genährt von }
  produces:   { label: bewirkt, inverse: bewirkt durch }

nodes:
  # ---------------------------------------------------------------- hub
  adhd:
    label: ADHS
    description: >-
      Die Aufmerksamkeitsdefizit-Hyperaktivitätsstörung ist eine
      neurologische Entwicklungsbesonderheit, die Aufmerksamkeitssteuerung,
      Aktivitätsniveau, Impulskontrolle und exekutive Funktionen betrifft.
      Klicke auf eine Gruppe, um ihre Symptome zu erkunden, und folge dann
      den Verbindungen zu Auslösern, Strategien und Auswirkungen.

  # ---------------------------------------------------------------- cluster
  inattention:
    label: Unaufmerksamkeit
    description: >-
      Schwierigkeit, die Aufmerksamkeit dorthin zu lenken und dort zu halten,
      wo sie gebraucht wird, und manchmal das Gegenteil: nicht mehr loslassen
      zu können.
  hyperactivity:
    label: Hyperaktivität & Impulsivität
    description: >-
      Ein innerer Motor, der ständig läuft, und Handlungen, die vor dem
      Gedanken kommen, der ihnen hätte vorausgehen sollen. Bei Erwachsenen
      wird Hyperaktivität oft eher gefühlt als gesehen.
  executive:
    label: Exekutive Funktionen
    description: >-
      Die Steuerungsebene des Gehirns: anfangen, planen, ordnen, Prioritäten
      setzen, die Zeit im Blick behalten und Dinge im Kopf behalten.
  emotional:
    label: Emotionsregulation
    description: >-
      Gefühle, die schnell kommen, heftig treffen und länger brauchen, um sich
      zu legen. Kein Teil der formalen Diagnosekriterien, für viele
      Erwachsene aber einer der belastendsten Aspekte.

  # ---------------------------------------------------------------- symptom
  distractibility:
    label: Ablenkbarkeit
    description: >-
      Die Aufmerksamkeit wird von äußeren Reizen oder eigenen Gedanken
      weggezogen, selbst mitten in Aufgaben, die wichtig sind.
  sustained-attention:
    label: Schwierigkeit, die Aufmerksamkeit zu halten
    description: >-
      Lange Aufgaben mit wenig Reiz wie Lesen, Formulare oder Besprechungen
      sind schwer durchzuhalten. Die Aufmerksamkeit fehlt nicht, sie ist nur
      ungleich verfügbar.
  hyperfocus:
    label: Hyperfokus
    description: >-
      Intensives, kaum zu unterbrechendes Aufgehen in einer interessanten
      Tätigkeit, oft auf Kosten von allem anderen, auch Essen, Schlaf und
      anderen Menschen.
  forgetfulness:
    label: Vergesslichkeit
    description: >-
      Termine, Versprechen und Routineaufgaben gehen verloren. Meist nicht
      aus Gleichgültigkeit, sondern weil die Erinnerung nie im richtigen
      Moment kommt.
  losing-things:
    label: Dinge verlieren
    description: >-
      Schlüssel, Handy, Geldbeutel, Unterlagen. Dinge, die „nur kurz“
      abgelegt wurden, verschwinden.
  careless-mistakes:
    label: Flüchtigkeitsfehler
    description: >-
      Details werden in Arbeit oder Papierkram übersehen, obwohl der Stoff
      eigentlich gut bekannt ist.
  restlessness:
    label: Innere Unruhe
    description: >-
      Stillsitzen fühlt sich unangenehm an. Bei Erwachsenen ist das oft eine
      innere Anspannung statt sichtbarer Bewegung.
  fidgeting:
    label: Zappeln
    description: >-
      Tippen, Wippen, Zupfen, Herumrutschen. Oft eher eine Strategie zur
      Selbstregulation als eine Ablenkung.
  impulsivity:
    label: Impulsivität
    description: >-
      Handeln vor dem Denken: Dinge herausplatzen, Spontankäufe, schnelle
      Entschlüsse und riskante Entscheidungen.
  interrupting:
    label: Unterbrechen & viel reden
    description: >-
      Die Sätze anderer beenden, in Gespräche hineinplatzen, Monologe über
      ein Lieblingsthema halten.
  impatience:
    label: Ungeduld
    description: >-
      Warten in Schlangen, im Stau oder auf eine langsame Antwort fühlt sich
      körperlich schwer erträglich an.
  task-initiation:
    label: Schwierigkeit, anzufangen
    description: >-
      Genau wissen, was zu tun ist, und trotzdem nicht anfangen können.
      Manchmal als ADHS-Lähmung bezeichnet.
  procrastination:
    label: Aufschieben
    description: >-
      Aufgaben werden aufgeschoben, bis der Druck einer Frist genug
      Dringlichkeit liefert, um zu handeln.
  time-blindness:
    label: Zeitblindheit
    description: >-
      Ein schwaches Gespür dafür, wie viel Zeit vergangen ist und wie lange
      Dinge dauern. Chronische Verspätung und Überplanung sind die Folge.
  disorganisation:
    label: Unordnung
    description: >-
      Stapel, überfüllte Räume, chaotische Ablagen, verlorene Unterlagen.
  working-memory:
    label: Probleme mit dem Arbeitsgedächtnis
    description: >-
      Mehrere Dinge gleichzeitig im Kopf zu behalten ist schwer: mehrstufige
      Anweisungen, Kopfrechnen, sich erinnern, warum man in einen Raum
      gegangen ist.
  prioritising:
    label: Schwierigkeit, Prioritäten zu setzen
    description: >-
      Alles fühlt sich gleich dringend an, oder die unwichtigste Aufgabe wird
      zuerst erledigt, weil sie die interessanteste ist.
  task-switching:
    label: Schwierigkeit beim Aufgabenwechsel
    description: >-
      Übergänge kosten viel. Schwer aufzuhören mit dem, was man tut, und
      schwer, mit dem Nächsten anzufangen.
  emotional-dysregulation:
    label: Emotionale Dysregulation
    description: >-
      Gefühle kommen schnell und heftig und brauchen länger, um sich zu
      legen, als die Situation es zu rechtfertigen scheint.
  rejection-sensitivity:
    label: Empfindlichkeit gegenüber Ablehnung
    description: >-
      Wahrgenommene Kritik oder Ablehnung löst intensiven emotionalen Schmerz
      aus. Kein formaler Diagnosebegriff, aber sehr häufig berichtet.
  frustration-tolerance:
    label: Geringe Frustrationstoleranz
    description: >-
      Kleine Hindernisse können unverhältnismäßige Wut auslösen oder den
      Drang, ganz aufzugeben.
  boredom-intolerance:
    label: Unerträgliche Langeweile
    description: >-
      Unterforderung fühlt sich unangenehm an. Der Kopf sucht nach Neuem oder
      Intensivem, wo immer er es findet.
  sleep-problems:
    label: Schlafprobleme
    description: >-
      Schwer einschlafen, eine verschobene innere Uhr, und lange aufbleiben,
      um Zeit zurückzuholen, die der Tag nicht geboten hat.

  rumination:
    label: Grübeln
    description: >-
      Dieselbe Sorge läuft in Schleife: die Aufgabe, die E-Mail, das Gesagte.
      Es fühlt sich an wie Denken, bringt aber keine Entscheidung und
      verbrennt Energie.
  avoidance:
    label: Vermeidung
    description: >-
      Um die Aufgabe, die Nachricht oder die Person herumsteuern, die das
      Grauen auslöst. Erleichterung jetzt, ein größeres Problem später.
  out-of-sight:
    label: "Aus den Augen, aus dem Sinn"
    description: >-
      Was nicht sichtbar ist, hört auf zu existieren: die Rechnung in der
      Schublade, das Gemüse hinter der Milch, der Freund, dem du nicht
      zurückgeschrieben hast.
  decision-paralysis:
    label: Entscheidungslähmung
    description: >-
      Zu viele Möglichkeiten, jede braucht eine Entscheidung, also fällt
      keine. Stapel sind oft aufgeschobene Entscheidungen.
  anticipatory-anxiety:
    label: Grauen vor der Aufgabe
    description: >-
      Angst, die lange vor der Aufgabe kommt und oft mehr kostet als die
      Aufgabe selbst.

  # ---------------------------------------------------------------- trigger
  boring-tasks:
    label: Langweilige oder eintönige Aufgaben
    description: >-
      Aufgaben mit wenig Reiz bieten zu wenig Stimulation, um die
      Aufmerksamkeit zu halten.
  poor-sleep:
    label: Schlafmangel
    description: >-
      Fast jedes ADHS-Symptom wird nach einer schlechten Nacht schlimmer.
  noisy-environment:
    label: Laute Umgebung
    description: >-
      Großraumbüros, Cafés, ein Fernseher im Hintergrund.
  unclear-instructions:
    label: Unklare Anweisungen
    description: >-
      Vage oder nur mündliche Aufgaben bieten nichts, woran man sich
      festhalten kann.
  notifications:
    label: Benachrichtigungen & Handy
    description: >-
      Jedes Vibrieren ist eine Einladung, die Aufgabe zu verlassen.
  stress:
    label: Stress & Überlastung
    description: >-
      Zu viele Anforderungen auf einmal schrumpfen die ohnehin begrenzte
      exekutive Kapazität.
  long-meetings:
    label: Lange Besprechungen
    description: >-
      Eine Stunde passives Zuhören ohne Beteiligung.
  open-ended-tasks:
    label: Aufgaben ohne klares Ende
    description: >-
      Kein klarer Anfang, kein klares Ende, keine Definition von „fertig“.
  hunger:
    label: Hunger & ausgelassene Mahlzeiten
    description: >-
      Vergessen zu essen, dann der Einbruch.

  # ---------------------------------------------------------------- strategy
  body-doubling:
    label: Body Doubling
    description: >-
      Neben einer anderen Person arbeiten, im selben Raum oder per Video,
      deren Anwesenheit das Anfangen und Dranbleiben erleichtert.
  pomodoro:
    label: Pomodoro-Timer
    description: >-
      In kurzen, getakteten Sprints mit Pausen dazwischen arbeiten. Der Timer
      gibt Struktur vor und vor allem ein Ende.
  visual-timers:
    label: Visuelle Timer
    description: >-
      Timer, die die Zeit als schrumpfende Scheibe oder Balken zeigen, machen
      das Vergehen der Zeit sichtbar.
  external-reminders:
    label: Wecker & externe Erinnerungen
    description: >-
      Das Gedächtnis aus dem Kopf holen: Handywecker,
      Kalenderbenachrichtigungen, Haftnotizen genau dort, wo gehandelt werden
      muss.
  task-breakdown:
    label: Aufgaben in winzige Schritte zerlegen
    description: >-
      Aus „den Bericht schreiben“ wird „das Dokument öffnen, eine Überschrift
      schreiben“. Der erste Schritt sollte fast lächerlich klein sein.
  checklists:
    label: Schriftliche Checklisten
    description: >-
      Den Plan zu Papier bringen, damit das Arbeitsgedächtnis ihn nicht
      halten muss.
  home-for-things:
    label: Ein fester Platz für alles
    description: >-
      Feste Plätze für Schlüssel, Geldbeutel und Brille. Eine Schale an der
      Tür schlägt jede gedankliche Notiz.
  exercise:
    label: Regelmäßige Bewegung
    description: >-
      Ausdauerbewegung verbessert Aufmerksamkeit und Stimmung für Stunden und
      hilft beim Schlafen.
  sleep-routine:
    label: Feste Schlafroutine
    description: >-
      Eine feste Aufstehzeit, ein Abendritual, keine Bildschirme im
      Schlafzimmer.
  mindfulness:
    label: Achtsamkeitsübungen
    description: >-
      Kurze, regelmäßige Übung darin, abschweifende Aufmerksamkeit und
      aufsteigende Gefühle zu bemerken, bevor sie die Kontrolle übernehmen.
  fidget-tools:
    label: Fidget-Spielzeug
    description: >-
      Dem Körper etwas zu tun geben kann Aufmerksamkeit freisetzen, statt sie
      zu verbrauchen.
  noise-control:
    label: Kopfhörer & weißes Rauschen
    description: >-
      Kopfhörer mit Geräuschunterdrückung oder ein gleichmäßiges
      Hintergrundgeräusch verringern akustische Ablenkung.
  time-boxing:
    label: Zeitblöcke im Kalender
    description: >-
      Jeder Aufgabe einen Platz im Kalender geben, mit einer realistischen,
      meist längeren Schätzung.
  accountability-partner:
    label: Verbindlichkeitspartner
    description: >-
      Jemandem sagen, was man bis wann erledigt, und anschließend Bericht
      erstatten.
  routines:
    label: Routinen & Gewohnheiten koppeln
    description: >-
      Neue Gewohnheiten an bestehende Anker koppeln (nach dem Kaffee die
      Medikamente nehmen), damit weniger Entscheidungen nötig sind.
  prepare-night-before:
    label: Am Abend vorher vorbereiten
    description: >-
      Kleidung, Tasche, Essen und Schlüssel bereitlegen. Der Morgen läuft
      dann auf Autopilot.
  externalise-memory:
    label: Arbeitsgedächtnis auslagern
    description: >-
      Whiteboards, Notiz-Apps, Sprachmemos. Den Gedanken in dem Moment
      festhalten, in dem er auftaucht.
  dopamine-menu:
    label: Dopamin-Menü
    description: >-
      Eine vorbereitete Liste gesunder, belohnender Aktivitäten, zu der man
      greift statt zum endlosen Scrollen.
  gamification:
    label: Aufgaben spielerisch gestalten
    description: >-
      Punkte, Serien, Wettläufe gegen die Uhr. Neuheit und Wettbewerb
      schaffen die Dringlichkeit, die langweiligen Aufgaben fehlt.
  single-tasking:
    label: Eine Sache auf einmal
    description: >-
      Ein Tab, eine Aufgabe, eine Sache auf dem Schreibtisch. Die
      Angriffsfläche für Ablenkung verkleinern.
  done-not-perfect:
    label: Fertig schlägt perfekt
    description: >-
      Die Messlatte bewusst senken. Perfektionismus ist ein häufiger Treiber
      des Aufschiebens.
  pause-before-acting:
    label: Innehalten vor dem Handeln
    description: >-
      Eine eingebaute Verzögerung: 24 Stunden vor einem Kauf, ein langsamer
      Atemzug vor einer Antwort.
  self-compassion:
    label: Selbstmitgefühl
    description: >-
      Ausrutscher als Daten behandeln, nicht als Beweis für Versagen. Scham
      nährt die Vermeidung.
  decision-reduction:
    label: Weniger Entscheidungen
    description: >-
      Weniger Entscheidungen treffen müssen: Standardmahlzeiten, eine kleine
      Garderobe, Standardantworten.

  movement-breaks:
    label: Bewegungspausen
    description: >-
      Jede Stunde ein kurzer Gang, eine Treppe oder Dehnen. Besprechungen im
      Gehen und ein Stehschreibtisch zählen auch.
  write-it-down-instead:
    label: Aufschreiben statt aussprechen
    description: >-
      Während eines Gesprächs den Gedanken auf Papier notieren, damit er nicht
      mehr herausdrängt. Er kann angesprochen werden, sobald das Gegenüber
      fertig ist.
  item-trackers:
    label: Bluetooth-Tracker
    description: >-
      Kleine Anhänger an Schlüssel, Geldbeutel und Tasche, und ein Handy, das
      sie klingeln lassen kann. Macht aus zwanzig Minuten Suchen zwanzig
      Sekunden.
  duplicate-essentials:
    label: Wichtiges doppelt haben
    description: >-
      Ersatzschlüssel beim Nachbarn, ein Ladekabel in jeder Tasche, eine
      Lesebrille in jedem Zimmer. Ein verlorenes Exemplar ist dann keine Krise
      mehr.
  final-review-pass:
    label: Abschließender Kontrollgang
    description: >-
      Eine eigene, bewusste Prüfung, wenn die Arbeit fertig wirkt, am besten
      nach einer Pause und anhand einer kurzen Liste der eigenen typischen
      Fehler.
  written-instructions:
    label: Um schriftliche Anweisungen bitten
    description: >-
      Aufgaben per Nachricht oder E-Mail erbitten, oder das Gehörte selbst
      aufschreiben und zur Bestätigung zurückschicken.
  repeat-back:
    label: Wiederholen und zusammenfassen
    description: >-
      Bevor ein Gespräch endet, wiedergeben, was man verstanden hat und was
      man tun wird. Lücken zeigen sich, solange sie noch billig zu schließen
      sind.
  hyperfocus-exit:
    label: Ausstiegsritual aus dem Hyperfokus
    description: >-
      Ein harter Stopp-Alarm, gestellt vor dem Anfangen, Wasser und Essen in
      Reichweite, und eine notierte Zeile, wo es nächstes Mal weitergeht.
  name-the-emotion:
    label: Das Gefühl benennen
    description: >-
      Das Gefühl in Worte fassen, etwa „das ist Frust, ungefähr sieben von
      zehn“, öffnet eine kleine Lücke zwischen Gefühl und Reaktion.
  cooling-off-rule:
    label: Abkühlregel
    description: >-
      Eine Vereinbarung mit sich selbst und den Menschen im Umfeld: keine
      wichtigen Antworten oder Entscheidungen, solange die Welle hoch ist.
      Nach zwanzig Minuten oder am nächsten Morgen noch einmal ansehen.
  ask-instead-of-assume:
    label: Nachfragen statt annehmen
    description: >-
      Wenn eine Nachricht wie Ablehnung klingt, vor der Reaktion nachfragen:
      „Meintest du ...?“ Die meisten gefühlten Kränkungen lösen sich beim
      Kontakt mit den Fakten auf.
  distress-tolerance:
    label: Fertigkeiten zur Stresstoleranz
    description: >-
      Fertigkeiten aus der dialektisch-behavioralen Therapie, um den Körper
      schnell herunterzufahren: kaltes Wasser ins Gesicht, ruhiges Atmen im
      Takt, ein kurzer intensiver Bewegungsschub.
  automatic-payments:
    label: Automatische Zahlungen
    description: >-
      Lastschrift für jede wiederkehrende Rechnung, Sparen direkt am Zahltag,
      eine Karte für alle Abos. Das System erinnert sich, damit du es nicht
      musst.
  subscription-audit:
    label: Abo-Check
    description: >-
      Alle paar Monate eine Erinnerung, jedes Abo aufzulisten und zu kündigen,
      was nicht mehr genutzt wird.
  explain-your-adhd:
    label: "Erklären, wie sich dein ADHS zeigt"
    description: >-
      Partnern, Freunden und Kollegen vorab sagen, womit sie rechnen können,
      etwa späte Antworten, Unterbrechungen oder ein verlorener Faden, und was
      hilft.
  repair-routine:
    label: Reparaturroutine
    description: >-
      Eine vereinbarte Art, einen Ausrutscher anzuerkennen, sich zu
      entschuldigen und neu zu starten, damit sich vergessene Versprechen auf
      keiner Seite zu Groll aufstauen.
  shared-calendar:
    label: Gemeinsamer Kalender
    description: >-
      Ein Kalender, den Partner oder Haushalt sehen, für Termine,
      Schulveranstaltungen und gegebene Versprechen. Nichts lebt nur in einem
      Kopf.
  buffer-time:
    label: Zeitpuffer
    description: >-
      Fünfzehn Minuten früher ankommen und einen Tag vor der echten Frist
      fertig sein wollen. Der Puffer fängt die Zeitblindheit ab.
  deadline-check-ins:
    label: Zwischenstände vor der Frist
    description: >-
      Zwischenziele, vereinbart mit dem, der auf die Arbeit wartet. Jedes ist
      eine kleine Frist mit echter Dringlichkeit.
  recovery-time:
    label: Eingeplante Erholungszeit
    description: >-
      Bewusst unverplante Zeit nach anstrengenden Tagen, im Kalender geschützt
      wie der Schlaf. Den ganzen Tag ADHS auszugleichen hat einen Preis, der
      zurückgezahlt werden muss.
  reduce-masking:
    label: Weniger maskieren
    description: >-
      Ein paar Orte und Menschen wählen, bei denen du aufhörst, neurotypisch
      zu spielen: zappeln, mitschreiben, um Wiederholung bitten, gehen, wenn
      du musst.
  play-to-strengths:
    label: Auf Stärken setzen
    description: >-
      Die Arbeit hin zu den interessengetriebenen, kreativen, krisenfesten
      Aufgaben lenken, in denen ADHS-Gehirne glänzen, und den Rest
      wegverhandeln oder automatisieren.
  interest-pairing:
    label: Langweiliges mit Angenehmem koppeln
    description: >-
      Der Lieblingspodcast nur beim Hausputz, Papierkram nur im guten Café.
      Die angenehme Hälfte liefert den Reiz, der der Aufgabe fehlt.

  behavioural-activation:
    label: Verhaltensaktivierung
    description: >-
      Jeden Tag eine kleine angenehme oder sinnvolle Aktivität einplanen und
      tun, egal ob man Lust hat. Die Stimmung folgt dem Handeln mehr als das
      Handeln der Stimmung.
  morning-daylight:
    label: Morgenlicht
    description: >-
      Zehn Minuten Tageslicht draußen kurz nach dem Aufwachen verankern die
      innere Uhr und heben die Stimmung.
  social-contact:
    label: Sozialer Kontakt
    description: >-
      Ein kurzer Anruf oder ein Spaziergang mit jemandem, besonders an den
      Tagen, an denen man am wenigsten Lust hat. Isolation nährt die gedrückte
      Stimmung.
  worry-window:
    label: Sorgenfenster
    description: >-
      Fünfzehn Minuten am Tag, um jede Sorge aufzuschreiben. Außerhalb des
      Fensters bekommt die Sorge eine Notiz und einen Termin statt deiner
      Aufmerksamkeit.
  less-alcohol:
    label: Weniger Alkohol
    description: >-
      Alkohol verschlechtert Schlaf, Impulsivität und Stimmung für Tage.
      Weniger zu trinken ist eine der günstigsten Verbesserungen überhaupt.
  nightly-reset:
    label: Zehn-Minuten-Reset am Abend
    description: >-
      Ein Timer, eine Runde durch die Wohnung, alles zurück an seinen Platz.
      Kein Putzen, nur Zurücksetzen. Klein genug für jeden Abend.
  one-surface:
    label: Eine Fläche pro Runde
    description: >-
      Eine Arbeitsplatte, eine Schublade, eine Ecke, dann Schluss. Nie ein
      Marathon durchs ganze Zimmer: der Marathon fängt nie an.
  doom-box:
    label: Die Kiste für später
    description: >-
      Eine Kiste für den Stapel Dinge, die eine Entscheidung brauchen. Die
      Fläche ist jetzt frei, die Entscheidungen warten auf einen ruhigeren
      Moment.
  own-less:
    label: Weniger besitzen
    description: >-
      Weniger Dinge heißt weniger Plätze zu merken und weniger Entscheidungen
      pro Aufräumrunde. Eins rein, eins raus.
  visible-storage:
    label: Sichtbar aufbewahren
    description: >-
      Offene Regale, durchsichtige Boxen, Haken statt Schubladen. Wenn
      geschlossene Türen Dinge löschen, dann lass sie offen.
  sort-by-frequency:
    label: "Nach Häufigkeit ordnen, nicht nach Kategorie"
    description: >-
      Was täglich gebraucht wird, liegt in Reichweite des Ortes, an dem es
      gebraucht wird. Alles andere darf weiter weg und weniger geordnet sein.
  launch-pad:
    label: Startplatz an der Tür
    description: >-
      Ein Platz für Schlüssel, Tasche, Geldbeutel und alles, was morgen das
      Haus verlassen muss. Losgehen wird zu einer einzigen Bewegung.
  define-done:
    label: Fertig definieren
    description: >-
      Vor dem Anfangen einen Satz schreiben, wie fertig aussieht. Eine Aufgabe
      ohne Ende ist eine Aufgabe, die nie beginnt.
  five-minute-rule:
    label: Fünf-Minuten-Regel
    description: >-
      Nur fünf Minuten der gefürchteten Sache tun. Nach fünf Minuten aufhören
      ist erlaubt. Meistens tut man es nicht.

  # ---------------------------------------------------------------- treatment
  assessment:
    label: Diagnose & Abklärung
    description: >-
      Eine formale Abklärung durch eine qualifizierte Fachperson ist der
      Zugang zu Behandlung und Anpassungen.
  medication:
    label: Medikamente
    description: >-
      Stimulanzien und Nicht-Stimulanzien, ärztlich verordnet und begleitet.
      Für viele Erwachsene eine Behandlung erster Wahl.
  cbt:
    label: KVT bei ADHS
    description: >-
      Kognitive Verhaltenstherapie, angepasst an ADHS: Fertigkeiten für
      Planung, Aufschieben und ungünstige Denkmuster.
  coaching:
    label: ADHS-Coaching
    description: >-
      Praktische, zielorientierte Unterstützung beim Aufbau von Systemen und
      Routinen, die zur Person passen.
  workplace-accommodations:
    label: Anpassungen am Arbeitsplatz
    description: >-
      Flexible Arbeitszeiten, schriftliche Anweisungen, ein ruhiger
      Arbeitsplatz, Zwischenchecks bei Fristen.

  psychotherapy:
    label: Psychotherapie
    description: >-
      Gesprächstherapie bei einer qualifizierten Fachperson für Angst,
      gedrückte Stimmung und Selbstbild, die oft rund um ADHS entstehen.
  crisis-help:
    label: "Wenn es dunkel wird: jetzt Hilfe holen"
    description: >-
      Wenn die Gedanken dahin gehen, nicht mehr da sein zu wollen, heute noch
      Arztpraxis, Krisentelefon oder Notruf kontaktieren. Das ist eine
      medizinische Situation, kein Charakterfehler.
  professional-organiser:
    label: Professionelle Ordnungshilfe oder Reinigungskraft
    description: >-
      Bezahlte Hilfe, um eine Wohnung einzurichten, die sich selbst trägt,
      oder um sie am Laufen zu halten. Eine Anpassung, kein Versagen.

  # ---------------------------------------------------------------- impact
  missed-deadlines:
    label: Verpasste Fristen
    description: >-
      Arbeit wird zu spät oder gar nicht abgeliefert, trotz guter Absichten
      und echter Anstrengung.
  relationship-strain:
    label: Belastete Beziehungen
    description: >-
      Vergessene Versprechen, Unterbrechungen und Gefühlsausbrüche zehren an
      Partnerschaft, Freundschaften und Kollegen.
  low-self-esteem:
    label: Geringes Selbstwertgefühl
    description: >-
      Jahre von „streng dich einfach mehr an“ hinterlassen das Gefühl, faul
      oder kaputt zu sein.
  burnout:
    label: Burnout
    description: >-
      Symptome zu verbergen und ständig auszugleichen ist erschöpfend.
  financial-trouble:
    label: Finanzielle Probleme
    description: >-
      Mahngebühren, vergessene Abos, Spontankäufe.
  underachievement:
    label: Unter den Möglichkeiten bleiben
    description: >-
      Leistung unter den eigenen Fähigkeiten in Schule oder Beruf.
  anxiety-depression:
    label: Angst & Depression
    description: >-
      Häufig gleichzeitig auftretende Erkrankungen, oft genährt von den
      anderen Auswirkungen auf dieser Karte.
  energy-drain:
    label: Energieverlust
    description: >-
      Die Erschöpfung nach Stunden voller Sorgen, Maskieren und Ausgleichen,
      ohne etwas vorweisen zu können.

  # ---------------------------------------------------------------- situation
  chaotic-home:
    label: Chaos in der Wohnung
    description: >-
      Stapel auf jeder Fläche, eine Küche, die sich nie von selbst
      zurücksetzt, das Gefühl, dass die Wohnung gewinnt. Hier stapeln sich
      mehrere Symptome, deshalb reicht Willenskraft allein nicht.
  dreaded-task:
    label: "Eine Aufgabe, vor der ich mich fürchte"
    description: >-
      Die E-Mail, das Formular, der Anruf. Sie liegt da, wird jeden Tag größer
      und startet eine Schleife, die mehr Energie kostet, als sie zu
      erledigen.
  money-admin:
    label: Geldkram
    description: >-
      Rechnungen, Abos, Steuern, das Konto, das du seit Monaten nicht geöffnet
      hast. Vergesslichkeit, Vermeidung und Impulsivität treffen sich hier.

  # ---------------------------------------------------------------- mechanism
  dopamine-boost:
    label: Dopamin und Noradrenalin steigen
    description: >-
      Ausdauerbewegung erhöht für einige Stunden dieselben Botenstoffe, auf
      die ADHS-Medikamente zielen.
  deeper-sleep:
    label: Tieferer Schlaf
    description: >-
      Körperliche Müdigkeit erleichtert das Einschlafen und vertieft den
      Schlaf, was am nächsten Tag fast alles verbessert.
  stress-hormones-drop:
    label: Stresshormone sinken
    description: >-
      Bewegung baut die Stressreaktion ab, sodass der Körper dem Kopf keine
      Gefahr mehr meldet.
  energy-discharged:
    label: Unruhe abgebaut
    description: >-
      Der innere Motor bekommt ein Ventil, und Stillsitzen kostet danach
      weniger.
  mood-lift:
    label: Stimmungshoch
    description: >-
      Ein verlässlicher, wenn auch vorübergehender Stimmungsschub, der sich
      summiert, wenn er an den meisten Tagen passiert.

edges:
  hyperfocus-time-blindness:
    note: >-
      Im Hyperfokus verschwinden Stunden.
  sleep-problems-time-blindness:
    note: >-
      Die Schlafenszeit rutscht immer weiter, weil sich der Abend kürzer
      anfühlt, als er ist.
  body-doubling-task-initiation:
    note: >-
      Die Anwesenheit einer anderen Person liefert das Startsignal, das das
      Gehirn allein nicht erzeugt.
  pomodoro-task-initiation:
    note: >-
      Sich nur auf 25 Minuten festzulegen senkt die Hürde zum Anfangen.
  pomodoro-hyperfocus:
    note: >-
      Der Pausenalarm ist ein äußerer Unterbrecher für eine Sitzung, die
      sonst stundenlang liefe.
  fidget-tools-fidgeting:
    note: >-
      Lenkt die Bewegung in Bahnen, statt sie zu unterdrücken.
  routines-task-switching:
    note: >-
      Ein festes Übergangsritual macht den Wechsel vorhersehbar.
  pause-before-acting-rejection-sensitivity:
    note: >-
      Vor der Antwort auf eine gefühlte Kränkung zu warten gibt der ersten
      Gefühlswelle Zeit, vorbeizuziehen.
  write-it-down-instead-interrupting:
    note: >-
      Der Drang zu unterbrechen ist oft die Angst, den Gedanken zu verlieren.
      Auf Papier kann er warten.
  explain-your-adhd-relationship-strain:
    note: >-
      Späte Antworten und verlorene Fäden sind leichter zu verzeihen, wenn sie
      vorher angekündigt waren.
  buffer-time-missed-deadlines:
    note: >-
      Den Puffer als die echte Frist behandeln. Die wirkliche ist nur das
      Sicherheitsnetz.
  reduce-masking-burnout:
    note: >-
      Maskieren kostet mehr Energie, als die Menschen um dich herum sehen
      können.
  avoidance-dreaded-task:
    note: >-
      Nichts wurde getan, die Frist ist näher, und die Aufgabe sieht größer
      aus als vorher.
  five-minute-rule-avoidance:
    note: >-
      Fünf Minuten sind klein genug zum Anfangen, und Anfangen ist das ganze
      Problem.
  exercise-dopamine-boost:
    note: >-
      Deshalb kann sich ein Lauf vor einer langweiligen Aufgabe wie eine Dosis
      Medikament anfühlen.
