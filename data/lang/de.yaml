  hidden_many: "{count} verbundene Knoten sind noch nicht sichtbar. Klicke erneut auf den Knoten, um sie aufzudecken."
  fold_one: Alle Verbindungen sind auf der Karte. Klicke erneut auf den Knoten, um den aufgedeckten Knoten wieder einzuklappen.
  fold_many: "Alle Verbindungen sind auf der Karte. Klicke erneut auf den Knoten, um die {count} aufgedeckten Knoten wieder einzuklappen."
