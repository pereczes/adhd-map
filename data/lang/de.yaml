nodes:
  # ---------------------------------------------------------------- hub
  adhd:
    label: ADHS
    description: >-
      Die Aufmerksamkeitsdefizit-Hyperaktivitätsstörung ist eine neurologische
      Entwicklungsbesonderheit, die Aufmerksamkeitssteuerung,
      Aktivitätsniveau, Impulskontrolle und exekutive Funktionen betrifft.
      Klicke auf eine Gruppe, um ihre Symptome zu erkunden, und folge dann den
      Verbindungen zu Auslösern, Strategien und Auswirkungen. Diese Landkarte
      ist ein Bildungsangebot, keine Diagnose. Sie enthält diagnostische
      Symptome, häufig begleitende Erfahrungen, gleichzeitig auftretende
      Probleme und praktische Strategien. Kein einzelner Knoten begründet
      ADHS. Eine Diagnose wägt den Beginn in der Kindheit, die
      Dauerhaftigkeit, Schwierigkeiten in mehr als einem Lebensbereich und
      andere mögliche Erklärungen ab.
    facts:
      - text: >-
          Über 175 Studien weltweit zusammengefasst erfüllen etwa 7% der
          Kinder und Jugendlichen die Kriterien für ADHS.
        source: thomas-2015
      - text: >-
          In einer US-Erhebung von 2001 bis 2003 erfüllten 4,4% der
          Erwachsenen zwischen 18 und 44 Jahren die Kriterien für eine
          aktuelle ADHS.
        source: kessler-2006
      - text: >-
          In einer US-Erhebung unter Jugendlichen von 2001 bis 2004 hatten 13%
          der Jungen und 4,2% der Mädchen irgendwann in ihrem Leben ADHS.
        source: nimh-adhd-stats
      - text: >-
          In der Erwachsenenerhebung desselben Zeitraums fand sich eine
          aktuelle ADHS bei 5,4% der Männer und 3,2% der Frauen. Lebenszeit-
          und Aktuellzahlen stammen aus verschiedenen Erhebungen mit
          verschiedenen Maßen und lassen sich nicht direkt vergleichen.
        source: nimh-adhd-stats
      - text: >-
          2023 berichteten in den Vereinigten Staaten geschätzt 15,5 Millionen
          Erwachsene, etwa 6%, eine aktuelle ADHS-Diagnose. Rund die Hälfte
          erhielt sie erst mit 18 Jahren oder später.
        source: cdc-adult-adhd
      - text: >-
          Zwillingsstudien beziffern die Erblichkeit von ADHS auf etwa 74%.
        source: faraone-2019

  # ---------------------------------------------------------------- cluster
  inattention:
    label: Unaufmerksamkeit
    description: >-
      Schwierigkeit, die Aufmerksamkeit dorthin zu lenken und dort zu halten,
      wo sie gebraucht wird, und manchmal das Gegenteil: nicht mehr loslassen
      zu können.
  hyperactivity:
    label: "Hyperaktivität & Impulsivität"
    description: >-
      Ein innerer Motor, der ständig läuft, und Handlungen, die vor dem
      Gedanken kommen, der ihnen hätte vorausgehen sollen. Bei Erwachsenen
      wird Hyperaktivität oft eher gefühlt als gesehen.
  executive:
    label: Exekutive Funktionen
    description: >-
      Die Steuerungsebene des Gehirns: anfangen, planen, ordnen, Prioritäten
      setzen, die Zeit im Blick behalten und Dinge im Kopf behalten.
  emotional:
    label: Emotionsregulation
    description: >-
      Gefühle, die schnell kommen, heftig treffen und länger brauchen, um sich
      zu legen. Kein Teil der formalen Diagnosekriterien, für viele Erwachsene
      aber einer der belastendsten Aspekte.
  thinking-traps:
    label: Denkfallen
    description: >-
      Gewohnheitsmäßige Verzerrungen in der Deutung von Ereignissen. Die KVT
      nennt sie kognitive Verzerrungen. Jahre der Kritik machen einige davon
      bei ADHS besonders häufig.

  # ---------------------------------------------------------------- symptom
  distractibility:
    label: Ablenkbarkeit
    description: >-
      Die Aufmerksamkeit wird von äußeren Reizen oder eigenen Gedanken
      weggezogen, selbst mitten in Aufgaben, die wichtig sind.
  sustained-attention:
    label: "Schwierigkeit, die Aufmerksamkeit zu halten"
    description: >-
      Lange Aufgaben mit wenig Reiz wie Lesen, Formulare oder Besprechungen
      sind schwer durchzuhalten. Die Aufmerksamkeit fehlt nicht, sie ist nur
      ungleich verfügbar.
  hyperfocus:
    label: Hyperfokus
    description: >-
      Intensives, kaum zu unterbrechendes Aufgehen in einer interessanten
      Tätigkeit, oft auf Kosten von allem anderen, auch Essen, Schlaf und
      anderen Menschen.
    aliases: [Tunnelblick]
  forgetfulness:
    label: Vergesslichkeit
    description: >-
      Termine, Versprechen und Routineaufgaben gehen verloren. Meist nicht aus
      Gleichgültigkeit, sondern weil die Erinnerung nie im richtigen Moment
      kommt.
  losing-things:
    label: Dinge verlieren
    description: >-
      Schlüssel, Handy, Geldbeutel, Unterlagen. Dinge, die „nur kurz“ abgelegt
      wurden, verschwinden.
  careless-mistakes:
    label: Flüchtigkeitsfehler
    description: >-
      Details werden in Arbeit oder Papierkram übersehen, obwohl der Stoff
      eigentlich gut bekannt ist.
    aliases: [übersehene Details]
  restlessness:
    label: Innere Unruhe
    description: >-
      Stillsitzen fühlt sich unangenehm an. Bei Erwachsenen ist das oft eine
      innere Anspannung statt sichtbarer Bewegung.
  fidgeting:
    label: Zappeln
    description: >-
      Tippen, Wippen, Zupfen, Herumrutschen. Oft eher eine Strategie zur
      Selbstregulation als eine Ablenkung.
  impulsivity:
    label: Impulsivität
    description: >-
      Handeln vor dem Denken: Dinge herausplatzen, Spontankäufe, schnelle
      Entschlüsse und riskante Entscheidungen.
  interrupting:
    label: "Unterbrechen & viel reden"
    description: >-
      Die Sätze anderer beenden, in Gespräche hineinplatzen, Monologe über ein
      Lieblingsthema halten.
  impatience:
    label: Ungeduld
    description: >-
      Warten in Schlangen, im Stau oder auf eine langsame Antwort fühlt sich
      körperlich schwer erträglich an.
  task-initiation:
    label: "Schwierigkeit, anzufangen"
    description: >-
      Genau wissen, was zu tun ist, und trotzdem nicht anfangen können.
      Manchmal als ADHS-Lähmung bezeichnet.
    aliases: [ADHS-Lähmung, exekutive Dysfunktion]
  procrastination:
    label: Aufschieben
    description: >-
      Aufgaben werden aufgeschoben, bis der Druck einer Frist genug
      Dringlichkeit liefert, um zu handeln.
  time-blindness:
    label: Zeitblindheit
    description: >-
      Ein schwaches Gespür dafür, wie viel Zeit vergangen ist und wie lange
      Dinge dauern. Chronische Verspätung und Überplanung sind die Folge.
    aliases: [Zeitmanagement, immer zu spät]
  disorganisation:
    label: Unordnung
    description: >-
      Stapel, überfüllte Räume, chaotische Ablagen, verlorene Unterlagen.
  working-memory:
    label: Probleme mit dem Arbeitsgedächtnis
    description: >-
      Mehrere Dinge gleichzeitig im Kopf zu behalten ist schwer: mehrstufige
      Anweisungen, Kopfrechnen, sich erinnern, warum man in einen Raum
      gegangen ist.
    aliases: [Kurzzeitgedächtnis]
  prioritising:
    label: "Schwierigkeit, Prioritäten zu setzen"
    description: >-
      Alles fühlt sich gleich dringend an, oder die unwichtigste Aufgabe wird
      zuerst erledigt, weil sie die interessanteste ist.
  task-switching:
    label: Schwierigkeit beim Aufgabenwechsel
    description: >-
      Übergänge kosten viel. Schwer aufzuhören mit dem, was man tut, und
      schwer, mit dem Nächsten anzufangen.
  emotional-dysregulation:
    label: Emotionale Dysregulation
    description: >-
      Gefühle kommen schnell und heftig und brauchen länger, um sich zu legen,
      als die Situation es zu rechtfertigen scheint.
    aliases: [Stimmungsschwankungen]
  rejection-sensitivity:
    label: Empfindlichkeit gegenüber Ablehnung
    description: >-
      Wahrgenommene Kritik, Ausgrenzung oder Ablehnung kann starkes Leid
      auslösen. Das ist kein diagnostisches ADHS-Kriterium und nicht auf ADHS
      beschränkt, kann aber mit emotionaler Dysregulation und früheren
      Erfahrungen von Kritik zusammenwirken. Das weitergehende Konzept einer
      Ablehnungsempfindlichkeits-Dysphorie hat wenig Forschungsgrundlage.
    aliases: [RSD, Rejection Sensitive Dysphoria]
  frustration-tolerance:
    label: Geringe Frustrationstoleranz
    description: >-
      Kleine Hindernisse können unverhältnismäßige Wut auslösen oder den
      Drang, ganz aufzugeben.
  boredom-intolerance:
    label: Unerträgliche Langeweile
    description: >-
      Unterforderung fühlt sich unangenehm an. Der Kopf sucht nach Neuem oder
      Intensivem, wo immer er es findet.
  sleep-problems:
    label: Schlafprobleme
    description: >-
      Schwer einschlafen, eine verschobene innere Uhr, und lange aufbleiben,
      um Zeit zurückzuholen, die der Tag nicht geboten hat.
  rumination:
    label: Grübeln
    description: >-
      Dieselbe Sorge läuft in Schleife: die Aufgabe, die E-Mail, das Gesagte.
      Es fühlt sich an wie Denken, bringt aber keine Entscheidung und
      verbrennt Energie.
  avoidance:
    label: Vermeidung
    description: >-
      Um die Aufgabe, die Nachricht oder die Person herumsteuern, die das
      Grauen auslöst. Erleichterung jetzt, ein größeres Problem später.
  out-of-sight:
    label: "Aus den Augen, aus dem Sinn"
    description: >-
      Was nicht sichtbar ist, hört auf zu existieren: die Rechnung in der
      Schublade, das Gemüse hinter der Milch, der Freund, dem du nicht
      zurückgeschrieben hast.
  decision-paralysis:
    label: Entscheidungslähmung
    description: >-
      Zu viele Möglichkeiten, jede braucht eine Entscheidung, also fällt
      keine. Stapel sind oft aufgeschobene Entscheidungen.
  anticipatory-anxiety:
    label: Grauen vor der Aufgabe
    description: >-
      Angst, die lange vor der Aufgabe kommt und oft mehr kostet als die
      Aufgabe selbst.
  catastrophising:
    label: Katastrophisieren
    description: >-
      Zum schlimmstmöglichen Ausgang springen und ihn für wahrscheinlich
      halten: eine verspätete E-Mail wird zum Jobverlust.
  all-or-nothing:
    label: Alles-oder-nichts-Denken
    description: >-
      Alles unterhalb von perfekt zählt als Scheitern. Ein ausgelassenes
      Training bedeutet, dass der ganze Plan ruiniert ist.
  mind-reading:
    label: Gedankenlesen
    description: >-
      Annehmen, zu wissen, was andere über dich denken, meist das Schlimmste,
      ohne nachzufragen.
  overgeneralisation:
    label: Übergeneralisieren
    description: >-
      Ein Rückschlag wird zur Regel über das ganze Leben: „Ich vermassle das
      immer.“
  should-statements:
    label: Sollte-Sätze
    description: >-
      Starre Regeln, wie du und andere sich verhalten müssen. Jedes nicht
      erfüllte „sollte“ erzeugt Schuld oder Ärger.
  personalisation:
    label: Personalisieren
    description: >-
      Verantwortung für Dinge außerhalb der eigenen Kontrolle übernehmen oder
      neutrale Ereignisse auf sich beziehen.
  safety-behaviours:
    label: Sicherheitsverhalten
    description: >-
      Kleine Dinge, um sich in gefürchteten Situationen sicherer zu fühlen:
      jeden Satz proben, die Kamera auslassen, immer einen Ausweg haben. Sie
      bringen Erleichterung und halten die Angst am Leben.
  sensory-sensitivity:
    label: Reizempfindlichkeit
    description: >-
      Geräusche, Gerüche, Stoffe oder Licht können ungewöhnlich intensiv
      wirken oder ständig Aufmerksamkeit abziehen. Sensorische Besonderheiten
      werden von Menschen mit ADHS häufiger berichtet, sie gehören aber nicht
      zu den diagnostischen Kriterien und kommen auch bei anderen Erkrankungen
      vor.
    aliases: [Überempfindlichkeit]
    facts:
      - text: >-
          In einer Studie mit Erwachsenen mit ADHS berichteten 43% der Frauen
          und 22% der Männer von sensorischer Unter- oder Überempfindlichkeit.
        source: bijlenga-2017
  misophonia:
    label: Misophonie
    description: >-
      Heftige Wut oder Ekel bei bestimmten Geräuschen wie Kauen, Tippen oder
      Schniefen. Sie kann zusammen mit ADHS auftreten, wie beide
      zusammenhängen, wird aber noch untersucht.
    facts:
      - text: >-
          In einer Stichprobe von 575 Personen mit Misophonie berichteten 5%
          von ADHS.
        source: jager-2020
  follow-through:
    label: "Schwierigkeit, Dinge zu Ende zu bringen"
    description: >-
      Eine Aufgabe oder die erste Anweisung beginnen und dann den Faden
      verlieren, bevor alle Schritte erledigt sind. Die Absicht war echt, der
      Faden hat nicht gehalten.
  losing-conversation-thread:
    label: Den Faden im Gespräch verlieren
    description: >-
      Die Aufmerksamkeit rutscht weg, während jemand spricht, und ein Teil des
      Gesagten kommt nie an. Das wirkt wie Nichtzuhören, obwohl die Person
      sich sehr bemüht zu folgen.
  mind-wandering:
    label: Ausgeprägtes Gedankenwandern
    description: >-
      Ein Strom kurzer, unzusammenhängender Gedanken zieht die Aufmerksamkeit
      von der Aufgabe weg. Anders als beim Grübeln springt der Kopf zwischen
      Themen, statt um eine Sorge zu kreisen.
    aliases: [Tagträumen]
  planning-sequencing:
    label: Schwierigkeit beim Planen und Ordnen
    description: >-
      Das Ziel kennen, aber sich schwertun, eine Reihenfolge zu wählen,
      Abhängigkeiten zu sehen und daraus eine machbare Abfolge von Schritten
      zu machen.

  # ---------------------------------------------------------------- trigger
  boring-tasks:
    label: Langweilige oder eintönige Aufgaben
    description: >-
      Aufgaben mit wenig Reiz bieten zu wenig Stimulation, um die
      Aufmerksamkeit zu halten.
  poor-sleep:
    label: Schlafmangel
    description: >-
      Viele ADHS-Symptome können sich nach einer schlechten Nacht
      verschlechtern.
  noisy-environment:
    label: Laute Umgebung
    description: >-
      Großraumbüros, Cafés, ein Fernseher im Hintergrund.
  unclear-instructions:
    label: Unklare Anweisungen
    description: >-
      Vage oder nur mündliche Aufgaben bieten nichts, woran man sich
      festhalten kann.
  notifications:
    label: "Benachrichtigungen & Handy"
    description: >-
      Jedes Vibrieren ist eine Einladung, die Aufgabe zu verlassen.
  stress:
    label: "Stress & Überlastung"
    description: >-
      Zu viele Anforderungen auf einmal schrumpfen die ohnehin begrenzte
      exekutive Kapazität.
  long-meetings:
    label: Lange Besprechungen
    description: >-
      Eine Stunde passives Zuhören ohne Beteiligung.
  open-ended-tasks:
    label: Aufgaben ohne klares Ende
    description: >-
      Kein klarer Anfang, kein klares Ende, keine Definition von „fertig“.
  hunger:
    label: "Hunger & ausgelassene Mahlzeiten"
    description: >-
      Vergessen zu essen, dann der Einbruch.
  strong-smells:
    label: Starke Gerüche
    description: >-
      Parfüm, Putzmittel, das Mittagessen der Kollegin, die Duftkerze, die
      jemand anderes liebt.
  crowded-places:
    label: Volle Orte
    description: >-
      Supermärkte, Bahnhöfe, Partys: viele Geräuschquellen, Bewegung und
      Gerüche gleichzeitig.
  harsh-light:
    label: Grelles Licht und Flimmern
    description: >-
      Leuchtstoffröhren, zu helle Bildschirme, flackernde Lampen, tiefe Sonne
      durch die Windschutzscheibe.
  textures:
    label: Stoffe und Etiketten
    description: >-
      Kratzige Stoffe, Kleideretiketten, Nähte in Socken, ein nasser Ärmel.
      Klein, ständig, unmöglich zu ignorieren.
  competing-demands:
    label: Zu viele gleichzeitige Anforderungen
    description: >-
      Mehrere Anfragen, Entscheidungen und unfertige Aufgaben wollen
      gleichzeitig Aufmerksamkeit, und das macht es schwer, die nächste
      Handlung zu wählen und zu halten.
  unexpected-interruptions:
    label: Unerwartete Unterbrechungen
    description: >-
      Eine Frage, ein Anruf oder eine dringende Bitte reißt die Aufgabe
      auseinander, und der Wiederaufbau kostet mehr als die Unterbrechung
      selbst.

  # ---------------------------------------------------------------- strategy
  body-doubling:
    label: Body Doubling
    description: >-
      Neben einer anderen Person arbeiten, im selben Raum oder per Video,
      deren Anwesenheit das Anfangen und Dranbleiben erleichtert.
    aliases: [gemeinsames Arbeiten]
  pomodoro:
    label: Pomodoro-Timer
    description: >-
      In kurzen, getakteten Sprints mit Pausen dazwischen arbeiten. Der Timer
      gibt Struktur vor und vor allem ein Ende.
  visual-timers:
    label: Visuelle Timer
    description: >-
      Timer, die die Zeit als schrumpfende Scheibe oder Balken zeigen, machen
      das Vergehen der Zeit sichtbar.
  external-reminders:
    label: "Wecker & externe Erinnerungen"
    description: >-
      Das Gedächtnis aus dem Kopf holen: Handywecker,
      Kalenderbenachrichtigungen, Haftnotizen genau dort, wo gehandelt werden
      muss.
  task-breakdown:
    label: Aufgaben in winzige Schritte zerlegen
    description: >-
      Aus „den Bericht schreiben“ wird „das Dokument öffnen, eine Überschrift
      schreiben“. Der erste Schritt sollte fast lächerlich klein sein.
  checklists:
    label: Schriftliche Checklisten
    description: >-
      Den Plan zu Papier bringen, damit das Arbeitsgedächtnis ihn nicht halten
      muss.
  home-for-things:
    label: Ein fester Platz für alles
    description: >-
      Feste Plätze für Schlüssel, Geldbeutel und Brille. Eine Schale an der
      Tür schlägt jede gedankliche Notiz.
  exercise:
    label: Regelmäßige Bewegung
    description: >-
      Ausdauerbewegung kann Aufmerksamkeit und Stimmung für einige Stunden
      verbessern und beim Schlafen helfen.
  sleep-routine:
    label: Feste Schlafroutine
    description: >-
      Eine feste Aufstehzeit, ein Abendritual, keine Bildschirme im
      Schlafzimmer.
  mindfulness:
    label: Achtsamkeitsübungen
    description: >-
      Kurze, regelmäßige Übung darin, abschweifende Aufmerksamkeit und
      aufsteigende Gefühle zu bemerken, bevor sie die Kontrolle übernehmen.
  fidget-tools:
    label: Fidget-Spielzeug
    description: >-
      Dem Körper etwas zu tun geben kann Aufmerksamkeit freisetzen, statt sie
      zu verbrauchen.
  noise-control:
    label: "Kopfhörer & weißes Rauschen"
    description: >-
      Kopfhörer mit Geräuschunterdrückung oder ein gleichmäßiges
      Hintergrundgeräusch verringern akustische Ablenkung.
  time-boxing:
    label: Zeitblöcke im Kalender
    description: >-
      Jeder Aufgabe einen Platz im Kalender geben, mit einer realistischen,
      meist längeren Schätzung.
  accountability-partner:
    label: Verbindlichkeitspartner
    description: >-
      Jemandem sagen, was man bis wann erledigt, und anschließend Bericht
      erstatten.
  routines:
    label: "Routinen & Gewohnheiten koppeln"
    description: >-
      Neue Gewohnheiten an bestehende Anker koppeln (nach dem Kaffee die
      Medikamente nehmen), damit weniger Entscheidungen nötig sind.
  prepare-night-before:
    label: Am Abend vorher vorbereiten
    description: >-
      Kleidung, Tasche, Essen und Schlüssel bereitlegen. Der Morgen läuft dann
      auf Autopilot.
  externalise-memory:
    label: Arbeitsgedächtnis auslagern
    description: >-
      Whiteboards, Notiz-Apps, Sprachmemos. Den Gedanken in dem Moment
      festhalten, in dem er auftaucht.
  dopamine-menu:
    label: Dopamin-Menü
    description: >-
      Eine vorbereitete Liste gesunder, belohnender Aktivitäten, zu der man
      greift statt zum endlosen Scrollen.
  gamification:
    label: Aufgaben spielerisch gestalten
    description: >-
      Punkte, Serien, Wettläufe gegen die Uhr. Neuheit und Wettbewerb schaffen
      die Dringlichkeit, die langweiligen Aufgaben fehlt.
  single-tasking:
    label: Eine Sache auf einmal
    description: >-
      Ein Tab, eine Aufgabe, eine Sache auf dem Schreibtisch. Die
      Angriffsfläche für Ablenkung verkleinern.
  done-not-perfect:
    label: Fertig schlägt perfekt
    description: >-
      Die Messlatte bewusst senken. Perfektionismus ist ein häufiger Treiber
      des Aufschiebens.
  pause-before-acting:
    label: Innehalten vor dem Handeln
    description: >-
      Eine eingebaute Verzögerung: 24 Stunden vor einem Kauf, ein langsamer
      Atemzug vor einer Antwort.
  self-compassion:
    label: Selbstmitgefühl
    description: >-
      Ausrutscher als Daten behandeln, nicht als Beweis für Versagen. Scham
      nährt die Vermeidung.
  decision-reduction:
    label: Weniger Entscheidungen
    description: >-
      Weniger Entscheidungen treffen müssen: Standardmahlzeiten, eine kleine
      Garderobe, Standardantworten.
  movement-breaks:
    label: Bewegungspausen
    description: >-
      Jede Stunde ein kurzer Gang, eine Treppe oder Dehnen. Besprechungen im
      Gehen und ein Stehschreibtisch zählen auch.
  write-it-down-instead:
    label: Aufschreiben statt aussprechen
    description: >-
      Während eines Gesprächs den Gedanken auf Papier notieren, damit er nicht
      mehr herausdrängt. Er kann angesprochen werden, sobald das Gegenüber
      fertig ist.
  item-trackers:
    label: Bluetooth-Tracker
    description: >-
      Kleine Anhänger an Schlüssel, Geldbeutel und Tasche, und ein Handy, das
      sie klingeln lassen kann. Macht aus zwanzig Minuten Suchen zwanzig
      Sekunden.
  duplicate-essentials:
    label: Wichtiges doppelt haben
    description: >-
      Ersatzschlüssel beim Nachbarn, ein Ladekabel in jeder Tasche, eine
      Lesebrille in jedem Zimmer. Ein verlorenes Exemplar ist dann keine Krise
      mehr.
  final-review-pass:
    label: Abschließender Kontrollgang
    description: >-
      Eine eigene, bewusste Prüfung, wenn die Arbeit fertig wirkt, am besten
      nach einer Pause und anhand einer kurzen Liste der eigenen typischen
      Fehler.
  written-instructions:
    label: Um schriftliche Anweisungen bitten
    description: >-
      Aufgaben per Nachricht oder E-Mail erbitten, oder das Gehörte selbst
      aufschreiben und zur Bestätigung zurückschicken.
  repeat-back:
    label: Wiederholen und zusammenfassen
    description: >-
      Bevor ein Gespräch endet, wiedergeben, was man verstanden hat und was
      man tun wird. Lücken zeigen sich, solange sie noch billig zu schließen
      sind.
  hyperfocus-exit:
    label: Ausstiegsritual aus dem Hyperfokus
    description: >-
      Ein harter Stopp-Alarm, gestellt vor dem Anfangen, Wasser und Essen in
      Reichweite, und eine notierte Zeile, wo es nächstes Mal weitergeht.
  name-the-emotion:
    label: Das Gefühl benennen
    description: >-
      Das Gefühl in Worte fassen, etwa „das ist Frust, ungefähr sieben von
      zehn“, öffnet eine kleine Lücke zwischen Gefühl und Reaktion.
  cooling-off-rule:
    label: Abkühlregel
    description: >-
      Eine Vereinbarung mit sich selbst und den Menschen im Umfeld: keine
      wichtigen Antworten oder Entscheidungen, solange die Welle hoch ist.
      Nach zwanzig Minuten oder am nächsten Morgen noch einmal ansehen.
  ask-instead-of-assume:
    label: Nachfragen statt annehmen
    description: >-
      Wenn eine Nachricht wie Ablehnung klingt, vor der Reaktion nachfragen:
      „Meintest du ...?“ Die meisten gefühlten Kränkungen lösen sich beim
      Kontakt mit den Fakten auf.
  distress-tolerance:
    label: Fertigkeiten zur Stresstoleranz
    description: >-
      Fertigkeiten aus der dialektisch-behavioralen Therapie, um den Körper
      schnell herunterzufahren: kaltes Wasser ins Gesicht, ruhiges Atmen im
      Takt, ein kurzer intensiver Bewegungsschub.
  automatic-payments:
    label: Automatische Zahlungen
    description: >-
      Lastschrift für jede wiederkehrende Rechnung, Sparen direkt am Zahltag,
      eine Karte für alle Abos. Das System erinnert sich, damit du es nicht
      musst.
  subscription-audit:
    label: Abo-Check
    description: >-
      Alle paar Monate eine Erinnerung, jedes Abo aufzulisten und zu kündigen,
      was nicht mehr genutzt wird.
  explain-your-adhd:
    label: "Erklären, wie sich dein ADHS zeigt"
    description: >-
      Partnern, Freunden und Kollegen vorab sagen, womit sie rechnen können,
      etwa späte Antworten, Unterbrechungen oder ein verlorener Faden, und was
      hilft.
  repair-routine:
    label: Reparaturroutine
    description: >-
      Eine vereinbarte Art, einen Ausrutscher anzuerkennen, sich zu
      entschuldigen und neu zu starten, damit sich vergessene Versprechen auf
      keiner Seite zu Groll aufstauen.
  shared-calendar:
    label: Gemeinsamer Kalender
    description: >-
      Ein Kalender, den Partner oder Haushalt sehen, für Termine,
      Schulveranstaltungen und gegebene Versprechen. Nichts lebt nur in einem
      Kopf.
  buffer-time:
    label: Zeitpuffer
    description: >-
      Fünfzehn Minuten früher ankommen und einen Tag vor der echten Frist
      fertig sein wollen. Der Puffer fängt die Zeitblindheit ab.
  deadline-check-ins:
    label: Zwischenstände vor der Frist
    description: >-
      Zwischenziele, vereinbart mit dem, der auf die Arbeit wartet. Jedes ist
      eine kleine Frist mit echter Dringlichkeit.
  recovery-time:
    label: Eingeplante Erholungszeit
    description: >-
      Bewusst unverplante Zeit nach anstrengenden Tagen, im Kalender geschützt
      wie der Schlaf. Den ganzen Tag ADHS auszugleichen hat einen Preis, der
      zurückgezahlt werden muss.
  reduce-masking:
    label: Weniger maskieren
    description: >-
      Ein paar Orte und Menschen wählen, bei denen du aufhörst, neurotypisch
      zu spielen: zappeln, mitschreiben, um Wiederholung bitten, gehen, wenn
      du musst.
  play-to-strengths:
    label: Auf Stärken setzen
    description: >-
      Die Arbeit hin zu den interessengetriebenen, kreativen, krisenfesten
      Aufgaben lenken, in denen ADHS-Gehirne glänzen, und den Rest
      wegverhandeln oder automatisieren.
  interest-pairing:
    label: Langweiliges mit Angenehmem koppeln
    description: >-
      Der Lieblingspodcast nur beim Hausputz, Papierkram nur im guten Café.
      Die angenehme Hälfte kann einen Teil des Reizes liefern, der der Aufgabe
      fehlt.
  behavioural-activation:
    label: Verhaltensaktivierung
    description: >-
      Jeden Tag eine kleine angenehme oder sinnvolle Aktivität einplanen und
      tun, egal ob man Lust hat. Die Stimmung folgt dem Handeln mehr als das
      Handeln der Stimmung.
  morning-daylight:
    label: Morgenlicht
    description: >-
      Zehn Minuten Tageslicht draußen kurz nach dem Aufwachen verankern die
      innere Uhr und heben die Stimmung.
  social-contact:
    label: Sozialer Kontakt
    description: >-
      Ein kurzer Anruf oder ein Spaziergang mit jemandem, besonders an den
      Tagen, an denen man am wenigsten Lust hat. Isolation nährt die gedrückte
      Stimmung.
  worry-window:
    label: Sorgenfenster
    description: >-
      Fünfzehn Minuten am Tag, um jede Sorge aufzuschreiben. Außerhalb des
      Fensters bekommt die Sorge eine Notiz und einen Termin statt deiner
      Aufmerksamkeit.
  less-alcohol:
    label: Weniger Alkohol
    description: >-
      Alkohol kann Schlaf, Impulsivität und Stimmung noch tagelang
      verschlechtern. Weniger zu trinken ist eine der günstigsten
      Verbesserungen überhaupt.
  nightly-reset:
    label: Zehn-Minuten-Reset am Abend
    description: >-
      Ein Timer, eine Runde durch die Wohnung, alles zurück an seinen Platz.
      Kein Putzen, nur Zurücksetzen. Klein genug für jeden Abend.
  one-surface:
    label: Eine Fläche pro Runde
    description: >-
      Eine Arbeitsplatte, eine Schublade, eine Ecke, dann Schluss. Nie ein
      Marathon durchs ganze Zimmer: der Marathon fängt nie an.
  doom-box:
    label: Die Kiste für später
    description: >-
      Eine Kiste für den Stapel Dinge, die eine Entscheidung brauchen. Die
      Fläche ist jetzt frei, die Entscheidungen warten auf einen ruhigeren
      Moment.
    aliases: [Kramkiste]
  own-less:
    label: Weniger besitzen
    description: >-
      Weniger Dinge heißt weniger Plätze zu merken und weniger Entscheidungen
      pro Aufräumrunde. Eins rein, eins raus.
  visible-storage:
    label: Sichtbar aufbewahren
    description: >-
      Offene Regale, durchsichtige Boxen, Haken statt Schubladen. Wenn
      geschlossene Türen Dinge löschen, dann lass sie offen.
  sort-by-frequency:
    label: "Nach Häufigkeit ordnen, nicht nach Kategorie"
    description: >-
      Was täglich gebraucht wird, liegt in Reichweite des Ortes, an dem es
      gebraucht wird. Alles andere darf weiter weg und weniger geordnet sein.
  launch-pad:
    label: Startplatz an der Tür
    description: >-
      Ein Platz für Schlüssel, Tasche, Geldbeutel und alles, was morgen das
      Haus verlassen muss. Losgehen wird zu einer einzigen Bewegung.
  define-done:
    label: Fertig definieren
    description: >-
      Vor dem Anfangen einen Satz schreiben, wie fertig aussieht. Eine Aufgabe
      ohne Ende ist eine Aufgabe, die nie beginnt.
  five-minute-rule:
    label: Fünf-Minuten-Regel
    description: >-
      Nur fünf Minuten der gefürchteten Sache tun. Nach fünf Minuten aufhören
      ist erlaubt. Meistens tut man es nicht.
  thought-record:
    label: Gedankenprotokoll
    description: >-
      Situation, automatischer Gedanke, Gefühl und seine Stärke, Belege dafür
      und dagegen, und ein ausgewogenerer Gedanke. Das klassische KVT-
      Arbeitsblatt.
  decatastrophising:
    label: Entkatastrophisieren
    description: >-
      Drei Fragen: Was ist das Schlimmste, das passieren könnte, wie
      wahrscheinlich ist es wirklich, und wie würde ich damit umgehen?
  behavioural-experiments:
    label: "Prüfen, wovor du dich fürchtest"
    description: >-
      In der KVT Verhaltensexperiment genannt. Schreibe genau auf, was deiner
      Erwartung nach schiefgeht und wie sicher du dir bist, auf einer Skala
      bis zehn. Dann mach die Sache einmal, ohne die üblichen
      Vorsichtsmaßnahmen. Danach schreibe auf, was tatsächlich passiert ist.
      Der Abstand zwischen Vorhersage und Ergebnis ändert die Überzeugung. Der
      Hinweis, sich keine Sorgen zu machen, ändert sie nicht.
  graded-exposure:
    label: Abgestufte Konfrontation
    description: >-
      Gefürchtete Situationen von leicht bis schwer ordnen und die Leiter
      hinaufarbeiten, in jeder Stufe bleiben, bis die Angst von selbst sinkt.
      Vermeidung macht die Welt kleiner, Konfrontation wieder größer.
  structured-problem-solving:
    label: Strukturiertes Problemlösen
    description: >-
      Das Problem in einem Satz beschreiben, alle Optionen ohne Bewertung
      auflisten, eine wählen, den ersten Schritt planen, danach auswerten.
      Macht aus Grübeln eine Entscheidung.
  mood-diary:
    label: Stimmungs- und Aktivitätstagebuch
    description: >-
      Eine Woche lang Stunde für Stunde notieren, was du getan und wie du dich
      gefühlt hast. Das Muster zeigt, welche Aktivitäten die Stimmung heben
      und welche sie drücken.
  relaxation-breathing:
    label: Ruhige Atmung und Muskelentspannung
    description: >-
      Langsames Atmen mit betonter Ausatmung, oder Muskelgruppen nacheinander
      anspannen und lösen. Bringt dem Körper den Ausschalter bei.
  relapse-plan:
    label: Rückfallplan
    description: >-
      Eine geschriebene Seite: frühe Warnzeichen, was letztes Mal geholfen
      hat, wen anrufen. Geschrieben, wenn es gut geht, gelesen, wenn nicht.
  psychoeducation:
    label: "Verstehen, wie Angst funktioniert"
    description: >-
      Zu verstehen, wie die Kampf-oder-Flucht-Reaktion abläuft, warum
      Vermeidung die Angst nährt und warum Angst immer ansteigt und wieder
      abfällt, nimmt ihr viel von ihrer Macht.
  earplugs:
    label: Ohrstöpsel für den Alltag
    description: >-
      Gefilterte Ohrstöpsel, die die Spitzen nehmen, ohne Sprache zu
      schlucken, am Schlüsselbund, damit sie immer dabei sind.
  control-the-environment:
    label: Die Umgebung steuern
    description: >-
      Sitzplatz, Raum und Tageszeit wählen. Unparfümierte Produkte zu Hause,
      dimmbares Licht, eine ruhige Ecke bei der Arbeit. Von vornherein weniger
      Reize.
  comfortable-clothes:
    label: "Kleidung, die sich richtig anfühlt"
    description: >-
      Etiketten herausschneiden, dieselben weichen Stoffe nachkaufen, bei
      Socken nie Kompromisse. Komfort ist keine Empfindlichkeit, wenn die
      Alternative Ablenkung den ganzen Tag ist.
  quiet-after-loud:
    label: Ruhe nach lauten Tagen
    description: >-
      Eingeplante Stille nach einem lauten Tag: keine Musik, keine Anrufe,
      gedämpftes Licht. Erholung ist Teil des Plans, kein Luxus.
  leave-early:
    label: Erlaubnis zu gehen
    description: >-
      Vorher mit sich selbst und der Begleitung vereinbaren, dass frühes Gehen
      aus einem lauten Ort in Ordnung ist. Zu wissen, dass es einen Ausgang
      gibt, senkt die Last von Anfang an.
  planning-time-to-plan:
    label: Zeit zum Planen einplanen
    description: >-
      Trage das Planen selbst als kurzen täglichen Termin ein. Ohne ihn
      beginnt der Tag im Reagieren, und das Planen ist der Schritt, der zuerst
      ausfällt.
  master-list:
    label: Eine Gesamtliste für alles
    description: >-
      Eine einzige Liste mit allen Verpflichtungen, großen wie kleinen, an
      einem Ort. Es ist nicht die Liste, mit der du arbeitest, sondern die,
      die du nicht mehr im Kopf tragen musst.
  daily-shortlist:
    label: Eine kurze Liste für heute
    description: >-
      Übertrage jeden Tag wenige Punkte aus der Gesamtliste. Eine kurze Liste
      lässt sich abschließen, und nur eine abgeschlossene Liste schafft
      Vertrauen in das System.
  underschedule:
    label: Bewusst zu wenig einplanen
    description: >-
      Plane weniger Aufgaben ein, als du für machbar hältst, und lass mehr
      Luft dazwischen als nötig scheint. Zeit einzuschätzen ist die
      Schwachstelle, also muss der Plan den Fehler auffangen.
  if-then-plans:
    label: Wenn-dann-Pläne
    description: >-
      Entscheide vorab, was du bei einer bestimmten Störung tust: Wenn eine
      Nachricht kommt, dann wartet sie bis zum Ende dieses Blocks. Die
      Entscheidung fällt einmal, in Ruhe, statt jedes Mal neu.
  smallest-step:
    label: Den kleinsten ersten Handgriff benennen
    description: >-
      Nicht die Aufgabe, nicht einmal den ersten Schritt, sondern die kleinste
      körperliche Handlung, die dich in Position bringt: die Datei offen auf
      dem Bildschirm, die Schuhe an der Tür.
  escape-behaviours:
    label: Kenne deine Fluchtwege
    description: >-
      Jeder hat eine kurze Liste von Dingen, die er stattdessen zuverlässig
      tut: das Postfach, der Kühlschrank, eine schnelle Besorgung. Sie zu
      benennen macht aus dem Impuls ein Signal, dass du gerade ausweichst.
  anticipation-ratio:
    label: Die Erwartung ausbalancieren
    description: >-
      Vor einer gefürchteten Aufgabe zählen die meisten nur das Unangenehme.
      Nimm dazu, was auf der anderen Seite stimmt: Sie ist zeitlich begrenzt,
      sie darf schlecht erledigt werden, und fertig zu sein fühlt sich besser
      an, als sie weiter zu tragen.
  accept-discomfort:
    label: "Anfangen, ohne sich bereit zu fühlen"
    description: >-
      Das Unbehagen verschwindet meist nicht vor dem Anfang, sondern kurz
      danach. Auf die richtige Stimmung zu warten macht aus einer Aufgabe eine
      Woche.
  behavioural-scripts:
    label: Die eigenen Abläufe auseinandernehmen
    description: >-
      Manche Abläufe laufen von allein: nach Hause kommen, Couch, Handy, Abend
      vorbei. Den Ablauf aufzuschreiben zeigt, wo der Entscheidungspunkt
      wirklich liegt.
  reframe-time:
    label: Eine echte Zahl auf die Zeit setzen
    description: >-
      Frage, wie lange die Aufgabe wirklich dauert, nicht wie lange sie sich
      anfühlt. Die meisten Punkte einer Tagesliste brauchen unter einer
      Stunde, und die Aufgabe ohne Ende ist die, die nie beginnt.
  manage-energy:
    label: Die besten Stunden bewusst einsetzen
    description: >-
      Aufmerksamkeit ist über den Tag nicht gleich verfügbar. Lege die
      anspruchsvolle Arbeit in die Stunden, in denen du sie hast, und das
      Mechanische in die übrigen.
  earned-rewards:
    label: Fluchten zu verdienten Belohnungen machen
    description: >-
      Das, wohin du flüchtest, lässt sich hinter die Aufgabe verschieben.
      Dieselbe halbe Stunde online ist davor und danach etwas völlig anderes.
  defense-attorney:
    label: Die Gegenseite vertreten
    description: >-
      Ein harter Gedanke überzeugt, weil nur eine Seite gehört wurde. Führe
      bewusst die Gegenrede, wie ein Verteidiger, bevor du das Urteil
      annimmst.
  method-acting:
    label: "Handle wie jemand, der es tut"
    description: >-
      Verhalte dich wie jemand, der bereits einen Kalender führt oder diese
      E-Mail schreibt, bevor es sich natürlich anfühlt. Die Wiederholung macht
      es natürlich, nicht umgekehrt.
  values-commitment:
    label: Die Aufgabe mit deinen Werten verbinden
    description: >-
      Eine öde Aufgabe, die etwas dient, das dir wichtig ist, lässt sich
      leichter beginnen als eine, die nur als notwendig verteidigt wird.
      Benenne, wozu sie dient.
  problem-template:
    label: Eine geschriebene Vorlage für Probleme
    description: >-
      Das Problem in einem Satz, Optionen ohne Bewertung auflisten, wählen,
      den ersten Schritt planen, danach auswerten. Die Vorlage übernimmt das
      Denken, das der Moment nicht leisten kann.
  face-uncertainty:
    label: "Entscheiden, bevor die Sache sich selbst entscheidet"
    description: >-
      Eine Entscheidung auszusitzen ist auch eine Entscheidung, meist die
      schlechteste, weil die Möglichkeiten still verfallen. Unter Unsicherheit
      zu handeln schlägt zu spät zu handeln.
  planned-distraction:
    label: Die Ablenkung einplanen
    description: >-
      Gib Spielen, Feeds und Bildschirmen einen echten Platz im Tag, statt sie
      die Lücken nehmen zu lassen. Geplante freie Zeit konkurriert nicht mehr
      mit allem anderen.
  coping-drift:
    label: "Damit rechnen, dass das System abrutscht"
    description: >-
      Jedes System rutscht nach einigen guten Wochen ab. Behandle das als
      normal und plane den Neustart vorab, statt es als Beweis zu lesen, dass
      du nichts durchhalten kannst.

  # ---------------------------------------------------------------- treatment
  assessment:
    label: "Diagnose & Abklärung"
    description: >-
      Eine formale Abklärung durch eine qualifizierte Fachperson ist der
      Zugang zu Behandlung und Anpassungen.
    aliases: [Diagnose, Abklärung]
    facts:
      - text: >-
          Etwa die Hälfte der US-Erwachsenen mit einer aktuellen ADHS-Diagnose
          erhielt diese erst mit 18 Jahren oder später.
        source: cdc-adult-adhd
  medication:
    label: Medikamente
    description: >-
      Stimulanzien und Nicht-Stimulanzien, ärztlich verordnet und begleitet.
      Für viele Erwachsene eine Behandlung erster Wahl.
    aliases: [Stimulanzien, Methylphenidat]
    facts:
      - text: >-
          Etwa ein Drittel der US-Erwachsenen mit ADHS nahm im Vorjahr ein
          Stimulans ein. Von ihnen hatten 71,5% Schwierigkeiten, ein Rezept
          einzulösen, weil das Medikament nicht verfügbar war.
        source: cdc-adult-adhd
  cbt:
    label: KVT bei ADHS
    description: >-
      Kognitive Verhaltenstherapie, angepasst an ADHS: Fertigkeiten für
      Planung, Aufschieben und ungünstige Denkmuster.
    aliases: [KVT, kognitive Verhaltenstherapie]
  coaching:
    label: ADHS-Coaching
    description: >-
      Praktische, zielorientierte Unterstützung beim Aufbau von Systemen und
      Routinen, die zur Person passen.
  workplace-accommodations:
    label: Anpassungen am Arbeitsplatz
    description: >-
      Flexible Arbeitszeiten, schriftliche Anweisungen, ein ruhiger
      Arbeitsplatz, Zwischenchecks bei Fristen.
  psychotherapy:
    label: Psychotherapie
    description: >-
      Gesprächstherapie bei einer qualifizierten Fachperson für Angst,
      gedrückte Stimmung und Selbstbild, die oft rund um ADHS entstehen.
  crisis-help:
    label: "Wenn es dunkel wird: jetzt Hilfe holen"
    description: >-
      Wenn die Gedanken dahin gehen, nicht mehr da sein zu wollen, heute noch
      Arztpraxis, Krisentelefon oder Notruf kontaktieren. Das ist eine
      medizinische Situation, kein Charakterfehler.
  professional-organiser:
    label: Professionelle Ordnungshilfe oder Reinigungskraft
    description: >-
      Bezahlte Hilfe, um eine Wohnung einzurichten, die sich selbst trägt,
      oder um sie am Laufen zu halten. Eine Anpassung, kein Versagen.

  # ---------------------------------------------------------------- impact
  missed-deadlines:
    label: Verpasste Fristen
    description: >-
      Arbeit wird zu spät oder gar nicht abgeliefert, trotz guter Absichten
      und echter Anstrengung.
  relationship-strain:
    label: Belastete Beziehungen
    description: >-
      Vergessene Versprechen, Unterbrechungen und Gefühlsausbrüche zehren an
      Partnerschaft, Freundschaften und Kollegen.
  low-self-esteem:
    label: Geringes Selbstwertgefühl
    description: >-
      Jahre von „streng dich einfach mehr an“ hinterlassen das Gefühl, faul
      oder kaputt zu sein.
  burnout:
    label: Burnout
    description: >-
      Symptome zu verbergen und ständig auszugleichen ist erschöpfend.
  financial-trouble:
    label: Finanzielle Probleme
    description: >-
      Mahngebühren, vergessene Abos, Spontankäufe.
  inconsistent-performance:
    label: Unbeständige Leistung in Beruf oder Ausbildung
    description: >-
      Ergebnisse, die zwischen ausgezeichnet und verspätet oder ausbleibend
      schwanken, oft bei derselben Art von Aufgabe. Der Abstand liegt zwischen
      dem, was an einem guten Tag möglich ist, und dem, was an einem
      durchschnittlichen Tag passiert, nicht zwischen Anstrengung und
      Fähigkeit.
    aliases: [Minderleistung]
  energy-drain:
    label: Energieverlust
    description: >-
      Die Erschöpfung nach Stunden voller Sorgen, Maskieren und Ausgleichen,
      ohne etwas vorweisen zu können.
  sensory-overload:
    label: Reizüberflutung
    description: >-
      Zu viel Input auf einmal: Gereiztheit, Abschalten, der Drang, den Raum
      zu verlassen. Zehrt noch Stunden danach an der Energie.
  driving-risk:
    label: Autofahren und Unfallrisiko
    description: >-
      Auf Bevölkerungsebene ist ADHS mit einem höheren Unfallrisiko verbunden.
      Ablenkbarkeit, Impulsivität und Schlafmangel wiegen am Steuer oder an
      Maschinen schwerer. Das ist ein Gruppenbefund und sagt nichts über eine
      einzelne fahrende Person.
    facts:
      - text: >-
          In einer schwedischen Bevölkerungsstudie gingen Zeiträume mit
          Medikation bei Männern mit ADHS mit einer um 58% niedrigeren Rate
          schwerer Verkehrsunfälle einher. Die Autoren schätzten, dass 41% bis
          49% dieser Unfälle mit Behandlung vermeidbar gewesen wären.
        source: chang-2014

  # ---------------------------------------------------------------- condition
  anxiety:
    label: Angst
    description: >-
      Angststörungen treten zusammen mit ADHS häufiger auf als in der
      Allgemeinbevölkerung. Sorgen, körperliche Anspannung und Vermeidung
      können wie ADHS-Symptome aussehen und durch sie verstärkt werden. Angst
      braucht eine eigene Abklärung und Behandlung.
    facts:
      - text: >-
          Etwa 5,8% der Weltbevölkerung, rund 470 Millionen Menschen, hatten
          2023 eine Angststörung.
        source: who-anxiety
      - text: >-
          Nur etwa eine von vier Personen, die eine Behandlung wegen einer
          Angststörung benötigt, erhält überhaupt eine: 27,6%.
        source: who-anxiety
      - text: >-
          Mädchen und Frauen erleben häufiger eine Angststörung als Jungen und
          Männer.
        source: who-anxiety
      - text: >-
          Über Studien zusammengefasst hatten Erwachsene mit ADHS etwa das
          Fünffache der Chance auf eine Angststörung im Vergleich zu
          Erwachsenen ohne ADHS.
        source: hartman-2023
  depression:
    label: Depression
    description: >-
      Depressionen treten zusammen mit ADHS häufiger auf als in der
      Allgemeinbevölkerung. Gedrückte Stimmung, Interessenverlust und
      Erschöpfung sind nicht einfach die Folge einer anstrengenden Woche. Eine
      Depression braucht eine eigene Abklärung und Behandlung. Wenn deine
      Gedanken dahin gehen, nicht mehr da sein zu wollen, hole dir heute
      Hilfe.
    facts:
      - text: >-
          Etwa 5,2% der Erwachsenen weltweit hatten 2023 eine depressive
          Störung: 4,1% der Männer und 6,2% der Frauen.
        source: who-depression
      - text: >-
          Das sind rund 322 Millionen Menschen.
        source: who-depression
      - text: >-
          Depressionen sind bei Frauen etwa 1,5-mal häufiger als bei Männern.
        source: who-depression
      - text: >-
          Über Studien zusammengefasst hatten Erwachsene mit ADHS etwa das
          Viereinhalbfache der Chance auf eine Depression im Vergleich zu
          Erwachsenen ohne ADHS.
        source: hartman-2023
  substance-use:
    label: Probleme mit Substanzkonsum
    description: >-
      Suchterkrankungen treten zusammen mit ADHS häufiger auf. Substanzen
      werden manchmal gegen Unruhe, Schlafprobleme, Stimmung oder Anspannung
      eingesetzt, verschlechtern aber die Funktionsfähigkeit und brauchen eine
      eigene Abklärung und Behandlung.
    facts:
      - text: >-
          Über Studien zusammengefasst hatten Erwachsene mit ADHS etwa das
          Viereinhalbfache der Chance auf eine Suchterkrankung im Vergleich zu
          Erwachsenen ohne ADHS.
        source: hartman-2023

  # ---------------------------------------------------------------- situation
  chaotic-home:
    label: Chaos in der Wohnung
    description: >-
      Stapel auf jeder Fläche, eine Küche, die sich nie von selbst
      zurücksetzt, das Gefühl, dass die Wohnung gewinnt. Hier stapeln sich
      mehrere Symptome, deshalb reicht Willenskraft allein nicht.
  dreaded-task:
    label: "Eine Aufgabe, vor der ich mich fürchte"
    description: >-
      Die E-Mail, das Formular, der Anruf. Sie liegt da, wird jeden Tag größer
      und startet eine Schleife, die mehr Energie kostet, als sie zu
      erledigen.
  money-admin:
    label: Geldkram
    description: >-
      Rechnungen, Abos, Steuern, das Konto, das du seit Monaten nicht geöffnet
      hast. Vergesslichkeit, Vermeidung und Impulsivität treffen sich hier.
  loud-evening-out:
    label: Ein lautes Restaurant oder eine Party
    description: >-
      Alle reden gleichzeitig, die Musik ist laut, neben dir kaut jemand. Dem
      Gespräch zu folgen kostet mehr, als es gibt.
  getting-out-the-door:
    label: Pünktlich aus der Tür kommen
    description: >-
      Die letzten zwanzig Minuten vor dem Losgehen, in denen sich mehrere
      kleine Probleme gleichzeitig stapeln: die Schlüssel, die Zeit, das Ding,
      das du mitnehmen wolltest.
  meetings-and-lectures:
    label: "Eine Besprechung, ein Kurs oder eine Vorlesung"
    description: >-
      Eine Stunde Stillsitzen und Zuhören, ohne Möglichkeit sich zu bewegen
      und mit wenig für die Hände, während der Faden der Diskussion immer
      wieder wegrutscht.
  messages-and-inbox:
    label: Nachrichten und ein überquellendes Postfach
    description: >-
      Unbeantwortete Nachrichten stapeln sich. Jede braucht eine Entscheidung,
      manche fühlen sich riskant an, und aus den Augen wird schnell aus dem
      Sinn.
  bedtime-and-waking:
    label: Ins Bett gehen und aufstehen
    description: >-
      Der Abend dehnt sich, das Interessante ist schwer wegzulegen, und der
      Morgen kommt, bevor die Nacht sich fertig angefühlt hat.
  health-admin:
    label: "Termine, Rezepte und Gesundheitskram"
    description: >-
      Buchen, umbuchen, Formulare, Folgerezepte und Rückrufe. Der Papierkram
      rund um die Gesundheit braucht genau die Fähigkeiten, die ADHS teuer
      macht.

  # ---------------------------------------------------------------- mechanism
  dopamine-boost:
    label: Dopamin und Noradrenalin steigen
    description: >-
      Ein möglicher Wirkweg. Ausdauerbewegung kann für einige Stunden
      dieselben Botenstoffe erhöhen, an denen ADHS-Medikamente ansetzen. Das
      ist ein Teil der Erklärung, nicht die ganze.
  deeper-sleep:
    label: Tieferer Schlaf
    description: >-
      Körperliche Müdigkeit kann das Einschlafen erleichtern und den Schlaf
      vertiefen, was am nächsten Tag fast alles verbessert.
  stress-hormones-drop:
    label: Stresshormone sinken
    description: >-
      Bewegung kann die Stressreaktion abbauen, sodass der Körper dem Kopf
      keine Gefahr mehr meldet.
  energy-discharged:
    label: Unruhe abgebaut
    description: >-
      Der innere Motor bekommt ein Ventil, und Stillsitzen kostet danach
      womöglich weniger.
  mood-lift:
    label: Stimmungshoch
    description: >-
      Ein oft nur vorübergehender Stimmungsschub, der sich summiert, wenn er
      an den meisten Tagen passiert.

edges:
  substance-use-adhd:
    note: >-
      Ein über Bevölkerungen gefundener Zusammenhang. Ein Grund zur Abklärung,
      keine Erwartung an eine einzelne Person.
  adhd-anxiety:
    note: >-
      Häufiger zusammen mit ADHS als in der Allgemeinbevölkerung. Angst kann
      auch wie Unaufmerksamkeit aussehen, weshalb eine Abklärung beides
      abwägt.
  adhd-depression:
    note: >-
      Häufiger zusammen mit ADHS als in der Allgemeinbevölkerung. Jahre voller
      Schwierigkeiten sind ein Risikofaktor, aber eine Depression ist eine
      eigene Erkrankung und braucht eine eigene Behandlung.
  hyperfocus-time-blindness:
    note: >-
      Im Hyperfokus verschwinden Stunden.
  sleep-problems-time-blindness:
    note: >-
      Die Schlafenszeit rutscht immer weiter, weil sich der Abend kürzer
      anfühlt, als er ist.
  avoidance-dreaded-task:
    note: >-
      Nichts wurde getan, die Frist ist näher, und die Aufgabe sieht größer
      aus als vorher.
  safety-behaviours-anticipatory-anxiety:
    note: >-
      Die Erleichterung, die sie bringen, lehrt das Gehirn, dass die Situation
      wirklich gefährlich war.
  sensory-sensitivity-sensory-overload:
    note: >-
      Jedes Geräusch, jeder Geruch kostet ein wenig Aufmerksamkeit. Am Abend
      ist das Budget aufgebraucht.
  mind-wandering-rumination:
    note: >-
      Beides zieht die Aufmerksamkeit nach innen, aber das Wandern springt
      zwischen Themen, während das Grübeln um eines kreist.
  driving-risk-distractibility:
    note: >-
      Ein Zusammenhang auf Bevölkerungsebene, keine Aussage über eine einzelne
      fahrende Person.
  body-doubling-task-initiation:
    note: >-
      Die Anwesenheit einer anderen Person liefert das Startsignal, das das
      Gehirn allein nicht erzeugt.
  pomodoro-task-initiation:
    note: >-
      Sich nur auf 25 Minuten festzulegen senkt die Hürde zum Anfangen.
  pomodoro-hyperfocus:
    note: >-
      Der Pausenalarm ist ein äußerer Unterbrecher für eine Sitzung, die sonst
      stundenlang liefe.
  fidget-tools-fidgeting:
    note: >-
      Lenkt die Bewegung in Bahnen, statt sie zu unterdrücken.
  routines-task-switching:
    note: >-
      Ein festes Übergangsritual macht den Wechsel vorhersehbar.
  pause-before-acting-rejection-sensitivity:
    note: >-
      Vor der Antwort auf eine gefühlte Kränkung zu warten gibt der ersten
      Gefühlswelle Zeit, vorbeizuziehen.
  write-it-down-instead-interrupting:
    note: >-
      Der Drang zu unterbrechen ist oft die Angst, den Gedanken zu verlieren.
      Auf Papier kann er warten.
  explain-your-adhd-relationship-strain:
    note: >-
      Späte Antworten und verlorene Fäden sind leichter zu verzeihen, wenn sie
      vorher angekündigt waren.
  buffer-time-missed-deadlines:
    note: >-
      Den Puffer als die echte Frist behandeln. Die wirkliche ist nur das
      Sicherheitsnetz.
  reduce-masking-burnout:
    note: >-
      Maskieren kostet mehr Energie, als die Menschen um dich herum sehen
      können.
  five-minute-rule-avoidance:
    note: >-
      Fünf Minuten sind klein genug zum Anfangen, und Anfangen ist das ganze
      Problem.
  exercise-dopamine-boost:
    note: >-
      Manche merken danach ein oder zwei Stunden lang ein leichteres
      Fokussieren. Bewegung ist eine Ergänzung zur Behandlung, kein Ersatz
      dafür.
  thought-record-rumination:
    note: >-
      Grübeln dreht sich im Kreis; ein Gedankenprotokoll geht vorwärts, weil
      es mit einem ausgewogenen Gedanken endet.
  graded-exposure-avoidance:
    note: >-
      Jede Stufe muss klein genug sein, um sie wirklich zu gehen, und wird
      wiederholt, bis sie langweilig wird.
  explain-your-adhd-sensory-sensitivity:
    note: >-
      Wer neben dir kaut, hört nicht, was du hörst. Es vorher zu sagen, macht
      aus einem Streit einen Sitzplan.
  smallest-step-task-initiation:
    note: >-
      So klein, dass es absurd wäre, sich zu weigern. Das Anfangen ist der
      teure Teil.
  escape-behaviours-procrastination:
    note: >-
      Eine Gewohnheit, die du nicht bemerkt hast, kannst du nicht
      unterbrechen.
  anticipation-ratio-procrastination:
    note: >-
      Meist wird die Vorhersage vermieden, nicht die Aufgabe.
  behavioural-scripts-procrastination:
    note: >-
      Der Ablauf läuft, bevor eine Entscheidung fällt, also muss die
      Entscheidung früher liegen.
  earned-rewards-procrastination:
    note: >-
      Dieselbe Tätigkeit wird zur Belohnung statt zur Flucht, allein durch das
      Verschieben.
  defense-attorney-catastrophising:
    note: >-
      Frage, welche Beweise für eine Verurteilung nötig wären, und prüfe, ob
      du sie hast.
  method-acting-task-initiation:
    note: >-
      Die Rolle zu spielen kommt zuerst; sich danach zu fühlen folgt, manchmal
      viel später.
  face-uncertainty-decision-paralysis:
    note: >-
      Eine nicht getroffene Entscheidung verfällt von selbst, und die
      verfallene ist selten die gewünschte.
  coping-drift-inconsistent-performance:
    note: >-
      Ist die Rückkehr vorab geplant, kostet der Ausrutscher Tage statt
      Monate.
  medication-dopamine-boost:
    note: >-
      Dieser Wirkweg beschreibt Stimulanzien. Nicht-stimulierende Medikamente
      wirken anders.
  assessment-sensory-sensitivity:
    note: >-
      Starke, lebenslange Empfindlichkeit gehört in die Abklärung. Sie
      überschneidet sich mit Autismus, und das ändert, welche Anpassungen
      helfen.
  anxiety-depression-overlap:
    note: >-
      Beide treten häufig gemeinsam auf, und jede kann es erschweren, die
      andere zu erkennen und zu behandeln.
