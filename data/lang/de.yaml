  title: ADHS-Landkarte
  language: Sprache
  find_node: Knoten suchen
  fit: Einpassen
  expand_all: Alles aufklappen
  reset: Zurücksetzen
  switch_to_cytoscape: Zu Cytoscape.js wechseln
  switch_to_force_graph: Zu force-graph wechseln
