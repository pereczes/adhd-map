  prototype_force_graph: "Prototyp B: force-graph"
  intro: "Klicke auf einen Knoten, um ihn zu öffnen: Seine Details erscheinen hier, und seine Nachbarn entfalten sich auf der Karte. Ein erneuter Klick auf einen geöffneten Knoten klappt zusammen, was er aufgedeckt hat."
  intro_hint: Ziehen zum Verschieben, Scrollen zum Zoomen, oder über das Suchfeld direkt zu einem Knoten springen.
  counts: "{nodes} Knoten, {links} Verbindungen."
