nodes:
  # ---------------------------------------------------------------- hub
  adhd:
    label: ADHD
    description: >-
      Tulburarea de deficit de atenție și hiperactivitate este o condiție de
      neurodezvoltare care afectează reglarea atenției, nivelul de activitate,
      controlul impulsurilor și funcțiile executive. Apasă pe un grup pentru
      a-i explora simptomele, apoi urmărește legăturile către factorii
      declanșatori, strategii și consecințe. Această hartă are scop educativ,
      nu diagnostic. Conține simptome diagnostice, experiențe asociate
      frecvent, probleme care apar împreună cu ADHD și strategii practice.
      Niciun nod nu stabilește singur un diagnostic. Diagnosticul cântărește
      debutul în copilărie, persistența, dificultățile în mai multe contexte
      și alte explicații posibile.
    facts:
      - text: >-
          Însumând 175 de studii din întreaga lume, aproximativ 7% dintre
          copii și adolescenți îndeplinesc criteriile pentru ADHD.
        source: thomas-2015
      - text: >-
          Într-un studiu american realizat între 2001 și 2003, 4,4% dintre
          adulții între 18 și 44 de ani îndeplineau criteriile pentru ADHD
          curent.
        source: kessler-2006
      - text: >-
          Într-un studiu american pe adolescenți realizat între 2001 și 2004,
          13% dintre băieți și 4,2% dintre fete au avut ADHD la un moment dat
          în viață.
        source: nimh-adhd-stats
      - text: >-
          În studiul pe adulți din aceeași perioadă, ADHD curent a fost găsit
          la 5,4% dintre bărbați și 3,2% dintre femei. Cifrele pe durata
          vieții și cele curente provin din studii diferite și din măsuri
          diferite, deci nu pot fi comparate direct.
        source: nimh-adhd-stats
      - text: >-
          În 2023, în Statele Unite, un număr estimat de 15,5 milioane de
          adulți, aproximativ 6%, au raportat un diagnostic curent de ADHD.
          Aproape jumătate au fost diagnosticați abia la 18 ani sau mai
          târziu.
        source: cdc-adult-adhd
      - text: >-
          Studiile pe gemeni estimează ereditatea ADHD la aproximativ 74%.
        source: faraone-2019

  # ---------------------------------------------------------------- cluster
  inattention:
    label: Neatenție
    description: >-
      Dificultatea de a direcționa și de a menține atenția acolo unde este
      nevoie, și uneori problema opusă: de a nu putea să îi dai drumul.
  hyperactivity:
    label: Hiperactivitate și impulsivitate
    description: >-
      Un motor interior care merge continuu și acțiuni care vin înaintea
      gândului care ar fi trebuit să le preceadă. La adulți, hiperactivitatea
      este adesea mai degrabă simțită decât văzută.
  executive:
    label: Funcții executive
    description: >-
      Stratul de management al creierului: a începe, a planifica, a ordona, a
      prioritiza, a urmări timpul și a ține lucrurile în minte.
  emotional:
    label: Reglarea emoțiilor
    description: >-
      Emoții care vin repede, lovesc puternic și se liniștesc mai greu. Nu fac
      parte din criteriile formale de diagnostic, dar pentru mulți adulți sunt
      unul dintre cele mai apăsătoare aspecte.
  thinking-traps:
    label: Capcane de gândire
    description: >-
      Distorsiuni obișnuite în felul în care sunt interpretate evenimentele.
      TCC le numește distorsiuni cognitive. Anii de critici fac câteva dintre
      ele frecvente în ADHD.

  # ---------------------------------------------------------------- symptom
  distractibility:
    label: Distractibilitate
    description: >-
      Atenția este trasă de stimuli exteriori sau de gânduri interioare, chiar
      în mijlocul sarcinilor care contează.
  sustained-attention:
    label: Dificultate de a menține atenția
    description: >-
      Sarcinile lungi și puțin stimulante, precum cititul, formularele sau
      ședințele, sunt greu de dus până la capăt. Atenția nu lipsește, ci este
      disponibilă inegal.
  hyperfocus:
    label: Hiperfocalizare
    description: >-
      Absorbție intensă, greu de întrerupt, într-o sarcină interesantă, adesea
      în detrimentul a orice altceva, inclusiv mâncarea, somnul și ceilalți
      oameni.
    aliases: [vedere în tunel]
  forgetfulness:
    label: Uitare
    description: >-
      Programările, promisiunile și sarcinile de rutină se pierd. De obicei nu
      din nepăsare, ci pentru că memento-ul nu vine niciodată la momentul
      potrivit.
  losing-things:
    label: Pierderea lucrurilor
    description: >-
      Chei, telefon, portofel, documente. Lucrurile puse jos „doar o clipă”
      dispar.
  careless-mistakes:
    label: Greșeli din neatenție
    description: >-
      Detalii sunt sărite în muncă sau în acte, deși materialul este bine
      cunoscut.
    aliases: [detalii scăpate]
  restlessness:
    label: Neliniște
    description: >-
      Statul locului este inconfortabil. La adulți, aceasta este adesea o
      tensiune interioară, nu o mișcare vizibilă.
  fidgeting:
    label: Agitație motorie
    description: >-
      Bătut cu degetele, legănat, ciupit, foit. Adesea o strategie de
      autoreglare, nu o distragere.
  impulsivity:
    label: Impulsivitate
    description: >-
      A acționa înainte de a gândi: vorbe scăpate, cumpărături impulsive,
      decizii pripite și alegeri riscante.
  interrupting:
    label: Întreruperea celorlalți și vorbitul mult
    description: >-
      Terminarea frazelor celorlalți, intrarea peste conversații, monologuri
      despre un subiect preferat.
  impatience:
    label: Nerăbdare
    description: >-
      Așteptatul la coadă, în trafic sau după un răspuns lent este greu de
      suportat fizic.
  task-initiation:
    label: Dificultate de a începe sarcini
    description: >-
      A ști exact ce ai de făcut și a nu putea să începi. Numită uneori
      paralizie ADHD.
    aliases: [paralizie ADHD, disfuncție executivă]
  procrastination:
    label: Amânare
    description: >-
      Amânarea sarcinilor până când presiunea termenului oferă destulă urgență
      pentru a acționa.
  time-blindness:
    label: Percepție slabă a timpului
    description: >-
      Un simț slab al timpului scurs și al duratei lucrurilor. Urmează
      întârzieri cronice și angajamente prea multe.
    aliases: [gestionarea timpului, mereu târziu]
  disorganisation:
    label: Dezorganizare
    description: >-
      Grămezi, spații aglomerate, dosare haotice, acte pierdute.
  working-memory:
    label: Probleme de memorie de lucru
    description: >-
      Este greu să ții mai multe lucruri în minte deodată: instrucțiuni în mai
      mulți pași, calcule mintale, motivul pentru care ai intrat într-o
      cameră.
    aliases: [memorie de scurtă durată]
  prioritising:
    label: Dificultate de a stabili priorități
    description: >-
      Totul pare la fel de urgent, sau sarcina cea mai puțin importantă este
      făcută prima pentru că este cea mai interesantă.
  task-switching:
    label: Dificultate de a trece de la o sarcină la alta
    description: >-
      Tranzițiile costă mult. Este greu să te oprești din ce faci și greu să
      începi următorul lucru.
  emotional-dysregulation:
    label: Dereglare emoțională
    description: >-
      Emoțiile vin repede și puternic și se liniștesc mai greu decât pare să
      justifice situația.
    aliases: [schimbări de dispoziție]
  rejection-sensitivity:
    label: Sensibilitate la respingere
    description: >-
      Critica, excluderea sau respingerea percepute pot declanșa o suferință
      intensă. Nu este un criteriu de diagnostic pentru ADHD și nu apare doar
      în ADHD, dar poate interacționa cu dereglarea emoțională și cu
      experiențele anterioare de critică. Conceptul mai puternic de disforie
      de sensibilitate la respingere are sprijin limitat în cercetare.
    aliases: [RSD, disforie de sensibilitate la respingere]
  frustration-tolerance:
    label: Toleranță scăzută la frustrare
    description: >-
      Obstacole mici pot produce furie disproporționată sau impulsul de a
      renunța cu totul.
  boredom-intolerance:
    label: Intoleranță la plictiseală
    description: >-
      Substimularea este neplăcută. Mintea caută noutate sau intensitate
      oriunde le găsește.
  sleep-problems:
    label: Probleme de somn
    description: >-
      Dificultăți de a adormi, un ceas intern decalat și statul târziu pentru
      a recupera timpul pe care ziua nu l-a oferit.
  rumination:
    label: Ruminație
    description: >-
      Aceeași grijă reluată la nesfârșit: sarcina, e-mailul, ce ai spus. Pare
      gândire, dar nu produce nicio decizie și consumă energie.
  avoidance:
    label: Evitare
    description: >-
      A ocoli sarcina, mesajul sau persoana care declanșează teama. Ușurare
      acum, o problemă mai mare mai târziu.
  out-of-sight:
    label: Ce nu se vede nu există
    description: >-
      Ce nu este vizibil încetează să existe: factura din sertar, legumele din
      spatele laptelui, prietenul căruia nu i-ai răspuns.
  decision-paralysis:
    label: Paralizie decizională
    description: >-
      Prea multe opțiuni, fiecare cerând o decizie, așa că niciuna nu se ia.
      Grămezile sunt adesea teancuri de decizii amânate.
  anticipatory-anxiety:
    label: Teama dinaintea sarcinii
    description: >-
      Anxietate care sosește cu mult înaintea sarcinii și costă adesea mai
      mult decât sarcina însăși.
  catastrophising:
    label: Catastrofizare
    description: >-
      A sări la cel mai rău rezultat posibil și a-l trata ca probabil: un
      e-mail întârziat devine pierderea locului de muncă.
  all-or-nothing:
    label: Gândire totul sau nimic
    description: >-
      Tot ce nu este perfect contează ca eșec. Un antrenament ratat înseamnă
      că tot planul este ruinat.
  mind-reading:
    label: Citirea gândurilor
    description: >-
      A presupune că știi ce cred ceilalți despre tine, de obicei ce e mai
      rău, fără să verifici.
  overgeneralisation:
    label: Suprageneralizare
    description: >-
      Un eșec devine o regulă despre toată viața ta: „Mereu stric asta.”
  should-statements:
    label: Afirmații cu „trebuie”
    description: >-
      Reguli rigide despre cum trebuie să te porți tu și ceilalți. Fiecare
      „trebuie” neîndeplinit produce vinovăție sau furie.
  personalisation:
    label: Personalizare
    description: >-
      A-ți asuma responsabilitatea pentru lucruri din afara controlului tău
      sau a citi evenimente neutre ca fiind despre tine.
  safety-behaviours:
    label: Comportamente de siguranță
    description: >-
      Lucruri mărunte făcute pentru a te simți mai în siguranță în situații
      temute: repetarea fiecărei propoziții, camera oprită, întotdeauna o
      ieșire la îndemână. Aduc ușurare și țin frica în viață.
  sensory-sensitivity:
    label: Sensibilitate senzorială
    description: >-
      Sunetele, mirosurile, texturile sau lumina pot părea neobișnuit de
      intense sau pot trage mereu de atenție. Diferențele senzoriale sunt
      raportate mai des de persoanele cu ADHD, dar nu fac parte din criteriile
      de diagnostic și pot apărea și în alte condiții.
    aliases: [suprastimulare]
    facts:
      - text: >-
          Într-un studiu pe adulți cu ADHD, 43% dintre femei și 22% dintre
          bărbați au raportat hipo- sau hipersensibilitate senzorială.
        source: bijlenga-2017
  misophonia:
    label: Misofonie
    description: >-
      Furie sau dezgust intens la sunete specifice precum mestecatul, bătutul
      cu degetele sau trasul nasului. Poate apărea împreună cu ADHD, dar felul
      în care se leagă cele două este încă studiat.
    facts:
      - text: >-
          Într-un eșantion de 575 de persoane cu misofonie, 5% au raportat
          ADHD.
        source: jager-2020
  follow-through:
    label: Dificultate de a duce lucrurile la capăt
    description: >-
      Începi o sarcină sau prima instrucțiune, apoi pierzi firul înainte ca
      toți pașii să fie gata. Intenția a fost reală, firul nu a rezistat.
  losing-conversation-thread:
    label: Pierderea firului în conversație
    description: >-
      Atenția alunecă în timp ce cineva vorbește, așa că o parte din ce s-a
      spus nu ajunge niciodată. Pare că nu asculți, deși persoana se
      străduiește să urmărească.
  mind-wandering:
    label: Rătăcire accentuată a gândurilor
    description: >-
      Un șir de gânduri scurte și fără legătură trage atenția de la sarcină.
      Spre deosebire de ruminație, mintea sare între subiecte în loc să se
      învârtă în jurul unei griji.
    aliases: [visare cu ochii deschiși]
  planning-sequencing:
    label: Dificultate de a planifica și de a ordona
    description: >-
      Știi obiectivul, dar îți este greu să alegi o ordine, să vezi ce depinde
      de ce și să transformi totul într-o succesiune de pași fezabilă.

  # ---------------------------------------------------------------- trigger
  boring-tasks:
    label: Sarcini plictisitoare sau repetitive
    description: >-
      Sarcinile puțin interesante oferă prea puțină stimulare pentru a menține
      atenția.
  poor-sleep:
    label: Lipsa somnului
    description: >-
      Multe simptome ADHD se pot agrava după o noapte proastă.
  noisy-environment:
    label: Mediu zgomotos
    description: >-
      Birouri deschise, cafenele, un televizor pornit în fundal.
  unclear-instructions:
    label: Instrucțiuni neclare
    description: >-
      Sarcinile vagi sau doar verbale nu lasă nimic de care să te agăți.
  notifications:
    label: Notificări și telefon
    description: >-
      Fiecare vibrație este o invitație de a părăsi sarcina.
  stress:
    label: Stres și suprasolicitare
    description: >-
      Prea multe cerințe deodată micșorează o capacitate executivă deja
      limitată.
  long-meetings:
    label: Ședințe lungi
    description: >-
      O oră de ascultat pasiv, fără interacțiune.
  open-ended-tasks:
    label: Sarcini fără un final clar
    description: >-
      Fără un început clar, fără un sfârșit clar, fără o definiție a lui
      „gata”.
  hunger:
    label: Foame și mese sărite
    description: >-
      Uiți să mănânci, apoi te prăbușești.
  strong-smells:
    label: Mirosuri puternice
    description: >-
      Parfum, produse de curățenie, prânzul unui coleg, lumânarea parfumată pe
      care altcineva o adoră.
  crowded-places:
    label: Locuri aglomerate
    description: >-
      Supermarketuri, gări, petreceri: multe surse de sunet, mișcare și
      mirosuri în același timp.
  harsh-light:
    label: Lumină dură și pâlpâit
    description: >-
      Tuburi fluorescente, ecrane prea luminoase, lumini care pâlpâie, soarele
      jos prin parbriz.
  textures:
    label: Texturi și etichete
    description: >-
      Materiale aspre, etichete de haine, cusături la șosete, o mânecă udă.
      Mici, constante, imposibil de ignorat.
  competing-demands:
    label: Prea multe cereri în același timp
    description: >-
      Mai multe solicitări, decizii și sarcini neterminate cer atenție
      deodată, ceea ce face greu de ales și de păstrat următoarea acțiune.
  unexpected-interruptions:
    label: Întreruperi neașteptate
    description: >-
      O întrebare, un apel sau o cerere urgentă rupe sarcina curentă, iar
      reconstruirea locului unde erai costă mai mult decât întreruperea în
      sine.

  # ---------------------------------------------------------------- strategy
  body-doubling:
    label: Body doubling (lucru în prezența cuiva)
    description: >-
      A lucra alături de o altă persoană, în aceeași cameră sau pe video, a
      cărei prezență face mai ușor să începi și să rămâi la sarcină.
    aliases: [lucru în paralel]
  pomodoro:
    label: Cronometru Pomodoro
    description: >-
      Lucru în sprinturi scurte, cronometrate, cu pauze între ele. Cronometrul
      oferă structură și, mai ales, un punct final.
  visual-timers:
    label: Cronometre vizuale
    description: >-
      Cronometrele care arată timpul ca un disc sau o bară care se micșorează
      fac trecerea timpului vizibilă.
  external-reminders:
    label: Alarme și memento-uri externe
    description: >-
      Scoate memoria din cap: alarme pe telefon, notificări în calendar,
      bilețele exact acolo unde trebuie acționat.
  task-breakdown:
    label: Împărțirea sarcinilor în pași mici
    description: >-
      „Scrie raportul” devine „deschide documentul, scrie un titlu”. Primul
      pas ar trebui să fie aproape ridicol de mic.
  checklists:
    label: Liste de verificare scrise
    description: >-
      Pune planul pe hârtie, ca memoria de lucru să nu trebuiască să îl țină.
  home-for-things:
    label: Un loc fix pentru fiecare lucru
    description: >-
      Locuri fixe pentru chei, portofel și ochelari. Un bol lângă ușă bate
      orice notiță mentală.
  exercise:
    label: Mișcare regulată
    description: >-
      Activitatea aerobică poate îmbunătăți atenția și dispoziția pentru
      câteva ore și poate ajuta somnul.
  sleep-routine:
    label: Rutină de somn constantă
    description: >-
      O oră fixă de trezire, un ritual de seară, fără ecrane în dormitor.
  mindfulness:
    label: Practica mindfulness
    description: >-
      Exercițiu scurt și regulat de a observa atenția care rătăcește și
      emoțiile care urcă, înainte să preia controlul.
  fidget-tools:
    label: Obiecte fidget
    description: >-
      A da corpului ceva de făcut poate elibera atenția în loc să o consume.
  noise-control:
    label: Căști și zgomot alb
    description: >-
      Căștile cu anulare a zgomotului sau un sunet de fundal constant reduc
      distragerea auditivă.
  time-boxing:
    label: Blocuri de timp în calendar
    description: >-
      Dă fiecărei sarcini un loc în calendar, cu o estimare realistă, de
      obicei mai lungă.
  accountability-partner:
    label: Partener de responsabilizare
    description: >-
      Spune cuiva ce vei face și până când, apoi raportează.
  routines:
    label: Rutine și înlănțuirea obiceiurilor
    description: >-
      Leagă obiceiurile noi de ancore existente (după cafea, ia medicația), ca
      să fie nevoie de mai puține decizii.
  prepare-night-before:
    label: Pregătirea din seara precedentă
    description: >-
      Haine, geantă, prânz și chei pregătite. Dimineața merge apoi pe pilot
      automat.
  externalise-memory:
    label: Externalizarea memoriei de lucru
    description: >-
      Table, aplicații de notițe, memo-uri vocale. Prinde gândul în clipa în
      care apare.
  dopamine-menu:
    label: Meniu de dopamină
    description: >-
      O listă scrisă dinainte cu activități sănătoase și plăcute, la care să
      apelezi în loc de derulat la nesfârșit.
  gamification:
    label: Transformarea sarcinilor în joc
    description: >-
      Puncte, serii, curse contra cronometru. Noutatea și competiția creează
      urgența care lipsește sarcinilor plictisitoare.
  single-tasking:
    label: O singură sarcină odată
    description: >-
      O filă, o sarcină, un singur lucru pe birou. Micșorează suprafața de
      atac a distragerii.
  done-not-perfect:
    label: Mai bine gata decât perfect
    description: >-
      Coboară ștacheta în mod deliberat. Perfecționismul este un motor
      frecvent al amânării.
  pause-before-acting:
    label: Pauză înainte de a acționa
    description: >-
      O întârziere încorporată: 24 de ore înaintea unei cumpărături, o
      respirație lentă înaintea unui răspuns.
  self-compassion:
    label: Autocompasiune
    description: >-
      Tratează derapajele ca date, nu ca dovezi de eșec. Rușinea alimentează
      evitarea.
  decision-reduction:
    label: Mai puține decizii
    description: >-
      Mai puține alegeri de făcut: mese standard, o garderobă mică, răspunsuri
      implicite.
  movement-breaks:
    label: Pauze de mișcare
    description: >-
      O plimbare scurtă, un etaj pe scări sau o întindere în fiecare oră.
      Ședințele în mers și biroul la care stai în picioare contează și ele.
  write-it-down-instead:
    label: Scrie în loc să spui
    description: >-
      În timpul unei conversații, notează gândul pe hârtie ca să nu mai
      împingă să iasă. Poate fi adus în discuție după ce celălalt a terminat.
  item-trackers:
    label: Localizatoare Bluetooth
    description: >-
      Etichete mici pe chei, portofel și geantă, și un telefon care le poate
      face să sune. Transformă o căutare de douăzeci de minute într-una de
      douăzeci de secunde.
  duplicate-essentials:
    label: Dublează lucrurile esențiale
    description: >-
      Chei de rezervă la un vecin, un încărcător în fiecare geantă, ochelari
      de citit în fiecare cameră. Pierderea unui exemplar nu mai este o criză.
  final-review-pass:
    label: Verificare finală
    description: >-
      O verificare separată, deliberată, după ce lucrarea pare terminată,
      ideal după o pauză și pe baza unei liste scurte cu greșelile tale
      tipice.
  written-instructions:
    label: Cere instrucțiuni scrise
    description: >-
      Cere sarcinile prin mesaj sau e-mail, sau scrie ce ai auzit și trimite
      înapoi pentru confirmare.
  repeat-back:
    label: Repetă și rezumă
    description: >-
      Înainte să se încheie o conversație, spune ce ai înțeles și ce vei face.
      Lipsurile ies la iveală cât încă sunt ieftin de reparat.
  hyperfocus-exit:
    label: Ritual de ieșire din hiperfocalizare
    description: >-
      O alarmă de oprire fermă setată înainte de a începe, apă și mâncare la
      îndemână, și un rând scris despre unde reiei data viitoare.
  name-the-emotion:
    label: Numește emoția
    description: >-
      Punerea în cuvinte a sentimentului, de exemplu „asta e frustrare, cam
      șapte din zece”, deschide un mic spațiu între sentiment și reacție.
  cooling-off-rule:
    label: Regula de răcire
    description: >-
      O regulă convenită cu tine și cu cei apropiați: niciun răspuns sau
      decizie importantă cât timp valul e sus. Revino după douăzeci de minute
      sau a doua zi dimineață.
  ask-instead-of-assume:
    label: Întreabă în loc să presupui
    description: >-
      Când un mesaj pare o respingere, verifică înainte de a reacționa: „Ai
      vrut să spui că...?” Majoritatea jignirilor percepute se dizolvă la
      contactul cu faptele.
  distress-tolerance:
    label: Abilități de toleranță la stres
    description: >-
      Abilități din terapia dialectic-comportamentală pentru a calma corpul
      rapid: apă rece pe față, respirație ritmată, o repriză scurtă de mișcare
      intensă.
  automatic-payments:
    label: Plăți automate
    description: >-
      Debit direct pentru fiecare factură recurentă, economii mutate în ziua
      salariului, un singur card pentru toate abonamentele. Sistemul ține
      minte ca să nu trebuiască tu.
  subscription-audit:
    label: Inventarul abonamentelor
    description: >-
      Un memento recurent, la câteva luni, pentru a lista toate abonamentele
      și a anula ce nu mai folosești.
  explain-your-adhd:
    label: Explică cum se manifestă ADHD-ul tău
    description: >-
      Spune-le partenerilor, prietenilor și colegilor la ce să se aștepte,
      precum răspunsuri târzii, întreruperi sau firul pierdut, și ce ajută,
      înainte să se întâmple.
  repair-routine:
    label: Rutină de reparare
    description: >-
      Un mod convenit de a recunoaște un derapaj, de a-ți cere scuze și de a o
      lua de la capăt, ca promisiunile uitate să nu se adune în resentimente
      de nicio parte.
  shared-calendar:
    label: Calendar comun
    description: >-
      Un singur calendar vizibil pentru partener sau familie, cu programări,
      evenimente de la școală și promisiuni făcute. Nimic nu trăiește doar
      într-un singur cap.
  buffer-time:
    label: Timp tampon
    description: >-
      Planifică să ajungi cu cincisprezece minute mai devreme și să termini cu
      o zi înainte de termenul real. Tamponul absoarbe percepția slabă a
      timpului.
  deadline-check-ins:
    label: Verificări intermediare ale termenelor
    description: >-
      Etape intermediare convenite cu cel care așteaptă lucrarea. Fiecare este
      un termen mic, cu urgență reală.
  recovery-time:
    label: Timp de recuperare planificat
    description: >-
      Timp nestructurat, deliberat, după zilele solicitante, protejat în
      calendar ca somnul. Compensarea ADHD-ului toată ziua are un cost care
      trebuie plătit înapoi.
  reduce-masking:
    label: Mai puțină mascare
    description: >-
      Alege câteva locuri și câțiva oameni cu care încetezi să joci rolul de
      neurotipic: foiește-te, ia notițe, cere să se repete, pleacă atunci când
      ai nevoie.
  play-to-strengths:
    label: Mizează pe punctele forte
    description: >-
      Îndreaptă munca spre sarcinile creative, conduse de interes sau de
      criză, în care creierele ADHD strălucesc, și negociază sau automatizează
      restul.
  interest-pairing:
    label: Împerechează plictisitorul cu ceva plăcut
    description: >-
      Podcastul preferat doar în timpul treburilor casnice, actele doar în
      cafeneaua bună. Jumătatea plăcută poate oferi o parte din stimularea
      care lipsește sarcinii.
  behavioural-activation:
    label: Activare comportamentală
    description: >-
      O activitate mică, plăcută sau cu sens, programată în fiecare zi și
      făcută indiferent dacă ai chef. Dispoziția urmează acțiunea mai mult
      decât urmează acțiunea dispoziția.
  morning-daylight:
    label: Lumina dimineții
    description: >-
      Zece minute de lumină afară, la scurt timp după trezire, ancorează
      ceasul intern și ridică dispoziția.
  social-contact:
    label: Contact social
    description: >-
      Un apel scurt sau o plimbare cu cineva, mai ales în zilele în care ai
      cel mai puțin chef. Izolarea alimentează dispoziția scăzută.
  worry-window:
    label: Fereastra grijilor
    description: >-
      Cincisprezece minute pe zi rezervate pentru a scrie fiecare grijă. În
      afara ferestrei, grija primește o notiță și o programare în locul
      atenției tale.
  less-alcohol:
    label: Mai puțin alcool
    description: >-
      Alcoolul poate înrăutăți somnul, impulsivitatea și dispoziția zile la
      rând. Reducerea lui este una dintre cele mai ieftine îmbunătățiri
      disponibile.
  nightly-reset:
    label: Resetarea de zece minute de seară
    description: >-
      Un cronometru, un tur al apartamentului, lucrurile înapoi la locul lor.
      Nu curățenie, doar resetare. Destul de mic ca să îl faci în fiecare
      seară.
  one-surface:
    label: O suprafață pe rundă
    description: >-
      Un blat, un sertar, un colț, apoi stop. Niciodată un maraton pe toată
      camera: maratonul nu începe niciodată.
  doom-box:
    label: Cutia „pentru mai târziu”
    description: >-
      O cutie pentru grămada de lucruri care au nevoie de o decizie. Suprafața
      este liberă acum, deciziile așteaptă un moment mai calm.
    aliases: [cutia cu de toate]
  own-less:
    label: Deține mai puțin
    description: >-
      Mai puține lucruri înseamnă mai puține locuri de ținut minte și mai
      puține decizii la fiecare ordine. Unul intră, unul iese.
  visible-storage:
    label: Depozitare la vedere
    description: >-
      Rafturi deschise, cutii transparente, cârlige în loc de sertare. Dacă
      ușile închise șterg lucrurile, ține-le deschise.
  sort-by-frequency:
    label: "Sortează după frecvență, nu după categorie"
    description: >-
      Lucrurile folosite zilnic stau la o lungime de braț de locul unde sunt
      folosite. Restul poate fi mai departe și mai puțin organizat.
  launch-pad:
    label: Rampa de lansare de la ușă
    description: >-
      Un loc pentru chei, geantă, portofel și tot ce trebuie să iasă din casă
      mâine. Plecarea devine o singură mișcare.
  define-done:
    label: Definește „gata”
    description: >-
      Înainte de a începe, scrie o propoziție despre cum arată terminat. O
      sarcină fără sfârșit este o sarcină care nu începe niciodată.
  five-minute-rule:
    label: Regula celor cinci minute
    description: >-
      Angajează-te doar la cinci minute din lucrul de care te temi. Oprirea
      după cinci minute este permisă. De cele mai multe ori nu te vei opri.
  thought-record:
    label: Jurnal de gânduri
    description: >-
      Scrie situația, gândul automat, emoția și intensitatea ei, dovezile
      pentru și împotrivă, și un gând mai echilibrat. Fișa clasică de TCC.
  decatastrophising:
    label: Decatastrofizare
    description: >-
      Trei întrebări: care este cel mai rău lucru care s-ar putea întâmpla,
      cât de probabil este cu adevărat, și cum m-aș descurca dacă s-ar
      întâmpla?
  behavioural-experiments:
    label: Testează ceea ce te sperie
    description: >-
      În TCC se numește experiment comportamental. Scrie exact ce crezi că va
      merge prost și cât de sigur ești, pe o scară până la zece. Apoi fă
      lucrul respectiv o dată, fără precauțiile obișnuite. După aceea scrie ce
      s-a întâmplat de fapt. Diferența dintre predicție și rezultat este cea
      care schimbă convingerea. Sfatul de a nu-ți face griji nu o schimbă.
  graded-exposure:
    label: Expunere gradată
    description: >-
      Ordonează situațiile temute de la ușor la greu și urcă scara, rămânând
      în fiecare până când anxietatea scade de la sine. Evitarea micșorează
      lumea; expunerea o lărgește la loc.
  structured-problem-solving:
    label: Rezolvare structurată a problemelor
    description: >-
      Definește problema într-o propoziție, listează toate opțiunile fără a
      judeca, alege una, planifică primul pas, evaluează după. Transformă
      ruminația într-o decizie.
  mood-diary:
    label: Jurnal de dispoziție și activitate
    description: >-
      Notează ce ai făcut și cum te-ai simțit, oră de oră, timp de o
      săptămână. Tiparul arată ce activități ridică dispoziția și ce o
      epuizează.
  relaxation-breathing:
    label: Respirație ritmată și relaxare musculară
    description: >-
      Respirație lentă, cu expirație prelungită, sau încordarea și relaxarea
      pe rând a grupelor musculare. Învață corpul butonul de oprire.
  relapse-plan:
    label: Plan de prevenire a recăderii
    description: >-
      O pagină scrisă: semne timpurii de avertizare, ce a ajutat data trecută,
      pe cine să suni. Făcută când ești bine, citită când nu ești.
  psychoeducation:
    label: Înțelege cum funcționează anxietatea
    description: >-
      Înțelegerea răspunsului luptă-sau-fugi, a motivului pentru care evitarea
      hrănește frica și a faptului că anxietatea atinge mereu un vârf și apoi
      scade îi ia mult din putere.
  earplugs:
    label: Dopuri de urechi pentru zi de zi
    description: >-
      Dopuri cu filtru care iau vârfurile fără a tăia vorbirea, ținute pe
      breloc ca să fie mereu la îndemână.
  control-the-environment:
    label: Controlează mediul
    description: >-
      Alege locul, camera și momentul zilei. Produse fără parfum acasă, lumini
      reglabile, un colț liniștit la birou. De la început mai puțini stimuli.
  comfortable-clothes:
    label: Haine care se simt bine
    description: >-
      Taie etichetele, cumpără din nou aceleași materiale moi, nu face
      niciodată compromisuri la șosete. Confortul nu este moft când
      alternativa este distragere toată ziua.
  quiet-after-loud:
    label: Liniște după zilele zgomotoase
    description: >-
      Tăcere programată după o zi zgomotoasă: fără muzică, fără apeluri,
      lumină slabă. Recuperarea face parte din plan, nu este un lux.
  leave-early:
    label: Permisiunea de a pleca
    description: >-
      Convine dinainte, cu tine și cu cei care te însoțesc, că este în regulă
      să pleci devreme dintr-un loc zgomotos. Să știi că există o ieșire scade
      povara de la început.
  planning-time-to-plan:
    label: Programează un timp pentru planificare
    description: >-
      Pune planificarea însăși în calendar, ca un interval scurt zilnic. Fără
      el ziua începe în reacție, iar planificarea este pasul care sare primul.
  master-list:
    label: O singură listă cu tot
    description: >-
      O listă unică ce cuprinde fiecare angajament, mare sau mic, într-un
      singur loc. Nu este lista din care lucrezi, ci lista pe care nu o mai
      cari în minte.
  daily-shortlist:
    label: O listă scurtă pentru azi
    description: >-
      În fiecare zi, copiază câteva lucruri din lista mare. O listă scurtă
      poate fi terminată, iar doar o listă terminată construiește încredere în
      sistem.
  underschedule:
    label: Programează intenționat mai puțin
    description: >-
      Planifică mai puține sarcini decât crezi că încap și lasă între ele mai
      mult spațiu decât pare necesar. Estimarea timpului este punctul slab,
      deci planul trebuie să absoarbă eroarea.
  if-then-plans:
    label: Planuri dacă-atunci
    description: >-
      Decide dinainte ce faci la o anumită întrerupere: dacă vine un mesaj,
      atunci așteaptă până la finalul acestui interval. Decizia se ia o dată,
      la rece, nu de fiecare dată.
  smallest-step:
    label: Numește cea mai mică primă mișcare
    description: >-
      Nu sarcina, nici măcar primul pas, ci cea mai mică acțiune fizică ce te
      pune în poziție: fișierul deschis pe ecran, pantofii lângă ușă.
  escape-behaviours:
    label: Cunoaște-ți ieșirile de urgență
    description: >-
      Fiecare are o listă scurtă de lucruri pe care le face în loc: căsuța de
      e-mail, frigiderul, o comisioană rapidă. Numindu-le, impulsul devine un
      semnal că eviți ceva.
  anticipation-ratio:
    label: Reechilibrează ce aștepți
    description: >-
      Înaintea unei sarcini temute, majoritatea numără doar ce va fi neplăcut.
      Adaugă ce este adevărat pe cealaltă parte: este limitată în timp, poate
      fi făcută prost, iar a o termina se simte mai bine decât a o purta mai
      departe.
  accept-discomfort:
    label: Începe fără să aștepți să te simți pregătit
    description: >-
      Disconfortul de obicei nu dispare înainte de a începe, ci la scurt timp
      după. Așteptarea dispoziției potrivite transformă o sarcină într-o
      săptămână.
  behavioural-scripts:
    label: Demontează-ți rutinele
    description: >-
      Unele secvențe se derulează singure: ajungi acasă, canapeaua, telefonul,
      seara dusă. Scrierea secvenței arată unde este de fapt punctul de
      decizie.
  reframe-time:
    label: Pune un număr real pe timp
    description: >-
      Întreabă cât durează cu adevărat sarcina, nu cât pare. Majoritatea
      punctelor de pe o listă zilnică cer sub o oră, iar sarcina fără limită
      este cea care nu începe niciodată.
  manage-energy:
    label: Folosește-ți deliberat orele bune
    description: >-
      Atenția nu este disponibilă uniform de-a lungul zilei. Pune munca
      solicitantă în orele în care o ai cu adevărat și pe cea mecanică în
      celelalte.
  earned-rewards:
    label: Transformă evadările în recompense meritate
    description: >-
      Lucrurile în care evadezi pot fi mutate de cealaltă parte a sarcinii.
      Aceeași jumătate de oră online înseamnă cu totul altceva înainte și
      după.
  defense-attorney:
    label: Susține și cealaltă parte
    description: >-
      Un gând dur convinge pentru că s-a auzit o singură parte. Construiește
      intenționat pledoaria contrară, așa cum ar face un avocat al apărării,
      înainte să accepți verdictul.
  method-acting:
    label: Poartă-te ca cel care o face
    description: >-
      Comportă-te ca cineva care ține deja o agendă sau trimite acel e-mail,
      înainte să pară natural. Repetiția îl face natural, nu invers.
  values-commitment:
    label: Leagă sarcina de ceea ce prețuiești
    description: >-
      O sarcină plictisitoare care servește ceva ce contează pentru tine este
      mai ușor de început decât una apărată ca fiind doar necesară. Numește ce
      anume servește.
  problem-template:
    label: Un șablon scris pentru probleme
    description: >-
      Definește problema într-o propoziție, enumeră opțiunile fără să le
      judeci, alege, planifică primul pas și evaluează după. Șablonul face
      gândirea pe care momentul nu o poate face.
  face-uncertainty:
    label: Decide înainte ca lucrurile să decidă singure
    description: >-
      A amâna o decizie este tot o decizie, de obicei cea mai proastă, pentru
      că opțiunile expiră în tăcere. A acționa în incertitudine bate a acționa
      prea târziu.
  planned-distraction:
    label: Programează distragerea
    description: >-
      Dă jocurilor, fluxurilor și ecranelor un loc real în zi, în loc să le
      lași să ocupe golurile. Timpul liber programat nu mai concurează cu tot
      restul.
  coping-drift:
    label: Așteaptă-te ca sistemul să alunece
    description: >-
      Orice sistem alunecă după câteva săptămâni bune. Tratează alunecarea ca
      pe ceva normal și planifică dinainte repornirea, în loc să o citești ca
      dovadă că nu poți ține nimic.

  # ---------------------------------------------------------------- treatment
  assessment:
    label: Diagnostic și evaluare
    description: >-
      O evaluare formală făcută de un clinician calificat este poarta către
      tratament și adaptări.
    aliases: [diagnostic, evaluare]
    facts:
      - text: >-
          Aproximativ jumătate dintre adulții din Statele Unite cu un
          diagnostic curent de ADHD au fost diagnosticați abia la 18 ani sau
          mai târziu.
        source: cdc-adult-adhd
  medication:
    label: Medicație
    description: >-
      Medicație stimulantă și nestimulantă, prescrisă și monitorizată de un
      clinician. Un tratament de primă linie pentru mulți adulți.
    aliases: [stimulante, metilfenidat]
    facts:
      - text: >-
          Aproximativ o treime dintre adulții cu ADHD din Statele Unite au
          luat un medicament stimulant în anul anterior. Dintre aceștia, 71,5%
          au avut dificultăți în a-și ridica rețeta pentru că medicamentul nu
          era disponibil.
        source: cdc-adult-adhd
  cbt:
    label: TCC pentru ADHD
    description: >-
      Terapie cognitiv-comportamentală adaptată pentru ADHD: abilități pentru
      planificare, amânare și tipare de gândire nefolositoare.
    aliases: [TCC, terapie cognitiv-comportamentală]
  coaching:
    label: Coaching pentru ADHD
    description: >-
      Sprijin practic, orientat spre obiective, pentru a construi sisteme și
      rutine potrivite persoanei.
  workplace-accommodations:
    label: Adaptări la locul de muncă
    description: >-
      Program flexibil, instrucțiuni scrise, un spațiu de lucru liniștit,
      verificări intermediare ale termenelor.
  psychotherapy:
    label: Psihoterapie
    description: >-
      Terapie prin dialog cu un terapeut calificat pentru anxietatea,
      dispoziția scăzută și imaginea de sine care cresc adesea în jurul ADHD-
      ului.
  crisis-help:
    label: "Când se întunecă: cere ajutor acum"
    description: >-
      Dacă gândurile se îndreaptă spre a nu mai vrea să fii aici, contactează
      azi un medic, o linie de criză sau serviciile de urgență. Este o
      situație medicală, nu un defect de caracter.
  professional-organiser:
    label: Organizator profesionist sau ajutor la curățenie
    description: >-
      Ajutor plătit pentru a amenaja o locuință care se întreține singură sau
      pentru a o menține așa. O adaptare, nu un eșec.

  # ---------------------------------------------------------------- impact
  missed-deadlines:
    label: Termene ratate
    description: >-
      Lucrări predate târziu sau deloc, în ciuda intențiilor bune și a
      efortului real.
  relationship-strain:
    label: Relații tensionate
    description: >-
      Promisiunile uitate, întreruperile și izbucnirile emoționale uzează
      relațiile cu partenerii, prietenii și colegii.
  low-self-esteem:
    label: Stimă de sine scăzută
    description: >-
      Ani de „străduiește-te mai mult” lasă senzația de a fi leneș sau defect.
  burnout:
    label: Epuizare (burnout)
    description: >-
      Mascarea simptomelor și compensarea lor continuă sunt epuizante.
  financial-trouble:
    label: Probleme financiare
    description: >-
      Penalizări de întârziere, abonamente uitate, cumpărături impulsive.
  inconsistent-performance:
    label: Performanță inconstantă la muncă sau la studiu
    description: >-
      Rezultate care oscilează între excelent și întârziat sau lipsă, adesea
      la același tip de sarcină. Diferența este între ce este posibil într-o
      zi bună și ce se întâmplă într-o zi obișnuită, nu între efort și
      capacitate.
    aliases: [subperformanță]
  energy-drain:
    label: Epuizarea energiei
    description: >-
      Oboseala orelor petrecute cu griji, mascare și compensare, fără nimic de
      arătat în schimb.
  sensory-overload:
    label: Suprasolicitare senzorială
    description: >-
      Prea mulți stimuli deodată: iritabilitate, blocaj, nevoia de a părăsi
      camera. Consumă energie ore întregi după aceea.
  driving-risk:
    label: Condusul și riscul de accident
    description: >-
      La nivel de populație, ADHD este asociat cu un risc mai mare de
      accident. Distractibilitatea, impulsivitatea și lipsa somnului cântăresc
      mai greu la volan sau în preajma utilajelor. Este o constatare de grup
      și nu spune nimic despre un anumit șofer.
    facts:
      - text: >-
          Într-un studiu populațional suedez, perioadele cu medicație au fost
          asociate cu o rată cu 58% mai mică de accidente grave de circulație
          la bărbații cu ADHD. Autorii au estimat că 41% până la 49% dintre
          aceste accidente ar fi putut fi evitate cu tratament.
        source: chang-2014

  # ---------------------------------------------------------------- condition
  anxiety:
    label: Anxietate
    description: >-
      Tulburările de anxietate apar mai des alături de ADHD decât în populația
      generală. Grija, tensiunea fizică și evitarea pot semăna cu simptomele
      ADHD și pot fi agravate de ele. Anxietatea are nevoie de evaluare și
      tratament proprii.
    facts:
      - text: >-
          Aproximativ 5,8% din populația lumii, în jur de 470 de milioane de
          oameni, aveau o tulburare de anxietate în 2023.
        source: who-anxiety
      - text: >-
          Doar aproximativ una din patru persoane care au nevoie de tratament
          pentru o tulburare de anxietate primește vreunul: 27,6%.
        source: who-anxiety
      - text: >-
          Fetele și femeile au mai des o tulburare de anxietate decât băieții
          și bărbații.
        source: who-anxiety
      - text: >-
          Însumând studiile, adulții cu ADHD aveau de aproximativ cinci ori
          mai mari șanse de a avea o tulburare de anxietate față de adulții
          fără ADHD.
        source: hartman-2023
  depression:
    label: Depresie
    description: >-
      Depresia apare mai des alături de ADHD decât în populația generală.
      Dispoziția scăzută, pierderea interesului și epuizarea nu sunt doar
      urmarea unei săptămâni grele. Depresia are nevoie de evaluare și
      tratament proprii. Dacă gândurile se îndreaptă spre a nu mai vrea să fii
      aici, cere ajutor astăzi.
    facts:
      - text: >-
          Aproximativ 5,2% dintre adulții din întreaga lume aveau o tulburare
          depresivă în 2023: 4,1% dintre bărbați și 6,2% dintre femei.
        source: who-depression
      - text: >-
          Este vorba despre aproximativ 322 de milioane de oameni.
        source: who-depression
      - text: >-
          Depresia este de aproximativ 1,5 ori mai frecventă la femei decât la
          bărbați.
        source: who-depression
      - text: >-
          Însumând studiile, adulții cu ADHD aveau de aproximativ patru ori și
          jumătate mai mari șanse de a avea depresie majoră față de adulții
          fără ADHD.
        source: hartman-2023
  substance-use:
    label: Probleme legate de consumul de substanțe
    description: >-
      Tulburările legate de consumul de substanțe apar mai des alături de
      ADHD. Substanțele sunt uneori folosite pentru neliniște, somn,
      dispoziție sau tensiune, dar înrăutățesc funcționarea și au nevoie de
      evaluare și tratament proprii.
    facts:
      - text: >-
          Însumând studiile, adulții cu ADHD aveau de aproximativ patru ori și
          jumătate mai mari șanse de a avea o tulburare legată de consumul de
          substanțe față de adulții fără ADHD.
        source: hartman-2023

  # ---------------------------------------------------------------- situation
  chaotic-home:
    label: Haos în apartament
    description: >-
      Grămezi pe fiecare suprafață, o bucătărie care nu se resetează niciodată
      singură, senzația că locuința câștigă. Aici se suprapun mai multe
      simptome, de aceea voința singură nu rezolvă problema.
  dreaded-task:
    label: O sarcină de care mă tem
    description: >-
      E-mailul, formularul, apelul telefonic. Stă acolo, crește în fiecare zi
      și pornește un cerc care costă mai multă energie decât ar costa să o
      faci.
  money-admin:
    label: Administrarea banilor
    description: >-
      Facturi, abonamente, taxe, contul pe care nu l-ai deschis de luni de
      zile. Uitarea, evitarea și impulsivitatea se întâlnesc toate aici.
  loud-evening-out:
    label: Un restaurant zgomotos sau o petrecere
    description: >-
      Toți vorbesc deodată, muzica e tare, cineva mestecă lângă tine.
      Urmărirea conversației costă mai mult decât oferă.
  getting-out-the-door:
    label: Să ieși pe ușă la timp
    description: >-
      Ultimele douăzeci de minute înainte de plecare, când se adună deodată
      mai multe probleme mici: cheile, timpul, lucrul pe care voiai să îl iei.
  meetings-and-lectures:
    label: "O ședință, un curs sau o prelegere"
    description: >-
      O oră de stat locului și ascultat, fără posibilitatea de a te mișca și
      cu puțin de făcut cu mâinile, în timp ce firul discuției alunecă mereu.
  messages-and-inbox:
    label: Mesaje și o căsuță de e-mail plină
    description: >-
      Mesajele fără răspuns se adună. Fiecare cere o decizie, unele par
      riscante de răspuns, iar ce nu se vede ajunge repede uitat.
  bedtime-and-waking:
    label: Culcarea și trezirea
    description: >-
      Seara se lungește, lucrul interesant este greu de lăsat din mână, iar
      dimineața sosește înainte ca noaptea să pară încheiată.
  health-admin:
    label: "Programări, rețete și administrație medicală"
    description: >-
      Programări, reprogramări, formulare, rețete repetate și apeluri de
      urmărire. Administrația din jurul sănătății cere exact abilitățile pe
      care ADHD le face costisitoare.

  # ---------------------------------------------------------------- mechanism
  dopamine-boost:
    label: Cresc dopamina și noradrenalina
    description: >-
      O cale posibilă. Exercițiul aerobic poate ridica, pentru câteva ore,
      aceiași mesageri asupra cărora acționează medicația pentru ADHD. Este o
      parte a explicației, nu toată.
  deeper-sleep:
    label: Somn mai profund
    description: >-
      Oboseala fizică poate face adormirea mai ușoară și somnul mai profund,
      ceea ce îmbunătățește aproape totul a doua zi.
  stress-hormones-drop:
    label: Scad hormonii de stres
    description: >-
      Mișcarea poate consuma răspunsul la stres, astfel încât corpul încetează
      să semnaleze pericol minții.
  energy-discharged:
    label: Energia neliniștită descărcată
    description: >-
      Motorul interior primește o supapă, iar statul locului poate costa mai
      puțin după aceea.
  mood-lift:
    label: Ridicarea dispoziției
    description: >-
      O ridicare de dispoziție adesea temporară, care se adună atunci când se
      întâmplă în majoritatea zilelor.

edges:
  substance-use-adhd:
    note: >-
      O asociere găsită la nivel de populații. Un motiv de evaluare, nu o
      așteptare față de o persoană anume.
  adhd-anxiety:
    note: >-
      Mai frecventă alături de ADHD decât în populația generală. Anxietatea
      poate semăna și cu neatenția, motiv pentru care o evaluare le cântărește
      pe amândouă.
  adhd-depression:
    note: >-
      Mai frecventă alături de ADHD decât în populația generală. Anii de
      dificultăți sunt un factor de risc, dar depresia este o afecțiune de
      sine stătătoare și are nevoie de tratament propriu.
  hyperfocus-time-blindness:
    note: >-
      Într-o sesiune de hiperfocalizare dispar ore întregi.
  sleep-problems-time-blindness:
    note: >-
      Ora de culcare alunecă tot mai târziu pentru că seara nu pare atât de
      lungă pe cât este.
  avoidance-dreaded-task:
    note: >-
      Nimic nu s-a făcut, termenul este mai aproape, iar sarcina pare mai mare
      decât înainte.
  safety-behaviours-anticipatory-anxiety:
    note: >-
      Ușurarea pe care o aduc învață creierul că situația chiar a fost
      periculoasă.
  sensory-sensitivity-sensory-overload:
    note: >-
      Fiecare sunet sau miros costă puțină atenție. Până seara bugetul s-a
      terminat.
  mind-wandering-rumination:
    note: >-
      Ambele trag atenția înăuntru, dar rătăcirea sare între subiecte, în timp
      ce ruminația se învârte în jurul uneia.
  driving-risk-distractibility:
    note: >-
      O asociere la nivel de populație, nu o afirmație despre un anumit șofer.
  body-doubling-task-initiation:
    note: >-
      Prezența altei persoane oferă semnalul de start pe care creierul nu îl
      generează singur.
  pomodoro-task-initiation:
    note: >-
      Angajamentul de doar 25 de minute scade costul începerii.
  pomodoro-hyperfocus:
    note: >-
      Alarma de pauză este o întrerupere exterioară pentru o sesiune care
      altfel ar dura ore.
  fidget-tools-fidgeting:
    note: >-
      Canalizează mișcarea în loc să o suprime.
  routines-task-switching:
    note: >-
      Un ritual fix de tranziție face schimbarea previzibilă.
  pause-before-acting-rejection-sensitivity:
    note: >-
      Așteptarea înainte de a răspunde la o jignire percepută dă primului val
      de emoție timp să treacă.
  write-it-down-instead-interrupting:
    note: >-
      Impulsul de a întrerupe este adesea teama de a pierde gândul. Odată pus
      pe hârtie, poate aștepta.
  explain-your-adhd-relationship-strain:
    note: >-
      Răspunsurile târzii și firul pierdut sunt mai ușor de iertat când au
      fost anunțate dinainte.
  buffer-time-missed-deadlines:
    note: >-
      Tratează tamponul ca pe termenul real. Cel adevărat este doar plasa de
      siguranță.
  reduce-masking-burnout:
    note: >-
      Mascarea costă mai multă energie decât pot vedea cei din jurul tău.
  five-minute-rule-avoidance:
    note: >-
      Cinci minute sunt destul de puțin ca să începi, iar începutul este toată
      problema.
  exercise-dopamine-boost:
    note: >-
      Unii observă o fereastră de concentrare mai ușoară timp de o oră sau
      două după aceea. Mișcarea este o completare a tratamentului, nu un
      înlocuitor.
  thought-record-rumination:
    note: >-
      Ruminația se învârte în cerc; un jurnal de gânduri merge înainte, pentru
      că se încheie cu un gând echilibrat.
  graded-exposure-avoidance:
    note: >-
      Fiecare pas trebuie să fie destul de mic ca să îl faci cu adevărat și
      repetat până devine plictisitor.
  explain-your-adhd-sensory-sensitivity:
    note: >-
      Persoana care mestecă lângă tine nu aude ce auzi tu. Spus dinainte,
      transformă o ceartă într-un plan de așezare la masă.
  smallest-step-task-initiation:
    note: >-
      Atât de mică încât ar fi absurd să refuzi. Începutul este partea
      costisitoare.
  escape-behaviours-procrastination:
    note: >-
      Nu poți întrerupe un obicei pe care nu l-ai observat.
  anticipation-ratio-procrastination:
    note: >-
      De obicei predicția este cea evitată, nu sarcina.
  behavioural-scripts-procrastination:
    note: >-
      Scenariul se derulează înainte de orice decizie, deci decizia trebuie
      mutată mai devreme.
  earned-rewards-procrastination:
    note: >-
      Aceeași activitate devine recompensă în loc de evadare, doar prin
      mutare.
  defense-attorney-catastrophising:
    note: >-
      Întreabă ce dovezi ar fi necesare pentru o condamnare, apoi verifică
      dacă le ai.
  method-acting-task-initiation:
    note: >-
      Jucarea rolului vine prima; sentimentul urmează, uneori mult mai târziu.
  face-uncertainty-decision-paralysis:
    note: >-
      O decizie neluată expiră singură, iar varianta expirată rareori este cea
      dorită.
  coping-drift-inconsistent-performance:
    note: >-
      Dacă revenirea este planificată dinainte, alunecarea costă zile, nu
      luni.
  medication-dopamine-boost:
    note: >-
      Această cale descrie medicația stimulantă. Medicația nestimulantă
      acționează diferit.
  assessment-sensory-sensitivity:
    note: >-
      Sensibilitatea puternică, de o viață, merită adusă în discuție la
      evaluare. Se suprapune cu autismul, iar asta schimbă ce adaptări ajută.
  anxiety-depression-overlap:
    note: >-
      Cele două apar frecvent împreună, iar fiecare o poate face pe cealaltă
      mai greu de recunoscut și de tratat.
