nodes:
  # ---------------------------------------------------------------- hub
  adhd:
    label: ADHD
    description: >-
      A figyelemhiányos hiperaktivitás-zavar olyan idegrendszeri fejlődési
      állapot, amely a figyelem szabályozását, az aktivitási szintet, az
      impulzuskontrollt és a végrehajtó funkciókat érinti. Kattints egy
      csoportra a tünetek felfedezéséhez, majd kövesd a kapcsolatokat a
      kiváltó tényezőkhöz, stratégiákhoz és következményekhez. Ez a térkép
      ismeretterjesztő célú, nem diagnosztikai eszköz. Diagnosztikai
      tüneteket, gyakran együtt járó tapasztalatokat, társuló problémákat és
      gyakorlati stratégiákat tartalmaz. Egyetlen csomópont sem alapoz meg
      ADHD-t. A diagnózis mérlegeli a gyermekkori kezdetet, a tartósságot, a
      több élethelyzetben jelentkező nehézséget és a lehetséges egyéb
      magyarázatokat.
    facts:
      - text: >-
          Világszerte 175 vizsgálat összesítése alapján a gyerekek és serdülők
          nagyjából 7%-a felel meg az ADHD kritériumainak.
        source: thomas-2015
      - text: >-
          Egy 2001 és 2003 között készült amerikai felmérésben a 18 és 44 év
          közötti felnőttek 4,4%-a felelt meg az aktuális ADHD kritériumainak.
        source: kessler-2006
      - text: >-
          Egy 2001 és 2004 között készült amerikai serdülőfelmérésben a fiúk
          13%-ának és a lányok 4,2%-ának volt élete során valamikor ADHD-ja.
        source: nimh-adhd-stats
      - text: >-
          Az ugyanabban az időszakban készült felnőttfelmérésben a férfiak
          5,4%-ánál és a nők 3,2%-ánál találtak aktuális ADHD-t. Az
          élettartamra és a jelenre vonatkozó számok különböző felmérésekből
          és különböző mérőszámokból származnak, ezért közvetlenül nem
          hasonlíthatók össze.
        source: nimh-adhd-stats
      - text: >-
          2023-ban az Egyesült Államokban becsült 15,5 millió felnőtt,
          körülbelül 6%, számolt be aktuális ADHD-diagnózisról. Nagyjából a
          felük csak 18 évesen vagy később kapta meg.
        source: cdc-adult-adhd
      - text: >-
          Ikervizsgálatok szerint az ADHD örökölhetősége körülbelül 74%.
        source: faraone-2019

  # ---------------------------------------------------------------- cluster
  inattention:
    label: Figyelmetlenség
    description: >-
      Nehéz a figyelmet oda irányítani és ott tartani, ahol szükség van rá, és
      néha az ellenkezője a gond: nem lehet elengedni.
  hyperactivity:
    label: Hiperaktivitás és impulzivitás
    description: >-
      Egy belső motor, amely folyton jár, és tettek, amelyek megelőzik a
      gondolatot, amelynek meg kellett volna előznie őket. Felnőtteknél a
      hiperaktivitást gyakran inkább érzik, mint látják.
  executive:
    label: Végrehajtó funkciók
    description: >-
      Az agy irányító rétege: elkezdeni, tervezni, sorrendbe rakni, fontossági
      sorrendet felállítani, követni az időt és észben tartani dolgokat.
  emotional:
    label: Érzelemszabályozás
    description: >-
      Érzelmek, amelyek gyorsan jönnek, erősen ütnek, és tovább tart, míg
      lecsillapodnak. Nem része a hivatalos diagnosztikai kritériumoknak, de
      sok felnőtt számára az egyik legmegterhelőbb terület.
  thinking-traps:
    label: Gondolkodási csapdák
    description: >-
      Megszokott torzítások abban, ahogyan az eseményeket értelmezzük. A KVT
      kognitív torzításoknak nevezi őket. Évekig tartó kritika után több is
      gyakori ADHD mellett.

  # ---------------------------------------------------------------- symptom
  distractibility:
    label: Elterelhető figyelem
    description: >-
      A figyelmet külső ingerek vagy belső gondolatok vonják el, még a fontos
      feladatok közepén is.
  sustained-attention:
    label: Nehéz tartósan figyelni
    description: >-
      A hosszú, kevés ingert adó feladatoknál, mint az olvasás, az űrlapok
      vagy a megbeszélések, nehéz kitartani. A figyelem nem hiányzik, csak
      egyenetlenül áll rendelkezésre.
  hyperfocus:
    label: Hiperfókusz
    description: >-
      Intenzív, nehezen megszakítható elmerülés egy érdekes feladatban,
      gyakran minden más rovására, beleértve az evést, az alvást és a többi
      embert.
    aliases: [alagútlátás]
  forgetfulness:
    label: Feledékenység
    description: >-
      Időpontok, ígéretek és rutinfeladatok kicsúsznak. Általában nem
      nemtörődömségből, hanem mert az emlékeztető sosem a megfelelő
      pillanatban érkezik.
  losing-things:
    label: Tárgyak elvesztése
    description: >-
      Kulcs, telefon, pénztárca, iratok. A „csak egy pillanatra” letett
      tárgyak eltűnnek.
  careless-mistakes:
    label: Figyelmetlenségi hibák
    description: >-
      Munkában vagy papírmunkában részletek maradnak ki, pedig az anyag jól
      ismert.
    aliases: [elnézett részletek]
  restlessness:
    label: Nyugtalanság
    description: >-
      A nyugodt ülés kellemetlen. Felnőtteknél ez gyakran belső feszültség,
      nem látható mozgás.
  fidgeting:
    label: Fészkelődés
    description: >-
      Kopogás, lábrázás, babrálás, fészkelődés. Gyakran inkább önszabályozási
      stratégia, mint figyelemelterelés.
  impulsivity:
    label: Impulzivitás
    description: >-
      Cselekvés gondolkodás előtt: kimondott dolgok, impulzusvásárlások,
      elhamarkodott és kockázatos döntések.
  interrupting:
    label: Közbevágás és sok beszéd
    description: >-
      Mások mondatainak befejezése, beszélgetésekbe való beugrás, monológok
      egy kedvenc témáról.
  impatience:
    label: Türelmetlenség
    description: >-
      A sorban állás, a dugó vagy egy lassú válasz kivárása fizikailag nehezen
      elviselhető.
  task-initiation:
    label: Nehéz elkezdeni a feladatokat
    description: >-
      Pontosan tudni, mit kell tenni, és mégsem tudni elkezdeni. Néha ADHD-
      bénultságnak nevezik.
    aliases: [ADHD-bénultság, végrehajtó diszfunkció]
  procrastination:
    label: Halogatás
    description: >-
      A feladatok halasztása, amíg a határidő nyomása elég sürgetést nem ad a
      cselekvéshez.
  time-blindness:
    label: Idővakság
    description: >-
      Gyenge érzék arra, mennyi idő telt el és mennyi ideig tartanak a dolgok.
      Krónikus késés és túlvállalás a következménye.
    aliases: [időbeosztás, mindig késés]
  disorganisation:
    label: Szervezetlenség
    description: >-
      Kupacok, zsúfolt terek, kaotikus iratok, elveszett papírok.
  working-memory:
    label: Munkamemória-problémák
    description: >-
      Nehéz több dolgot egyszerre észben tartani: többlépéses utasításokat,
      fejszámolást, vagy hogy miért is jöttél be a szobába.
    aliases: [rövid távú memória]
  prioritising:
    label: Nehéz fontossági sorrendet felállítani
    description: >-
      Minden egyformán sürgősnek tűnik, vagy a legkevésbé fontos feladat
      készül el először, mert az a legérdekesebb.
  task-switching:
    label: Nehéz feladatot váltani
    description: >-
      Az átállás sokba kerül. Nehéz abbahagyni, amit csinálsz, és nehéz
      belekezdeni a következőbe.
  emotional-dysregulation:
    label: Érzelmi diszreguláció
    description: >-
      Az érzelmek gyorsan és erősen érkeznek, és tovább tart, míg
      lecsillapodnak, mint amit a helyzet indokolna.
    aliases: [hangulatingadozás]
  rejection-sensitivity:
    label: Elutasításra való érzékenység
    description: >-
      A vélt kritika, kirekesztés vagy elutasítás heves fájdalmat válthat ki.
      Ez nem ADHD-diagnosztikai kritérium, és nem csak ADHD mellett fordul
      elő, de együtt hathat az érzelmi diszregulációval és a korábbi kritikai
      tapasztalatokkal. Az ennél erősebb elutasítás-érzékenységi diszfória
      fogalomnak kevés kutatási alapja van.
    aliases: [RSD, elutasítás-érzékenységi diszfória]
  frustration-tolerance:
    label: Alacsony frusztrációtűrés
    description: >-
      Kis akadályok aránytalan dühöt válthatnak ki, vagy késztetést a teljes
      feladásra.
  boredom-intolerance:
    label: Az unalom elviselhetetlensége
    description: >-
      Az ingerszegénység kellemetlen. Az elme újdonságot vagy intenzitást
      keres, ahol csak talál.
  sleep-problems:
    label: Alvásproblémák
    description: >-
      Nehéz elaludni, eltolódott belső óra, és késő estig fennmaradás, hogy
      visszaszerezd az időt, amit a nap nem adott meg.
  rumination:
    label: Rágódás
    description: >-
      Ugyanaz az aggodalom ismétlődik körbe-körbe: a feladat, az e-mail, amit
      mondtál. Gondolkodásnak tűnik, de nem születik belőle döntés, és
      felemészti az energiát.
  avoidance:
    label: Elkerülés
    description: >-
      Kikerülni a feladatot, az üzenetet vagy az embert, aki a rettegést
      kiváltja. Megkönnyebbülés most, nagyobb gond később.
  out-of-sight:
    label: "Ami nincs szem előtt, nem létezik"
    description: >-
      Ami nem látható, az megszűnik létezni: a számla a fiókban, a zöldség a
      tej mögött, a barát, akinek nem írtál vissza.
  decision-paralysis:
    label: Döntésképtelenség
    description: >-
      Túl sok lehetőség, mindegyik döntést kíván, így egyik sem születik meg.
      A kupacok gyakran elhalasztott döntések halmai.
  anticipatory-anxiety:
    label: Rettegés a feladat előtt
    description: >-
      Szorongás, amely jóval a feladat előtt érkezik, és gyakran többe kerül,
      mint maga a feladat.
  catastrophising:
    label: Katasztrofizálás
    description: >-
      A lehető legrosszabb kimenetelre ugrani, és valószínűnek tartani: egy
      késve küldött e-mailből az állás elvesztése lesz.
  all-or-nothing:
    label: Mindent vagy semmit gondolkodás
    description: >-
      Ami nem tökéletes, az kudarcnak számít. Egy kihagyott edzés azt jelenti,
      hogy az egész terv romba dőlt.
  mind-reading:
    label: Gondolatolvasás
    description: >-
      Azt feltételezni, hogy tudod, mit gondolnak rólad mások, általában a
      legrosszabbat, anélkül, hogy megkérdeznéd.
  overgeneralisation:
    label: Túláltalánosítás
    description: >-
      Egyetlen kudarcból szabály lesz az egész életedről: „Ezt mindig
      elrontom.”
  should-statements:
    label: Kellene-mondatok
    description: >-
      Merev szabályok arról, hogyan kell viselkedned neked és másoknak. Minden
      nem teljesített „kellene” bűntudatot vagy dühöt szül.
  personalisation:
    label: Személyessé tétel
    description: >-
      Felelősséget vállalni olyan dolgokért, amelyek nem rajtad múlnak, vagy
      semleges eseményeket magadra venni.
  safety-behaviours:
    label: Biztonsági viselkedések
    description: >-
      Apró dolgok, amelyektől félelmetes helyzetekben biztonságosabbnak érzed
      magad: minden mondat elpróbálása, a kamera kikapcsolva, mindig van kiút.
      Megkönnyebbülést hoznak, és életben tartják a félelmet.
  sensory-sensitivity:
    label: Ingerérzékenység
    description: >-
      A hangok, szagok, anyagok vagy fények szokatlanul erősnek tűnhetnek,
      vagy folyton elvonhatják a figyelmet. Az érzékelési eltérésekről ADHD-s
      emberek gyakrabban számolnak be, de nem részei a diagnosztikai
      kritériumoknak, és más állapotokban is előfordulnak.
    aliases: [túlérzékenység]
    facts:
      - text: >-
          Egy ADHD-s felnőttekkel végzett vizsgálatban a nők 43%-a és a
          férfiak 22%-a számolt be érzékelési alul- vagy túlérzékenységről.
        source: bijlenga-2017
  misophonia:
    label: Mizofónia
    description: >-
      Heves düh vagy undor bizonyos hangokra, mint a rágás, a kopogás vagy a
      szipogás. Előfordulhat ADHD mellett, de a kettő kapcsolatát még
      kutatják.
    facts:
      - text: >-
          575 mizofóniás ember mintájában 5% számolt be ADHD-ról.
        source: jager-2020
  follow-through:
    label: Nehéz végigvinni a dolgokat
    description: >-
      Elkezdeni egy feladatot vagy az első utasítást, aztán elveszíteni a
      fonalat, mielőtt minden lépés elkészülne. A szándék valódi volt, a fonál
      nem tartott ki.
  losing-conversation-thread:
    label: Elveszíteni a fonalat beszélgetés közben
    description: >-
      A figyelem elcsúszik, miközben valaki beszél, így az elhangzottak egy
      része soha nem érkezik meg. Úgy néz ki, mintha nem figyelnél, pedig
      nagyon igyekszel követni.
  mind-wandering:
    label: Fokozott gondolati elkalandozás
    description: >-
      Rövid, össze nem függő gondolatok árama húzza el a figyelmet a
      feladattól. A rágódással ellentétben az elme témák között ugrál, nem egy
      aggodalom körül kering.
    aliases: [álmodozás]
  planning-sequencing:
    label: Nehéz tervezni és sorrendbe rakni
    description: >-
      Ismerni a célt, de nehezen választani sorrendet, átlátni, mi mitől függ,
      és ebből működőképes lépéssort csinálni.

  # ---------------------------------------------------------------- trigger
  boring-tasks:
    label: Unalmas vagy ismétlődő feladatok
    description: >-
      A kevéssé érdekes feladatok túl kevés ingert adnak a figyelem
      fenntartásához.
  poor-sleep:
    label: Alváshiány
    description: >-
      Sok ADHD-tünet rosszabb lehet egy rossz éjszaka után.
  noisy-environment:
    label: Zajos környezet
    description: >-
      Nyitott irodák, kávézók, háttérben szóló tévé.
  unclear-instructions:
    label: Homályos utasítások
    description: >-
      A homályos vagy csak szóban kapott feladatok nem adnak semmit, amibe
      kapaszkodni lehet.
  notifications:
    label: Értesítések és telefon
    description: >-
      Minden rezgés meghívás a feladat elhagyására.
  stress:
    label: Stressz és túlterheltség
    description: >-
      A túl sok egyidejű elvárás tovább szűkíti az amúgy is korlátozott
      végrehajtó kapacitást.
  long-meetings:
    label: Hosszú megbeszélések
    description: >-
      Egy óra passzív hallgatás, részvétel nélkül.
  open-ended-tasks:
    label: Nyílt végű feladatok
    description: >-
      Nincs világos kezdet, nincs világos vég, és nincs meghatározva, mikor
      kész.
  hunger:
    label: Éhség és kihagyott étkezések
    description: >-
      Elfelejteni enni, aztán összeomlani.
  strong-smells:
    label: Erős szagok
    description: >-
      Parfüm, tisztítószerek, a kolléga ebédje, az illatgyertya, amit valaki
      más szeret.
  crowded-places:
    label: Zsúfolt helyek
    description: >-
      Áruházak, pályaudvarok, bulik: sok hangforrás, mozgás és szag egyszerre.
  harsh-light:
    label: Éles fény és villódzás
    description: >-
      Fénycsövek, túl világos képernyők, vibráló lámpák, alacsonyan tűző nap a
      szélvédőn át.
  textures:
    label: Anyagok és címkék
    description: >-
      Kapargó szövetek, ruhacímkék, zoknivarrások, egy nedves ujj. Apró,
      állandó, lehetetlen figyelmen kívül hagyni.
  competing-demands:
    label: Túl sok egyszerre érkező elvárás
    description: >-
      Több kérés, döntés és befejezetlen feladat kér egyszerre figyelmet, és
      ettől nehéz kiválasztani és megtartani a következő lépést.
  unexpected-interruptions:
    label: Váratlan megszakítások
    description: >-
      Egy kérdés, egy hívás vagy egy sürgős kérés kettétöri a feladatot, és a
      visszatalálás többe kerül, mint maga a megszakítás.

  # ---------------------------------------------------------------- strategy
  body-doubling:
    label: Body doubling (közös munka)
    description: >-
      Munka egy másik ember mellett, egy szobában vagy videóhíváson, akinek a
      jelenléte megkönnyíti az elkezdést és a kitartást.
    aliases: [közös munka]
  pomodoro:
    label: Pomodoro-időzítő
    description: >-
      Rövid, időzített sprintekben dolgozni, közöttük szünetekkel. Az időzítő
      szerkezetet ad, és ami fontos, végpontot.
  visual-timers:
    label: Vizuális időzítők
    description: >-
      Az időt zsugorodó korongként vagy sávként mutató időzítők láthatóvá
      teszik az idő múlását.
  external-reminders:
    label: Ébresztők és külső emlékeztetők
    description: >-
      A memóriát kivinni a fejből: telefonos ébresztők, naptárértesítések,
      cetlik pont ott, ahol cselekedni kell.
  task-breakdown:
    label: Feladatok apró lépésekre bontása
    description: >-
      A „jelentést írni” helyett „megnyitni a dokumentumot, leírni egy
      címsort”. Az első lépés legyen szinte nevetségesen kicsi.
  checklists:
    label: Írott ellenőrzőlisták
    description: >-
      A tervet papírra tenni, hogy a munkamemóriának ne kelljen tartania.
  home-for-things:
    label: Mindennek megvan a helye
    description: >-
      Rögzített hely a kulcsnak, a pénztárcának, a szemüvegnek. Egy tál az
      ajtó mellett többet ér bármilyen gondolati jegyzetnél.
  exercise:
    label: Rendszeres testmozgás
    description: >-
      Az aerob mozgás néhány órára javíthatja a figyelmet és a hangulatot, és
      segítheti az alvást.
  sleep-routine:
    label: Állandó alvási rutin
    description: >-
      Rögzített ébredési idő, esti lecsendesedő rituálé, képernyők nélküli
      hálószoba.
  mindfulness:
    label: Tudatos jelenlét gyakorlása
    description: >-
      Rövid, rendszeres gyakorlás abban, hogy észrevedd az elkalandozó
      figyelmet és a feltörő érzelmeket, mielőtt átveszik az irányítást.
  fidget-tools:
    label: Fidget eszközök
    description: >-
      Ha a testnek van mit csinálnia, az felszabadíthatja a figyelmet
      ahelyett, hogy felemésztené.
  noise-control:
    label: Fejhallgató és fehér zaj
    description: >-
      A zajszűrős fejhallgató vagy az egyenletes háttérzaj csökkenti a hangok
      okozta figyelemelterelést.
  time-boxing:
    label: Időblokkok a naptárban
    description: >-
      Minden feladat kapjon helyet a naptárban, reális, általában hosszabb
      becsléssel.
  accountability-partner:
    label: Elszámoltathatósági partner
    description: >-
      Elmondani valakinek, mit mikorra csinálsz meg, majd beszámolni róla.
  routines:
    label: Rutinok és szokásláncolás
    description: >-
      Új szokásokat meglévő horgonyokhoz kötni (kávé után gyógyszer), hogy
      kevesebb döntés kelljen.
  prepare-night-before:
    label: Előkészülés előző este
    description: >-
      Ruha, táska, ebéd és kulcs előkészítve. A reggel ezután robotpilótán
      megy.
  externalise-memory:
    label: A munkamemória kihelyezése
    description: >-
      Táblák, jegyzetalkalmazások, hangjegyzetek. Rögzítsd a gondolatot abban
      a pillanatban, amikor felbukkan.
  dopamine-menu:
    label: Dopamin-menü
    description: >-
      Előre megírt lista egészséges, jutalmazó tevékenységekről, amelyekhez a
      végtelen görgetés helyett nyúlhatsz.
  gamification:
    label: Feladatok játékosítása
    description: >-
      Pontok, sorozatok, versenyfutás az idővel. Az újdonság és a verseny
      megteremti azt a sürgetést, ami az unalmas feladatokból hiányzik.
  single-tasking:
    label: Egyszerre egy feladat
    description: >-
      Egy fül, egy feladat, egy dolog az asztalon. Csökkentsd a
      figyelemelterelés támadási felületét.
  done-not-perfect:
    label: "A kész jobb, mint a tökéletes"
    description: >-
      Tudatosan alacsonyabbra tenni a lécet. A perfekcionizmus a halogatás
      gyakori hajtóereje.
  pause-before-acting:
    label: Szünet cselekvés előtt
    description: >-
      Beépített késleltetés: 24 óra egy vásárlás előtt, egy lassú lélegzet egy
      válasz előtt.
  self-compassion:
    label: Önegyüttérzés
    description: >-
      A botlásokat adatként kezelni, nem a kudarc bizonyítékaként. A szégyen
      táplálja az elkerülést.
  decision-reduction:
    label: Kevesebb döntés
    description: >-
      Kevesebb döntést kelljen hozni: állandó étkezések, kis ruhatár,
      alapértelmezett válaszok.
  movement-breaks:
    label: Mozgásszünetek
    description: >-
      Óránként egy rövid séta, egy lépcsősor vagy nyújtás. A sétálva tartott
      megbeszélés és az állóasztal is számít.
  write-it-down-instead:
    label: "Írd le, ne mondd ki"
    description: >-
      Beszélgetés közben jegyezd le a gondolatot papírra, hogy ne tolakodjon
      kifelé. Szóba hozhatod, amint a másik befejezte.
  item-trackers:
    label: Bluetooth nyomkövetők
    description: >-
      Kis címkék a kulcson, a pénztárcán és a táskán, és egy telefon, amely
      megcsörgeti őket. A húszperces keresésből húsz másodperc lesz.
  duplicate-essentials:
    label: A fontos dolgokból legyen kettő
    description: >-
      Pótkulcs a szomszédnál, töltő minden táskában, olvasószemüveg minden
      szobában. Egy példány elvesztése többé nem válság.
  final-review-pass:
    label: Záró ellenőrzés
    description: >-
      Külön, tudatos átnézés, amikor a munka késznek tűnik, lehetőleg szünet
      után és a saját tipikus hibáid rövid listája alapján.
  written-instructions:
    label: Kérj írásos utasítást
    description: >-
      Kérd a feladatokat üzenetben vagy e-mailben, vagy írd le, amit
      hallottál, és küldd vissza megerősítésre.
  repeat-back:
    label: Mondd vissza és foglald össze
    description: >-
      Mielőtt a beszélgetés véget ér, mondd el, mit értettél meg és mit fogsz
      tenni. A hiányok akkor derülnek ki, amikor még olcsó javítani őket.
  hyperfocus-exit:
    label: Kilépési rituálé a hiperfókuszból
    description: >-
      Kezdés előtt beállított kemény leállító ébresztő, víz és étel kéznél, és
      egy leírt sor arról, hol folytasd legközelebb.
  name-the-emotion:
    label: Nevezd meg az érzést
    description: >-
      Ha szavakba öntöd az érzést, például „ez frusztráció, nagyjából hetes a
      tízből”, kis rés nyílik az érzés és a reakció között.
  cooling-off-rule:
    label: Lehűlési szabály
    description: >-
      Megállapodás magaddal és a hozzád közel állókkal: nincs fontos válasz
      vagy döntés, amíg magas a hullám. Húsz perc múlva vagy másnap reggel
      nézd meg újra.
  ask-instead-of-assume:
    label: "Kérdezz, ne feltételezz"
    description: >-
      Ha egy üzenet elutasításnak hangzik, reagálás előtt ellenőrizd: „Úgy
      értetted, hogy...?” A vélt sértések többsége eltűnik, amint találkozik a
      tényekkel.
  distress-tolerance:
    label: Feszültségtűrő készségek
    description: >-
      A dialektikus viselkedésterápiából származó készségek a test gyors
      lecsillapítására: hideg víz az arcra, ütemezett légzés, egy rövid,
      intenzív mozgás.
  automatic-payments:
    label: Automatikus fizetések
    description: >-
      Csoportos beszedés minden rendszeres számlára, megtakarítás rögtön
      fizetéskor, egyetlen kártya az összes előfizetéshez. A rendszer
      emlékszik, hogy neked ne kelljen.
  subscription-audit:
    label: Előfizetés-átvizsgálás
    description: >-
      Néhány havonta ismétlődő emlékeztető, hogy sorold fel az összes
      előfizetést, és mondd le, amit már nem használsz.
  explain-your-adhd:
    label: "Mondd el, hogyan jelenik meg nálad az ADHD"
    description: >-
      Mondd el előre a párodnak, a barátaidnak és a kollégáidnak, mire
      számíthatnak, például késői válaszokra, közbevágásra vagy elvesztett
      fonálra, és mi segít.
  repair-routine:
    label: Helyreállítási rutin
    description: >-
      Megbeszélt mód arra, hogyan ismerd el a botlást, kérj bocsánatot és
      kezdj újra, hogy az elfelejtett ígéretek egyik oldalon se halmozódjanak
      nehezteléssé.
  shared-calendar:
    label: Közös naptár
    description: >-
      Egy naptár, amelyet a párod vagy a háztartás is lát: időpontok, iskolai
      események, tett ígéretek. Semmi nem él csak egy fejben.
  buffer-time:
    label: Időtartalék
    description: >-
      Tervezz tizenöt perccel korábbi érkezést és egy nappal a valódi határidő
      előtti befejezést. A tartalék felfogja az idővakságot.
  deadline-check-ins:
    label: Határidő-egyeztetések
    description: >-
      Közbenső mérföldkövek azzal megbeszélve, aki a munkára vár. Mindegyik
      egy kis határidő valódi sürgetéssel.
  recovery-time:
    label: Betervezett regenerálódás
    description: >-
      Tudatosan üresen hagyott idő a megterhelő napok után, a naptárban úgy
      védve, mint az alvás. Az egész napos ADHD-kompenzálásnak ára van, amit
      vissza kell fizetni.
  reduce-masking:
    label: Kevesebb maszkolás
    description: >-
      Válassz néhány helyet és embert, ahol abbahagyod a neurotipikus szerep
      játszását: fészkelődj, jegyzetelj, kérj ismétlést, menj el, ha kell.
  play-to-strengths:
    label: Építs az erősségeidre
    description: >-
      Tereld a munkát az érdeklődés vezérelte, kreatív, válsághelyzetben
      megoldandó feladatok felé, ahol az ADHD-s agy ragyog, a többit pedig
      tárgyald le vagy automatizáld.
  interest-pairing:
    label: Párosítsd az unalmast valami élvezetessel
    description: >-
      A kedvenc podcast csak házimunka közben, a papírmunka csak a jó
      kávézóban. Az élvezetes fél pótolhatja az ingerek egy részét, ami a
      feladatból hiányzik.
  behavioural-activation:
    label: Viselkedésaktiválás
    description: >-
      Minden napra egy kis kellemes vagy értelmes tevékenység betervezve, és
      megcsinálva, akár van kedved, akár nincs. A hangulat inkább követi a
      cselekvést, mint a cselekvés a hangulatot.
  morning-daylight:
    label: Reggeli napfény
    description: >-
      Tíz perc szabadtéri fény röviddel ébredés után lehorgonyozza a belső
      órát és emeli a hangulatot.
  social-contact:
    label: Társas kapcsolat
    description: >-
      Egy rövid hívás vagy egy séta valakivel, különösen azokon a napokon,
      amikor a legkevésbé van hozzá kedved. Az elszigetelődés táplálja a
      lehangoltságot.
  worry-window:
    label: Aggódási időablak
    description: >-
      Napi tizenöt perc félretéve arra, hogy minden aggodalmat leírj. Az
      ablakon kívül az aggodalom egy jegyzetet és egy időpontot kap a
      figyelmed helyett.
  less-alcohol:
    label: Kevesebb alkohol
    description: >-
      Az alkohol napokra ronthatja az alvást, az impulzivitást és a
      hangulatot. A visszafogás az egyik legolcsóbb elérhető javulás.
  nightly-reset:
    label: Tízperces esti visszaállítás
    description: >-
      Egy időzítő, egy kör a lakásban, minden vissza a helyére. Nem takarítás,
      csak visszaállítás. Elég kicsi ahhoz, hogy minden este megcsináld.
  one-surface:
    label: Egy felület egy körben
    description: >-
      Egy pult, egy fiók, egy sarok, aztán állj. Soha nem egész szobás
      maraton: a maraton sosem kezdődik el.
  doom-box:
    label: A „majd később” doboz
    description: >-
      Egy doboz a döntésre váró dolgok kupacának. A felület most tiszta, a
      döntések megvárnak egy nyugodtabb pillanatot.
    aliases: [kacatdoboz]
  own-less:
    label: Kevesebb tárgy
    description: >-
      Kevesebb tárgy kevesebb megjegyzendő helyet és kevesebb döntést jelent
      rendrakásonként. Egy be, egy ki.
  visible-storage:
    label: Látható tárolás
    description: >-
      Nyitott polcok, átlátszó dobozok, akasztók fiókok helyett. Ha a csukott
      ajtók eltüntetik a dolgokat, hagyd őket nyitva.
  sort-by-frequency:
    label: "Gyakoriság szerint rendezz, ne kategória szerint"
    description: >-
      A naponta használt dolgok karnyújtásnyira vannak attól, ahol használod
      őket. Minden más lehet távolabb és kevésbé rendezett.
  launch-pad:
    label: Indulóhely az ajtónál
    description: >-
      Egy hely a kulcsnak, a táskának, a pénztárcának és mindannak, aminek
      holnap el kell hagynia a lakást. Az indulás egyetlen mozdulat lesz.
  define-done:
    label: "Határozd meg, mi a kész"
    description: >-
      Kezdés előtt írj le egy mondatot arról, hogy néz ki a kész. A vég
      nélküli feladat olyan feladat, amely sosem kezdődik el.
  five-minute-rule:
    label: Ötperces szabály
    description: >-
      Vállalj csak öt percet a rettegett dologból. Öt perc után abbahagyni
      szabad. Legtöbbször nem fogod.
  thought-record:
    label: Gondolatnapló
    description: >-
      Írd le a helyzetet, az automatikus gondolatot, az érzést és az
      erősségét, a mellette és ellene szóló bizonyítékokat, és egy
      kiegyensúlyozottabb gondolatot. A klasszikus KVT-munkalap.
  decatastrophising:
    label: Dekatasztrofizálás
    description: >-
      Három kérdés: mi a legrosszabb, ami történhet, mennyire valószínű
      valójában, és hogyan birkóznék meg vele, ha megtörténne?
  behavioural-experiments:
    label: "Teszteld, amitől félsz"
    description: >-
      A KVT-ben viselkedéskísérletnek hívják. Írd le pontosan, mi szerinted
      fog rosszul elsülni, és mennyire vagy biztos benne, egy tízes skálán.
      Aztán csináld meg egyszer, a szokásos óvintézkedések nélkül. Utána írd
      le, mi történt valójában. A jóslat és az eredmény közötti különbség
      változtatja meg a meggyőződést. Az, hogy mondják, ne aggódj, nem
      változtatja meg.
  graded-exposure:
    label: Fokozatos expozíció
    description: >-
      Rangsorold a félelmetes helyzeteket könnyűtől nehézig, és haladj felfelé
      a létrán, mindegyikben addig maradva, amíg a szorongás magától lecseng.
      Az elkerülés szűkíti a világot, az expozíció újra kitágítja.
  structured-problem-solving:
    label: Strukturált problémamegoldás
    description: >-
      Fogalmazd meg a problémát egy mondatban, sorold fel az összes
      lehetőséget ítélkezés nélkül, válassz egyet, tervezd meg az első lépést,
      utána értékelj. A rágódásból döntést csinál.
  mood-diary:
    label: Hangulat- és tevékenységnapló
    description: >-
      Egy héten át óráról órára jegyezd fel, mit csináltál és hogyan érezted
      magad. A minta megmutatja, mely tevékenységek emelik a hangulatot, és
      melyek merítik le.
  relaxation-breathing:
    label: Ütemezett légzés és izomlazítás
    description: >-
      Lassú, kilégzésre hangsúlyos légzés, vagy az izomcsoportok sorban
      történő megfeszítése és ellazítása. Megtanítja a testnek a
      kikapcsológombot.
  relapse-plan:
    label: Visszaesés-megelőzési terv
    description: >-
      Egy megírt oldal: korai figyelmeztető jelek, mi segített legutóbb, kit
      hívj. Jó napokon írva, rosszabb napokon olvasva.
  psychoeducation:
    label: "Értsd meg, hogyan működik a szorongás"
    description: >-
      Ha érted az üss-vagy-fuss reakciót, hogy az elkerülés miért táplálja a
      félelmet, és hogy a szorongás mindig tetőzik, majd lecseng, az sokat
      elvesz az erejéből.
  earplugs:
    label: Hétköznapi füldugók
    description: >-
      Szűrős füldugók, amelyek tompítják a csúcsokat, de nem nyelik el a
      beszédet, a kulcscsomón, hogy mindig kéznél legyenek.
  control-the-environment:
    label: Irányítsd a környezetet
    description: >-
      Válaszd meg az ülőhelyet, a helyiséget és a napszakot. Illatmentes
      termékek otthon, szabályozható fény, csendes sarok a munkahelyen. Eleve
      kevesebb inger.
  comfortable-clothes:
    label: "Ruhák, amelyek jól esnek"
    description: >-
      Vágd ki a címkéket, vedd meg újra ugyanazokat a puha anyagokat, zokniban
      soha ne alkudj. A kényelem nem kényeskedés, ha az alternatíva egész
      napos figyelemelterelés.
  quiet-after-loud:
    label: Csend a hangos napok után
    description: >-
      Betervezett csend egy zajos nap után: se zene, se hívások, tompa fény. A
      regenerálódás a terv része, nem luxus.
  leave-early:
    label: Engedély a távozásra
    description: >-
      Előre megbeszélve magaddal és a társasággal, hogy egy hangos helyről
      korán eljönni rendben van. Ha tudod, hogy van kiút, már az elején kisebb
      a teher.
  planning-time-to-plan:
    label: Tervezz időt a tervezésre
    description: >-
      Vedd be magát a tervezést a naptárba, rövid napi sávként. Nélküle a nap
      reagálással kezdődik, és a tervezés az a lépés, amely elsőként kimarad.
  master-list:
    label: Egyetlen gyűjtőlista mindenre
    description: >-
      Egyetlen lista, amely minden vállalást tartalmaz, nagyot és kicsit
      egyaránt. Nem ebből dolgozol, hanem ez az, amit nem kell többé a
      fejedben cipelned.
  daily-shortlist:
    label: Rövid lista a mai napra
    description: >-
      Minden nap másolj át néhány pontot a gyűjtőlistáról. Egy rövid lista
      befejezhető, és csak a befejezett lista építi a bizalmat a rendszerben.
  underschedule:
    label: Szándékosan tervezz kevesebbet
    description: >-
      Tervezz kevesebb feladatot, mint amennyi szerinted belefér, és hagyj
      több helyet köztük, mint amennyi szükségesnek tűnik. Az időbecslés a
      gyenge pont, tehát a tervnek kell elnyelnie a hibát.
  if-then-plans:
    label: Ha-akkor tervek
    description: >-
      Döntsd el előre, mit teszel egy adott megszakításkor: ha üzenet érkezik,
      akkor megvárja ennek a blokknak a végét. A döntés egyszer születik meg,
      nyugodt fejjel, nem minden alkalommal újra.
  smallest-step:
    label: Nevezd meg a legkisebb első mozdulatot
    description: >-
      Nem a feladatot, még csak nem is az első lépést, hanem a legkisebb
      fizikai mozdulatot, amely pozícióba hoz: a fájl nyitva a képernyőn, a
      cipő az ajtónál.
  escape-behaviours:
    label: Ismerd a menekülőutaidat
    description: >-
      Mindenkinek van egy rövid listája arról, amit ehelyett megbízhatóan
      csinál: a postafiók, a hűtő, egy gyors ügyintézés. Ha megnevezed őket, a
      késztetésből jelzés lesz, hogy épp kerülsz valamit.
  anticipation-ratio:
    label: Hozd egyensúlyba az elvárásaidat
    description: >-
      Egy rettegett feladat előtt a legtöbben csak azt számolják, ami
      kellemetlen lesz. Vedd hozzá azt is, ami a másik oldalon igaz: időben
      korlátozott, szabad rosszul megcsinálni, és készen lenni jobb érzés,
      mint tovább cipelni.
  accept-discomfort:
    label: "Kezdd el anélkül, hogy készen éreznéd magad"
    description: >-
      A kellemetlenség általában nem a kezdés előtt múlik el, hanem röviddel
      utána. A megfelelő hangulatra várni az, ami egy feladatból egy hetet
      csinál.
  behavioural-scripts:
    label: Szedd szét a saját forgatókönyveidet
    description: >-
      Egyes sorozatok maguktól futnak: hazaérkezés, kanapé, telefon, oda az
      este. Ha leírod a sorozatot, kiderül, hol van valójában a döntési pont.
  reframe-time:
    label: Tegyél valódi számot az időre
    description: >-
      Kérdezd meg, meddig tart a feladat valójában, ne azt, meddig érződik.
      Egy napi lista legtöbb pontja egy óránál kevesebbet kíván, és a határ
      nélküli feladat az, amely soha nem kezdődik el.
  manage-energy:
    label: Tudatosan oszd be a legjobb óráidat
    description: >-
      A figyelem nem egyformán elérhető a nap során. Tedd az igényes munkát
      azokra az órákra, amikor tényleg megvan, a gépieset pedig a többire.
  earned-rewards:
    label: A menekülésből legyen megszolgált jutalom
    description: >-
      Amibe menekülni szoktál, áttehető a feladat túloldalára. Ugyanaz a fél
      óra a neten egészen mást jelent előtte és utána.
  defense-attorney:
    label: Képviseld a másik oldalt
    description: >-
      Egy kemény gondolat azért meggyőző, mert csak az egyik felet hallgattad
      meg. Szándékosan mondd el az ellenérveket, ahogy egy védőügyvéd tenné,
      mielőtt elfogadod az ítéletet.
  method-acting:
    label: "Viselkedj úgy, mint aki megcsinálja"
    description: >-
      Viselkedj úgy, mint aki már vezet naptárat vagy megírja azt az e-mailt,
      még mielőtt természetesnek éreznéd. Az ismétlés teszi természetessé, nem
      fordítva.
  values-commitment:
    label: "Kösd a feladatot ahhoz, ami fontos neked"
    description: >-
      Egy unalmas feladatot, amely valami számodra fontosat szolgál, könnyebb
      elkezdeni, mint azt, amit csak szükségesként védesz. Nevezd meg, mit
      szolgál.
  problem-template:
    label: Írott sablon a problémákhoz
    description: >-
      Fogalmazd meg a problémát egy mondatban, sorold fel a lehetőségeket
      ítélkezés nélkül, válassz, tervezd meg az első lépést, utána értékelj. A
      sablon elvégzi azt a gondolkodást, amire az adott pillanat nem képes.
  face-uncertainty:
    label: "Dönts, mielőtt a dolog eldönti magát"
    description: >-
      Egy döntés kiülése is döntés, méghozzá általában a legrosszabb, mert a
      lehetőségek csendben lejárnak. Bizonytalanságban cselekedni jobb, mint
      túl későn.
  planned-distraction:
    label: Tervezd be a figyelemelterelést
    description: >-
      Adj a játékoknak, a hírfolyamoknak és a képernyőknek valódi helyet a
      napban, ahelyett hogy a réseket foglalnák el. A betervezett szabadidő
      már nem versenyez minden mással.
  coping-drift:
    label: "Számíts rá, hogy a rendszer megcsúszik"
    description: >-
      Minden rendszer megcsúszik néhány jó hét után. Kezeld ezt normálisként,
      és tervezd meg előre az újraindítást, ahelyett hogy annak
      bizonyítékaként olvasnád, hogy semmit nem tudsz fenntartani.

  # ---------------------------------------------------------------- treatment
  assessment:
    label: Diagnózis és kivizsgálás
    description: >-
      Egy képzett szakember hivatalos kivizsgálása a kapu a kezeléshez és az
      alkalmazkodásokhoz.
    aliases: [diagnózis, kivizsgálás]
    facts:
      - text: >-
          Az aktuális ADHD-diagnózissal élő amerikai felnőttek körülbelül fele
          18 évesen vagy később kapta meg a diagnózist.
        source: cdc-adult-adhd
  medication:
    label: Gyógyszeres kezelés
    description: >-
      Stimuláns és nem stimuláns gyógyszerek, orvos által felírva és követve.
      Sok felnőtt számára elsőként választandó kezelés.
    aliases: [stimulánsok, metilfenidát]
    facts:
      - text: >-
          Az ADHD-s amerikai felnőttek nagyjából harmada szedett stimuláns
          gyógyszert az előző évben. Közülük 71,5%-nak okozott nehézséget a
          recept kiváltása, mert a gyógyszer nem volt elérhető.
        source: cdc-adult-adhd
  cbt:
    label: ADHD-specifikus KVT
    description: >-
      ADHD-hoz igazított kognitív viselkedésterápia: készségek a tervezéshez,
      a halogatáshoz és a nem segítő gondolkodási mintákhoz.
    aliases: [KVT, kognitív viselkedésterápia]
  coaching:
    label: ADHD-coaching
    description: >-
      Gyakorlati, célorientált támogatás olyan rendszerek és rutinok
      kialakításához, amelyek illenek az emberhez.
  workplace-accommodations:
    label: Munkahelyi alkalmazkodások
    description: >-
      Rugalmas munkaidő, írásos utasítások, csendes munkahely, határidő-
      egyeztetések.
  psychotherapy:
    label: Pszichoterápia
    description: >-
      Beszélgetős terápia képzett terapeutával a szorongásra, a lehangoltságra
      és az énképre, amelyek gyakran az ADHD köré nőnek.
  crisis-help:
    label: "Ha besötétedik: kérj segítséget most"
    description: >-
      Ha a gondolatok afelé fordulnak, hogy nem akarsz itt lenni, még ma
      keress fel egy orvost, hívj egy krízisvonalat vagy a sürgősségi számot.
      Ez orvosi helyzet, nem jellemhiba.
  professional-organiser:
    label: Professzionális rendszervező vagy takarító
    description: >-
      Fizetett segítség egy olyan otthon kialakításához, amely önmagát
      működteti, vagy a fenntartásához. Alkalmazkodás, nem kudarc.

  # ---------------------------------------------------------------- impact
  missed-deadlines:
    label: Elmulasztott határidők
    description: >-
      A munka későn vagy egyáltalán nem készül el, jó szándék és valódi
      erőfeszítés ellenére.
  relationship-strain:
    label: Megterhelt kapcsolatok
    description: >-
      Az elfelejtett ígéretek, a közbevágások és az érzelmi kitörések felőrlik
      a párkapcsolatot, a barátságokat és a munkatársi viszonyokat.
  low-self-esteem:
    label: Alacsony önértékelés
    description: >-
      Évekig tartó „csak igyekezz jobban” visszajelzés után marad az érzés,
      hogy lusta vagy elromlott vagy.
  burnout:
    label: Kiégés
    description: >-
      A tünetek elfedése és folyamatos ellensúlyozása kimerítő.
  financial-trouble:
    label: Pénzügyi gondok
    description: >-
      Késedelmi díjak, elfelejtett előfizetések, impulzusvásárlások.
  inconsistent-performance:
    label: Egyenetlen teljesítmény munkában vagy tanulásban
    description: >-
      Eredmények, amelyek a kiválótól a késveig vagy a semmiig ingadoznak,
      gyakran ugyanolyan feladatnál. A különbség aközött van, ami egy jó napon
      lehetséges, és aközött, ami egy átlagos napon történik, nem a szándék és
      a képesség között.
    aliases: [alulteljesítés]
  energy-drain:
    label: Energiaveszteség
    description: >-
      Az aggódással, maszkolással és kompenzálással töltött órák kimerültsége,
      amiért cserébe nincs semmi felmutatható.
  sensory-overload:
    label: Ingertúlterhelés
    description: >-
      Túl sok inger egyszerre: ingerlékenység, leblokkolás, késztetés a szoba
      elhagyására. Órákkal később is emészti az energiát.
  driving-risk:
    label: Vezetés és baleseti kockázat
    description: >-
      Népességszinten az ADHD magasabb baleseti kockázattal jár együtt. Az
      elterelhetőség, az impulzivitás és az alváshiány a volán mögött vagy
      gépek körül többet nyom a latban. Ez csoportszintű megállapítás, és
      semmit nem mond egyetlen vezetőről sem.
    facts:
      - text: >-
          Egy svéd népességvizsgálatban a gyógyszeres időszakok 58%-kal
          alacsonyabb súlyos közlekedési baleseti aránnyal jártak együtt az
          ADHD-s férfiaknál. A szerzők becslése szerint e balesetek 41-49%-a
          elkerülhető lett volna kezeléssel.
        source: chang-2014

  # ---------------------------------------------------------------- condition
  anxiety:
    label: Szorongás
    description: >-
      A szorongásos zavarok az ADHD mellett gyakrabban fordulnak elő, mint az
      átlagnépességben. Az aggodalom, a testi feszültség és az elkerülés
      hasonlíthat az ADHD tüneteire, és azok fel is erősíthetik. A
      szorongásnak saját kivizsgálás és kezelés jár.
    facts:
      - text: >-
          A világ népességének nagyjából 5,8%-a, körülbelül 470 millió ember
          élt szorongásos zavarral 2023-ban.
        source: who-anxiety
      - text: >-
          A szorongásos zavarral élők közül, akiknek kezelésre lenne
          szükségük, csak körülbelül minden negyedik kap bármilyen ellátást:
          27,6%.
        source: who-anxiety
      - text: >-
          A lányok és a nők gyakrabban élnek át szorongásos zavart, mint a
          fiúk és a férfiak.
        source: who-anxiety
      - text: >-
          Vizsgálatok összesítése alapján az ADHD-s felnőttek körében
          nagyjából ötszörös volt a szorongásos zavar esélye az ADHD nélküli
          felnőttekhez képest.
        source: hartman-2023
  depression:
    label: Depresszió
    description: >-
      A depresszió az ADHD mellett gyakrabban fordul elő, mint az
      átlagnépességben. A lehangoltság, az érdeklődés elvesztése és a
      kimerültség nem egyszerűen egy nehéz hét következménye. A depressziónak
      saját kivizsgálás és kezelés jár. Ha a gondolataid afelé fordulnak, hogy
      nem akarsz itt lenni, kérj segítséget még ma.
    facts:
      - text: >-
          A felnőttek nagyjából 5,2%-a élt depresszív zavarral világszerte
          2023-ban: a férfiak 4,1%-a és a nők 6,2%-a.
        source: who-depression
      - text: >-
          Ez körülbelül 322 millió ember.
        source: who-depression
      - text: >-
          A depresszió körülbelül 1,5-szer gyakoribb a nők körében, mint a
          férfiaknál.
        source: who-depression
      - text: >-
          Vizsgálatok összesítése alapján az ADHD-s felnőttek körében
          nagyjából négy és félszeres volt a depresszió esélye az ADHD nélküli
          felnőttekhez képest.
        source: hartman-2023
  substance-use:
    label: Szerhasználati problémák
    description: >-
      A szerhasználati zavarok az ADHD mellett gyakrabban fordulnak elő. A
      szereket néha a nyugtalanság, az alvás, a hangulat vagy a feszültség
      kezelésére használják, de rontják a működést, és saját kivizsgálás és
      kezelés jár nekik.
    facts:
      - text: >-
          Vizsgálatok összesítése alapján az ADHD-s felnőttek körében
          nagyjából négy és félszeres volt a szerhasználati zavar esélye az
          ADHD nélküli felnőttekhez képest.
        source: hartman-2023

  # ---------------------------------------------------------------- situation
  chaotic-home:
    label: Káosz a lakásban
    description: >-
      Kupacok minden felületen, egy konyha, amely sosem áll vissza magától, és
      az érzés, hogy a lakás nyer. Itt több tünet halmozódik egymásra, ezért
      az akaraterő önmagában nem oldja meg.
  dreaded-task:
    label: "Egy feladat, amitől rettegek"
    description: >-
      Az e-mail, az űrlap, a telefonhívás. Ott ül, minden nap nagyobb lesz, és
      elindít egy kört, amely több energiába kerül, mint megcsinálni.
  money-admin:
    label: Pénzügyi adminisztráció
    description: >-
      Számlák, előfizetések, adók, a fiók, amit hónapok óta nem nyitottál meg.
      A feledékenység, az elkerülés és az impulzivitás itt találkozik.
  loud-evening-out:
    label: Hangos étterem vagy buli
    description: >-
      Mindenki egyszerre beszél, szól a zene, melletted valaki rág. A
      beszélgetés követése többe kerül, mint amennyit ad.
  getting-out-the-door:
    label: Időben kijutni az ajtón
    description: >-
      Az indulás előtti utolsó húsz perc, amikor több apró gond torlódik
      egyszerre: a kulcs, az idő, a dolog, amit vinni akartál.
  meetings-and-lectures:
    label: "Megbeszélés, óra vagy előadás"
    description: >-
      Egy óra ülés és hallgatás, mozgás nélkül, a kéznek is alig valamivel,
      miközben a beszélgetés fonala folyton elcsúszik.
  messages-and-inbox:
    label: Üzenetek és a túlcsorduló postafiók
    description: >-
      A megválaszolatlan üzenetek gyűlnek. Mindegyik döntést kíván, némelyikre
      kockázatos válaszolni, és ami nincs szem előtt, az gyorsan feledésbe
      merül.
  bedtime-and-waking:
    label: Lefekvés és felkelés
    description: >-
      Az este nyúlik, az érdekeset nehéz letenni, és a reggel előbb jön, mint
      hogy az éjszaka késznek érződne.
  health-admin:
    label: "Időpontok, receptek és egészségügyi ügyintézés"
    description: >-
      Időpontfoglalás, átfoglalás, űrlapok, ismételt receptek és
      visszahívások. Az egészség körüli ügyintézés épp azokat a készségeket
      kívánja, amelyeket az ADHD drágává tesz.

  # ---------------------------------------------------------------- mechanism
  dopamine-boost:
    label: Dopamin- és noradrenalinszint emelkedik
    description: >-
      Egy lehetséges hatásmechanizmus. Az aerob mozgás néhány órára
      megemelheti ugyanazokat a hírvivő anyagokat, amelyekre az ADHD-
      gyógyszerek hatnak. Ez a magyarázat egy része, nem az egésze.
  deeper-sleep:
    label: Mélyebb alvás
    description: >-
      A fizikai fáradtság megkönnyítheti az elalvást és mélyítheti az alvást,
      ami másnap szinte mindent javít.
  stress-hormones-drop:
    label: Csökkennek a stresszhormonok
    description: >-
      A mozgás levezetheti a stresszreakciót, így a test nem jelez többé
      veszélyt az elmének.
  energy-discharged:
    label: Levezetett nyugtalanság
    description: >-
      A belső motor kap egy szelepet, és utána a nyugodt ülés kevesebbe
      kerülhet.
  mood-lift:
    label: Hangulatjavulás
    description: >-
      Gyakran átmeneti hangulatjavulás, amely összeadódik, ha a legtöbb napon
      megtörténik.

edges:
  substance-use-adhd:
    note: >-
      Népességek között talált összefüggés. A kivizsgálás oka, nem elvárás
      bárkivel szemben.
  adhd-anxiety:
    note: >-
      ADHD mellett gyakoribb, mint az átlagnépességben. A szorongás
      figyelmetlenségnek is látszhat, ezért a kivizsgálás mindkettőt
      mérlegeli.
  adhd-depression:
    note: >-
      ADHD mellett gyakoribb, mint az átlagnépességben. A hosszú éveken át
      tartó nehézségek kockázati tényezők, de a depresszió önálló betegség, és
      saját kezelés jár neki.
  hyperfocus-time-blindness:
    note: >-
      A hiperfókuszban órák tűnnek el.
  sleep-problems-time-blindness:
    note: >-
      A lefekvés egyre későbbre csúszik, mert az este rövidebbnek tűnik, mint
      amilyen.
  avoidance-dreaded-task:
    note: >-
      Semmi nem készült el, a határidő közelebb van, és a feladat nagyobbnak
      látszik, mint korábban.
  safety-behaviours-anticipatory-anxiety:
    note: >-
      A megkönnyebbülés, amit hoznak, arra tanítja az agyat, hogy a helyzet
      tényleg veszélyes volt.
  sensory-sensitivity-sensory-overload:
    note: >-
      Minden hang és szag egy kevés figyelembe kerül. Estére elfogy a keret.
  mind-wandering-rumination:
    note: >-
      Mindkettő befelé húzza a figyelmet, de az elkalandozás témák között
      ugrál, a rágódás pedig egy körül kering.
  driving-risk-distractibility:
    note: >-
      Népességszintű összefüggés, nem állítás egyetlen vezetőről sem.
  body-doubling-task-initiation:
    note: >-
      A másik ember jelenléte adja meg az indítójelet, amit az agy magától nem
      termel meg.
  pomodoro-task-initiation:
    note: >-
      Ha csak 25 percre kötelezed el magad, kisebb az elkezdés ára.
  pomodoro-hyperfocus:
    note: >-
      A szünetjelzés külső megszakítás egy olyan munkamenethez, amely különben
      órákig tartana.
  fidget-tools-fidgeting:
    note: >-
      Mederbe tereli a mozgást ahelyett, hogy elnyomná.
  routines-task-switching:
    note: >-
      Egy rögzített átállási rituálé kiszámíthatóvá teszi a váltást.
  pause-before-acting-rejection-sensitivity:
    note: >-
      Ha vársz, mielőtt egy vélt sértésre válaszolsz, az első érzelemhullámnak
      van ideje elvonulni.
  write-it-down-instead-interrupting:
    note: >-
      A közbevágás kényszere gyakran a gondolat elvesztésétől való félelem. Ha
      papíron van, várhat.
  explain-your-adhd-relationship-strain:
    note: >-
      A késői válaszokat és az elvesztett fonalat könnyebb megbocsátani, ha
      előre be voltak jelentve.
  buffer-time-missed-deadlines:
    note: >-
      Kezeld a tartalékot valódi határidőként. Az igazi csak biztonsági háló.
  reduce-masking-burnout:
    note: >-
      A maszkolás több energiába kerül, mint amennyit a körülötted lévők
      látnak.
  five-minute-rule-avoidance:
    note: >-
      Öt perc elég kicsi az elkezdéshez, és az elkezdés az egész probléma.
  exercise-dopamine-boost:
    note: >-
      Néhányan utána egy-két órán át könnyebb összpontosítást tapasztalnak. A
      mozgás kiegészíti a kezelést, nem helyettesíti.
  thought-record-rumination:
    note: >-
      A rágódás körbe-körbe jár; a gondolatnapló előrehalad, mert egy
      kiegyensúlyozott gondolattal végződik.
  graded-exposure-avoidance:
    note: >-
      Minden lépés legyen elég kicsi ahhoz, hogy tényleg megtedd, és ismételd,
      amíg unalmassá nem válik.
  explain-your-adhd-sensory-sensitivity:
    note: >-
      Aki melletted rág, nem hallja, amit te hallasz. Ha előre elmondod, a
      veszekedésből ülésrend lesz.
  smallest-step-task-initiation:
    note: >-
      Olyan kicsi, hogy képtelenség lenne megtagadni. A kezdés a drága rész.
  escape-behaviours-procrastination:
    note: >-
      Nem tudsz megszakítani egy szokást, amit észre sem vettél.
  anticipation-ratio-procrastination:
    note: >-
      Általában nem a feladatot kerülöd, hanem a jóslatot.
  behavioural-scripts-procrastination:
    note: >-
      A forgatókönyv azelőtt lefut, hogy döntés születne, tehát a döntést
      előbbre kell hozni.
  earned-rewards-procrastination:
    note: >-
      Ugyanaz a tevékenység jutalommá válik menekülés helyett, pusztán az
      áthelyezéstől.
  defense-attorney-catastrophising:
    note: >-
      Kérdezd meg, milyen bizonyíték kellene az elítéléshez, aztán nézd meg,
      megvan-e.
  method-acting-task-initiation:
    note: >-
      A szerep eljátszása jön először; az érzés utána következik, néha jóval
      később.
  face-uncertainty-decision-paralysis:
    note: >-
      A meg nem hozott döntés magától lejár, és a lejárt változat ritkán az,
      amit szerettél volna.
  coping-drift-inconsistent-performance:
    note: >-
      Ha a visszatérés előre meg van tervezve, a megcsúszás napokba kerül, nem
      hónapokba.
  medication-dopamine-boost:
    note: >-
      Ez a hatásmechanizmus a stimuláns gyógyszerekre vonatkozik. A nem
      stimuláns szerek másképp hatnak.
  assessment-sensory-sensitivity:
    note: >-
      Az erős, egész életen át tartó érzékenységet érdemes a kivizsgáláson
      szóba hozni. Átfed az autizmussal, és ez megváltoztatja, milyen
      alkalmazkodások segítenek.
  anxiety-depression-overlap:
    note: >-
      A kettő gyakran együtt jár, és mindegyik megnehezítheti a másik
      felismerését és kezelését.
