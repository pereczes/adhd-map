# ADHD map: structure only. Ids, node kinds and relationships.
#
# All human-readable text (labels, descriptions, edge notes, interface
# strings) lives in data/lang/<code>.yaml, one file per language, keyed by
# the ids defined here. data/languages.yaml lists the available languages.
#
# Ids are lowercase with hyphens. Every edge must reference existing ids.
# An edge needs an explicit id only when a language file attaches a note
# to it. Run tools/validate-data.py after editing.
#
# Node fields
#   kind      drives colour and size, and the badge shown in the panel
#   scope     how the node relates to an ADHD diagnosis. Required on every
#             symptom node so that nothing can quietly read as diagnostic:
#               core            a diagnostic manifestation of ADHD
#               associated      commonly reported, not a diagnostic criterion
#               transdiagnostic a pattern that is not specific to ADHD
#               co-occurring    a condition that often occurs alongside ADHD
#               unspecified     not yet classified
#   evidence  how well supported a strategy or treatment is, as context
#             rather than proof. Support varies by what it is used for:
#               guideline  recommended in clinical guidance
#               research   some supporting research
#               reported   widely reported, limited research
#
# Relation boundaries that are easy to blur
#   related_to      a conceptual or within-person connection between
#                   experiences
#   associated_with a documented population-level association, with no claim
#                   about cause in any individual
#   leads_to        a path the map asserts can follow, shown to the reader as
#                   "can lead to"
#   feeds           a step in a vicious cycle, drawn thick and offered as a
#                   whole loop in the panel
#   produces        a chaining relation: the panel follows it one hop further
#                   to show what a strategy reaches

start: adhd

kinds:
  hub:       { color: "#5c6bc0", size: 3 }
  cluster:   { color: "#7e57c2", size: 2 }
  symptom:   { color: "#ef5350", size: 1 }
  trigger:   { color: "#ffa726", size: 1 }
  strategy:  { color: "#66bb6a", size: 1 }
  treatment: { color: "#26a69a", size: 1 }
  impact:    { color: "#a1887f", size: 1 }
  condition: { color: "#607d8b", size: 1 }
  situation: { color: "#f06292", size: 2 }
  mechanism: { color: "#42a5f5", size: 1 }

relations:
  includes:        { color: "#78909c", directed: true }
  related_to:      { color: "#90a4ae", directed: false, dashed: true }
  associated_with: { color: "#b39ddb", directed: false, dashed: true }
  worsens:         { color: "#ffa726", directed: true }
  helps_with:      { color: "#66bb6a", directed: true }
  reduces:         { color: "#26a69a", directed: true }
  leads_to:        { color: "#e57373", directed: true }
  involves:        { color: "#f06292", directed: true }
  feeds:           { color: "#ff7043", directed: true, loop: true }
  produces:        { color: "#42a5f5", directed: true, via: true }

