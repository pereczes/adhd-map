# ADHD map: structure only. Ids, node kinds and relationships.
#
# All human-readable text (labels, descriptions, edge notes, interface
# strings) lives in data/lang/<code>.yaml, one file per language, keyed by
# the ids defined here. data/languages.yaml lists the available languages.
#
# Ids are lowercase with hyphens. Every edge must reference existing ids.
# An edge needs an explicit id only when a language file attaches a note
# to it. Run tools/validate-data.py after editing.

start: adhd

kinds:
  hub:       { color: "#5c6bc0", size: 3 }
  cluster:   { color: "#7e57c2", size: 2 }
  symptom:   { color: "#ef5350", size: 1 }
  trigger:   { color: "#ffa726", size: 1 }
  strategy:  { color: "#66bb6a", size: 1 }
  treatment: { color: "#26a69a", size: 1 }
  impact:    { color: "#a1887f", size: 1 }

relations:
  includes:   { color: "#78909c", directed: true }
  related_to: { color: "#90a4ae", directed: false, dashed: true }
  worsens:    { color: "#ffa726", directed: true }
  helps_with: { color: "#66bb6a", directed: true }
  reduces:    { color: "#26a69a", directed: true }
  leads_to:   { color: "#e57373", directed: true }

