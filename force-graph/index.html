<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ADHD map</title>
  <link rel="stylesheet" href="../shared/style.css">
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/force-graph@1.51.4/dist/force-graph.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="toolbar">
      <h1 data-ui="title">ADHD map</h1>
      <span class="prototype-name" data-ui="prototype_force_graph">Prototype B: force-graph</span>
      <span class="spacer"></span>
      <input id="search" type="search" list="node-list" data-ui-placeholder="find_node" placeholder="Find a node" autocomplete="off">
      <datalist id="node-list"></datalist>
      <button id="fit" type="button" data-ui="fit">Fit</button>
      <button id="expand-all" type="button" data-ui="expand_all">Expand all</button>
      <button id="reset" type="button" data-ui="reset">Reset</button>
      <select id="language" aria-label="Language"></select>
      <a class="switch" href="../cytoscape/" data-ui="switch_to_cytoscape" data-keep-lang>Switch to Cytoscape.js</a>
    </header>
    <main class="graph">
      <div id="graph"></div>
      <div id="legend" class="legend"></div>
    </main>
    <aside id="panel" class="panel"></aside>
  </div>
  <script src="../shared/graph-data.js"></script>
  <script src="../shared/i18n.js"></script>
  <script src="../shared/explorer.js"></script>
  <script src="../shared/panel.js"></script>
  <script src="app.js"></script>
</body>
</html>
